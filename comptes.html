<!doctype html>
<html lang="fr" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comptes</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>&#x1F4B6;</text></svg>">
<!--
  COMPTES - application de suivi budgétaire.

  VOUS LISEZ CE TEXTE DANS GOOGLE DRIVE ?
  C'est normal : le site drive.google.com affiche le texte des fichiers HTML
  sans jamais les exécuter (par sécurité). Vos comptes ne sont pas abîmés.
  Pour utiliser l'application, ouvrez ce fichier depuis votre ordinateur :
    - avec « Google Drive pour ordinateur », dans le dossier Google Drive
      (lecteur G: sous Windows, « Google Drive » dans le Finder sur Mac) ;
    - ou téléchargez-le (bouton de téléchargement en haut à droite), puis
      double-cliquez dessus.

  Vos comptes s'enregistrent automatiquement dans le navigateur. Une copie
  de sauvegarde (menu ... > Télécharger une copie de sauvegarde) contient
  l'application et toutes vos données. Pour vérifier les calculs : ajoutez
  #autotest à la fin de l'adresse.
-->
<style>
/* ==========================================================================
   Comptes — feuille de style
   Principes : ce qui se modifie a l'air d'un champ ; ce qui se calcule a l'air
   d'un résultat ; un chiffre qui change s'illumine un instant.
   Palette issue du système de visualisation validé (bleu / orange, contrôlés
   pour les daltonismes, en clair comme en sombre).
   ========================================================================== */

:root {
  color-scheme: light;

  --plan:        #f3f3f0;
  --surface:     #fcfcfb;
  --surface-2:   #f3f2ef;
  --surface-3:   #e8e7e1;
  --encre:       #0b0b0b;
  --encre-2:     #45443f;   /* texte secondaire, 9:1 sur la surface */
  --encre-3:     #6f6d67;   /* texte discret, 5:1 : lisible même petit */
  --filet:       #e3e2db;
  --ligne-base:  #c3c2b7;
  --bord:        rgba(11, 11, 11, .10);

  --fond-champ:  #ffffff;
  --bord-champ:  #cdccc4;

  --serie-1:     #2a78d6;   /* charges fixes */
  --serie-2:     #eb6834;   /* dépenses variables */
  --serie-1-clair: #cde2fb;
  --accent:      #2a78d6;

  --bon:         #0ca30c;
  --bon-texte:   #006300;
  --alerte:      #fab219;
  --critique:    #c72f2f;

  --ombre-1: 0 1px 2px rgba(11, 11, 11, .05);
  --ombre-2: 0 6px 20px rgba(11, 11, 11, .08);
  --ombre-3: 0 12px 32px rgba(11, 11, 11, .12);

  --r-xl: 16px; --r-l: 12px; --r-m: 9px; --r-s: 7px;
  --police: system-ui, -apple-system, "Segoe UI", sans-serif;

  --haut-tete: 53px;
  --haut-nav:  46px;
}

@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --plan: #0d0d0d; --surface: #1a1a19; --surface-2: #222221; --surface-3: #2e2e2c;
    --encre: #ffffff; --encre-2: #d2d1c8; --encre-3: #a3a198;
    --filet: #2e2e2c; --ligne-base: #45453f; --bord: rgba(255, 255, 255, .11);
    --fond-champ: #111110; --bord-champ: #4a4a45;
    --serie-1: #3987e5; --serie-2: #d95926; --serie-1-clair: #184f95; --accent: #3987e5;
    --bon-texte: #2fbf2f; --critique: #ef6a6a;
    --ombre-1: 0 1px 2px rgba(0, 0, 0, .35);
    --ombre-2: 0 6px 20px rgba(0, 0, 0, .4);
    --ombre-3: 0 12px 32px rgba(0, 0, 0, .5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plan: #0d0d0d; --surface: #1a1a19; --surface-2: #222221; --surface-3: #2e2e2c;
  --encre: #ffffff; --encre-2: #d2d1c8; --encre-3: #a3a198;
  --filet: #2e2e2c; --ligne-base: #45453f; --bord: rgba(255, 255, 255, .11);
  --fond-champ: #111110; --bord-champ: #4a4a45;
  --serie-1: #3987e5; --serie-2: #d95926; --serie-1-clair: #184f95; --accent: #3987e5;
  --bon-texte: #2fbf2f; --critique: #ef6a6a;
  --ombre-1: 0 1px 2px rgba(0, 0, 0, .35);
  --ombre-2: 0 6px 20px rgba(0, 0, 0, .4);
  --ombre-3: 0 12px 32px rgba(0, 0, 0, .5);
}

* { box-sizing: border-box; }

/* Un élément masqué l'est toujours, même si son style lui donne un display. */
[hidden] { display: none !important; }

/* Quand le navigateur amène un champ à l'écran (clavier, lien), il le place sous
   l'en-tête, la navigation et le mini-bilan, jamais caché derrière. */
html { scroll-padding-top: calc(var(--haut-tete) + var(--haut-nav) + 72px); }

body {
  margin: 0;
  background: var(--plan);
  color: var(--encre);
  font-family: var(--police);
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

h1, h2, h3 { margin: 0; font-weight: 650; letter-spacing: -.012em; }
.cache { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.pousse { flex: 1 1 auto; }
.chiffres { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }

/* Un chiffre qui vient de changer s'illumine un instant : on voit l'effet de sa saisie. */
@keyframes eclat {
  0%   { background-color: color-mix(in srgb, var(--accent) 30%, transparent); }
  100% { background-color: transparent; }
}
.eclat { animation: eclat 1.2s ease-out; border-radius: 6px; }
@keyframes arrivee {
  0%   { background-color: color-mix(in srgb, var(--accent) 22%, var(--surface)); }
  100% { background-color: transparent; }
}

/* ---------------------------------------------------------------- En-tête --- */

.tete {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 10px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--filet);
}
.tete__marque { display: flex; align-items: center; gap: 10px; }
.tete__logo {
  display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px;
  background: var(--accent); color: #fff; font-weight: 700;
}
.tete__marque h1 { font-size: 1.05rem; }

.mois {
  display: flex; align-items: center; gap: 2px;
  background: var(--surface-2); border: 1px solid var(--bord);
  border-radius: 999px; padding: 3px;
}
.mois__fleche {
  appearance: none; border: 0; background: none; cursor: pointer;
  width: 30px; height: 30px; border-radius: 50%;
  color: var(--encre-2); font-size: 1.2rem; line-height: 1;
}
.mois__fleche:hover { background: var(--surface-3); color: var(--encre); }
.mois__choix {
  appearance: none; border: 0; background: none; cursor: pointer;
  padding: 3px 10px; font: inherit; font-size: 1rem; font-weight: 650;
  color: var(--encre); text-align: center;
}
.tete__actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }

/* ------------------------------------------------------------ Navigation --- */

.nav {
  position: sticky; top: var(--haut-tete); z-index: 30;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding: 7px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--filet);
}
.nav__lien {
  appearance: none; border: 0; background: none; cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 14px; border-radius: 999px;
  color: var(--encre-2); font: inherit; font-size: .92rem; white-space: nowrap;
}
.nav__lien:hover { background: var(--surface-2); color: var(--encre); }
.nav__lien[aria-current="page"] { background: var(--accent); color: #fff; font-weight: 600; }
.nav__lien[aria-current="page"] .nav__jeton { background: rgba(255, 255, 255, .22); color: #fff; }
.nav__separateur { width: 1px; height: 22px; margin: 0 6px; background: var(--filet); }
.nav__groupe { display: flex; gap: 4px; flex-wrap: wrap; }
.nav__jeton {
  padding: 1px 8px; border-radius: 999px; background: var(--surface-3); color: var(--encre-2);
  font-size: .78rem; font-variant-numeric: tabular-nums;
}

main { max-width: 940px; margin: 0 auto; padding: 20px 16px 90px; }
main.large { max-width: 1180px; }

/* --------------------------------------------------------------- Contrôles --- */

.bouton {
  appearance: none; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 36px; padding: 6px 14px;
  border: 1px solid var(--bord-champ); border-radius: var(--r-s);
  background: var(--surface); color: var(--encre);
  font: inherit; font-size: .9rem; font-weight: 500;
}
.bouton:hover { background: var(--surface-2); }
.bouton--primaire { background: var(--accent); border-color: transparent; color: #fff; }
.bouton--primaire:hover { background: var(--accent); filter: brightness(1.08); }
.bouton--discret { border-color: transparent; background: none; color: var(--encre-2); }
.bouton--discret:hover { background: var(--surface-2); color: var(--encre); }
.bouton--icone { width: 36px; padding: 0; font-size: 1.1rem; }
.danger { color: var(--critique); }

/* Un champ modifiable ressemble toujours à un champ. */
.champ {
  width: 100%; min-width: 0; height: 38px; padding: 6px 10px;
  border: 1px solid var(--bord-champ); border-radius: var(--r-s);
  background: var(--fond-champ); color: var(--encre);
  font: inherit; font-size: 1rem;
}
.champ:hover { border-color: var(--encre-3); }
.champ:focus { outline: none; border-color: var(--accent);
               box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.champ::placeholder { color: var(--encre-3); opacity: .8; }
.champ--nombre { text-align: right; font-variant-numeric: tabular-nums; }
select.champ { cursor: pointer; }

.champ-euro, .champ-pourcent { position: relative; display: block; }
.champ-euro .champ, .champ-pourcent .champ { padding-right: 26px; }
.champ-euro::after, .champ-pourcent::after {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  color: var(--encre-3); font-size: .9rem; pointer-events: none;
}
.champ-euro::after { content: "€"; }
.champ-pourcent::after { content: "%"; }

.champ-inline { display: inline-flex; align-items: center; gap: 10px; font-size: .92rem; color: var(--encre-2); }
.champ-inline .champ-euro, .champ-inline .champ-pourcent { width: 118px; }

.bascule {
  appearance: none; margin: 0; cursor: pointer; flex: none;
  width: 38px; height: 22px; border-radius: 999px;
  background: var(--ligne-base); border: 0; position: relative;
  transition: background .15s ease;
}
.bascule::after {
  content: ""; position: absolute; top: 3px; left: 3px;
  width: 16px; height: 16px; border-radius: 50%; background: #fff;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .25); transition: transform .15s ease;
}
.bascule:checked { background: var(--accent); }
.bascule:checked::after { transform: translateX(16px); }

.menu { position: relative; }
.menu > summary { list-style: none; }
.menu > summary::-webkit-details-marker { display: none; }
.menu__contenu {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 50;
  min-width: 260px; padding: 6px;
  background: var(--surface); border: 1px solid var(--bord);
  border-radius: var(--r-l); box-shadow: var(--ombre-3);
}
.menu__contenu button {
  display: block; width: 100%; text-align: left; padding: 9px 11px; border: 0;
  border-radius: var(--r-s); background: none; color: inherit; font: inherit; font-size: .92rem; cursor: pointer;
}
.menu__contenu button:hover { background: var(--surface-2); }
.menu__contenu hr { border: 0; border-top: 1px solid var(--filet); margin: 5px 2px; }

/* ============================================================== LE BILAN === */

.bilan {
  position: relative;
  margin-bottom: 20px; padding: 18px 20px 16px;
  background: var(--surface);
  border: 1px solid var(--bord); border-radius: var(--r-xl);
  box-shadow: var(--ombre-2);
}
.bilan__haut { display: flex; align-items: flex-end; gap: 12px 24px; flex-wrap: wrap; }
.bilan__etiquette { font-size: .82rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--encre-2); }
.bilan__valeur {
  display: inline-block; margin-top: 2px; padding: 0 4px; margin-left: -4px;
  font-size: 3rem; font-weight: 700; line-height: 1.05; letter-spacing: -.03em;
}
.bilan__valeur--negatif { color: var(--critique); }

/* L'équation dit en toutes lettres d'où vient le chiffre. */
.bilan__equation {
  display: flex; align-items: baseline; gap: 6px 10px; flex-wrap: wrap;
  margin-left: auto; font-size: .95rem; color: var(--encre-2);
}
.bilan__equation b { color: var(--encre); font-variant-numeric: tabular-nums; padding: 0 3px; }
.bilan__operateur { color: var(--encre-3); font-weight: 600; }

.bilan__piste {
  display: flex; gap: 2px; overflow: hidden; height: 18px; margin: 16px 0 10px;
  border-radius: 999px; background: var(--surface-3);
}
.bilan__part { height: 100%; min-width: 2px; transition: width .35s ease; }
.bilan__part--fixes { background: var(--serie-1); }
.bilan__part--variables { background: var(--serie-2); }
.bilan__part--fin { border-radius: 0 4px 4px 0; }

.bilan__legende { display: flex; gap: 8px 20px; flex-wrap: wrap; font-size: .9rem; color: var(--encre-2); }
.bilan__cle { display: inline-flex; align-items: center; gap: 8px; }
.bilan__cle b { color: var(--encre); font-variant-numeric: tabular-nums; padding: 0 2px; }
.bilan__cle small { color: var(--encre-3); font-size: .82rem; }
.pastille { width: 12px; height: 12px; border-radius: 3px; flex: none; display: inline-block; }
.pastille--fixes { background: var(--serie-1); }
.pastille--variables { background: var(--serie-2); }
.pastille--reste { background: var(--surface-3); border: 1px solid var(--ligne-base); }

.bilan__prevu {
  margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--filet);
  font-size: .88rem; color: var(--encre-2);
}
.bilan__prevu b { color: var(--encre); font-variant-numeric: tabular-nums; }
.bilan__alerte {
  display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 9px 12px;
  border-radius: var(--r-m); background: color-mix(in srgb, var(--critique) 12%, var(--surface));
  color: var(--critique); font-size: .9rem; font-weight: 600;
}

/* Mini-bilan : une bande pleine largeur juste sous la navigation.
   En position fixe il ne prend aucune place (la page ne peut pas sauter) ;
   sur les pages Courses et Heures il est posé dans la page (classe .pose). */
.bilan-mini {
  position: fixed; z-index: 25; left: 0; right: 0;
  top: calc(var(--haut-tete) + var(--haut-nav));
  background: var(--surface); border-bottom: 1px solid var(--filet); box-shadow: var(--ombre-2);
  opacity: 0; visibility: hidden; transform: translateY(-6px);
  transition: opacity .18s ease, transform .18s ease, visibility .18s;
}
.bilan-mini.visible { opacity: 1; visibility: visible; transform: none; }
.bilan-mini.pose { position: sticky; box-shadow: none; transition: none; }
.bilan-mini__int {
  display: flex; align-items: center; gap: 6px 16px;
  max-width: 940px; margin: 0 auto; padding: 8px 20px;
}
.bilan-mini.pose .bilan-mini__int { max-width: 1180px; }
.bilan-mini__etiquette { font-size: .8rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--encre-2); white-space: nowrap; }
.bilan-mini__valeur { font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; padding: 0 3px; white-space: nowrap; }
.bilan-mini__valeur--negatif { color: var(--critique); }
.bilan-mini .bilan__piste { flex: 1 1 120px; height: 10px; margin: 0; }
.bilan-mini__calcul { font-size: .86rem; color: var(--encre-2); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ============================================================= LES BLOCS === */

.bloc {
  margin-bottom: 20px; background: var(--surface);
  border: 1px solid var(--bord); border-radius: var(--r-xl);
  box-shadow: var(--ombre-1); overflow: hidden;
}
.bloc__tete {
  display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap;
  padding: 16px 20px; border-bottom: 1px solid var(--filet);
}
.bloc__titre { display: flex; align-items: baseline; gap: 2px 12px; flex-wrap: wrap; flex: 1 1 240px; min-width: 0; }
.bloc__titre .bloc__sous { flex-basis: 100%; }
.bloc__titre h2 { font-size: 1.15rem; }
.bloc__chiffre { font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; padding: 0 3px; }
.bloc__sous { font-size: .88rem; color: var(--encre-3); font-variant-numeric: tabular-nums; }

.bloc__aide {
  display: flex; gap: 6px 18px; flex-wrap: wrap; align-items: center;
  padding: 9px 20px; background: var(--surface-2); border-bottom: 1px solid var(--filet);
  font-size: .84rem; color: var(--encre-2);
}
.bloc__aide span { display: inline-flex; align-items: center; gap: 6px; }
.texte-bon { color: var(--bon-texte); font-weight: 600; }
.texte-mauvais { color: var(--critique); font-weight: 600; }

/* ------------------------------------------------ Formulaire d'ajout --- */

.ajout {
  display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px;
  padding: 16px 20px; background: color-mix(in srgb, var(--accent) 6%, var(--surface));
  border-bottom: 1px solid var(--filet);
}
.ajout[hidden] { display: none; }
.ajout__titre { width: 100%; margin: 0; font-weight: 650; }
.ajout__champ { display: grid; gap: 4px; font-size: .84rem; color: var(--encre-2); flex: 1 1 130px; }
.ajout__champ--large { flex: 2 1 220px; }
.ajout__actions { display: flex; gap: 8px; margin-left: auto; }

/* ------------------------------------------------ Groupes repliables --- */

.groupe { border-bottom: 1px solid var(--filet); }
.groupe:last-child { border-bottom: 0; }
.groupe > summary {
  display: grid; align-items: center; gap: 4px 16px; cursor: pointer; list-style: none;
  grid-template-columns: 30px minmax(0, 1fr) 180px 200px;
  min-height: 64px; padding: 10px 20px;
  user-select: none;
}
.groupe > summary::-webkit-details-marker { display: none; }
.groupe > summary:hover { background: var(--surface-2); }
.groupe[open] > summary { background: var(--surface-2); border-bottom: 1px solid var(--filet); }

.groupe__chevron {
  display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
  background: var(--surface-3); color: var(--encre-2); font-size: .8rem;
  transition: transform .18s ease;
}
.groupe[open] .groupe__chevron { transform: rotate(90deg); background: var(--accent); color: #fff; }
.groupe__nom { font-weight: 650; font-size: 1.02rem; }
.groupe__compte { display: block; font-weight: 400; font-size: .82rem; color: var(--encre-3); }

.groupe__part { display: grid; gap: 4px; }
.groupe__piste { display: block; height: 7px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.groupe__jauge { display: block; height: 100%; border-radius: 999px; background: var(--encre-3); transition: width .3s ease; }
.groupe__part-texte { font-size: .8rem; color: var(--encre-3); }

.groupe__montants { text-align: right; font-variant-numeric: tabular-nums; }
.groupe__reel { font-weight: 700; font-size: 1.08rem; padding: 0 3px; }
.groupe__prevu { display: block; font-size: .8rem; color: var(--encre-3); white-space: nowrap; }

.groupe__corps { padding: 4px 0 12px; }
.groupe__pied { padding: 8px 20px 0 64px; }

/* --------------------------------------------------------- Une ligne --- */

.colonnes, .ligne {
  display: grid; align-items: center; gap: 4px 12px;
  grid-template-columns: 44px minmax(0, 1fr) 132px 132px 112px 40px;
  padding: 0 20px;
}
.colonnes {
  min-height: 34px;
  font-size: .74rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--encre-3);
}
.colonnes span:nth-child(3), .colonnes span:nth-child(4), .colonnes span:nth-child(5) { text-align: right; }

.ligne { min-height: 56px; padding-top: 6px; padding-bottom: 6px; }
.ligne + .ligne { border-top: 1px solid var(--filet); }
.ligne:hover { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
.ligne--neuve { animation: arrivee 2s ease-out; }

.ligne__actif { display: flex; justify-content: flex-start; }
.ligne__libelle { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ligne__libelle .champ { font-weight: 500; }
.ligne__montants { display: contents; }
.montant { display: block; min-width: 0; }
.montant__etiquette { display: none; }
.ligne__ecart { text-align: right; white-space: nowrap; font-size: .92rem; font-variant-numeric: tabular-nums; color: var(--encre-3); }
.ligne__ecart .texte-bon, .ligne__ecart .texte-mauvais { padding: 0 3px; }
.ligne__plus { display: flex; justify-content: flex-end; }

/* Ligne en pause : visiblement hors jeu. */
.ligne--pause .ligne__libelle .champ, .ligne--pause .montant .champ { color: var(--encre-3); text-decoration: line-through; background: var(--surface-2); }
.badge {
  flex: none; padding: 2px 9px; border-radius: 999px;
  font-size: .76rem; font-weight: 600; white-space: nowrap;
}
.badge--pause { background: var(--surface-3); color: var(--encre-2); }

/* Pastille de nature : la même couleur que dans la barre du bilan. */
.jeton-nature {

}

/* Un montant calculé par un module ne ressemble pas à un champ. */
.valeur-auto {

}

/* Le jeton du module est posé sur le bord du cadre : le montant garde toute la largeur. */
.valeur-auto__badge {

/* ================================================================ MODULES === */

.modules { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.module {
  display: grid; gap: 12px; align-content: start; padding: 18px 20px;

}

.graphique { width: 100%; }

.bandeau { display: grid; gap: 12px; margin-bottom: 16px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }

/* ======================================================= RETOURS VISUELS === */

.vide { padding: 22px 16px; margin: 10px 20px; text-align: center; color: var(--encre-2); font-size: .92rem; background: var(--surface-2); border: 1px dashed var(--bord-champ); border-radius: var(--r-l); }

const REVENUS_INITIAUX = [

/* [semaine, jour, matin début, matin fin, après-midi début, après-midi fin] */
const CRENEAUX_INITIAUX = [
  [1, 0, '10:04', '11:30', '13:36', '17:00'],
  [1, 3, '09:30', '11:30', '12:30', '15:00'],
  [2, 0, '10:00', '11:30', '12:44', '13:28'],
  [3, 3, '09:30', '12:16', '12:48', '13:19'],

/* ========================================================================== */
/* 2. Calculs                                                                 */
/* ========================================================================== */

/** Arrondit un montant au centime. */
function eur(valeur) {
  const nombre = Number(valeur);
  if (!Number.isFinite(nombre)) return 0;
  return Math.round(nombre * 100 + (nombre < 0 ? -1e-6 : 1e-6)) / 100;
}

/** Lit un montant saisi à la française : « 1 234,56 » ou « 12,50 € » -> nombre. */
function nombre(valeur) {
  if (valeur === null || valeur === undefined || valeur === '') return 0;
  if (typeof valeur === 'number') return eur(valeur);
  let texte = String(valeur).trim()
    .replace(/[\s\u00a0\u202f]/g, '')
    .replace(/\u20ac/g, '');
  // « 1.234,56 » : le point sépare les milliers, la virgule les décimales.
  if (texte.includes(',') && texte.includes('.')) texte = texte.replace(/\./g, '');
  texte = texte.replace(',', '.');
  if (texte === '' || texte === '-' || texte === '.' || texte === '-.') return 0;
  const lu = Number(texte);
  return Number.isFinite(lu) ? eur(lu) : 0;
}

/** « 09:30 », « 9h30 » ou « 9 » -> minutes depuis minuit. null si illisible. */
function minutesDepuisHeure(texte) {
  if (texte === null || texte === undefined) return null;
  const propre = String(texte).trim().toLowerCase().replace(/h/g, ':').replace(/\./g, ':');
  if (!propre) return null;
  const morceaux = propre.split(':');
  const heures = Number(morceaux[0]);
  const minutes = morceaux.length > 1 && morceaux[1] !== '' ? Number(morceaux[1]) : 0;
  if (!Number.isInteger(heures) || !Number.isInteger(minutes)) return null;
  if (heures < 0 || heures > 23 || minutes < 0 || minutes > 59) return null;
  return heures * 60 + minutes;
}

/** 570 -> « 09:30 ». */
function heureDepuisMinutes(minutes) {
  if (minutes === null || minutes === undefined) return '';
  const total = ((Math.trunc(minutes) % 1440) + 1440) % 1440;
  return String(Math.floor(total / 60)).padStart(2, '0') + ':' +
         String(total % 60).padStart(2, '0');
}

/** Durée d'une plage en minutes. 0 si incomplète ou incohérente. */
function dureePlage(debut, fin) {
  const a = minutesDepuisHeure(debut);
  const b = minutesDepuisHeure(fin);
  if (a === null || b === null || b <= a) return 0;
  return b - a;
}

/** Durée d'une journée = matin + après-midi. */
function dureeCreneau(creneau) {
  return dureePlage(creneau.matinDebut, creneau.matinFin) +
         dureePlage(creneau.apremDebut, creneau.apremFin);
}

/** 891 -> « 14 h 51 ». */
function formatDuree(minutes) {
  const total = Math.round(minutes || 0);
  return Math.floor(total / 60) + ' h ' + String(total % 60).padStart(2, '0');
}

/** Heures gardées puis salaire brut / cotisations / net. */
function recapHeures(creneaux, tauxHoraire, tauxCotisation) {
  const parSemaine = new Map();
  let total = 0;
  for (const creneau of creneaux) {
    const duree = dureeCreneau(creneau);
    total += duree;
    const semaine = Number(creneau.semaine) || 1;
    parSemaine.set(semaine, (parSemaine.get(semaine) || 0) + duree);
  }
  const heures = total / 60;
  const brut = eur(heures * (Number(tauxHoraire) || 0));
  const cotisation = eur(brut * (Number(tauxCotisation) || 0) / 100);
  return {
    minutes: total,
    heures,
    duree: formatDuree(total),
    tauxHoraire: eur(tauxHoraire),
    tauxCotisation: Math.round((Number(tauxCotisation) || 0) * 100) / 100,
    brut,
    cotisation,
    net: eur(brut - cotisation),
    parSemaine: Array.from(parSemaine.keys()).sort((a, b) => a - b)
      .map(s => ({ semaine: s, minutes: parSemaine.get(s), duree: formatDuree(parSemaine.get(s)) })),
  };
}

/** Suivi hebdomadaire des courses. */
function recapCourses(semaines, achats, budgetTotal) {
  const depenseParSemaine = new Map();
  const parPoste = new Map();
  let total = 0;

  for (const achat of achats) {
    const montant = eur(achat.montant);
    const semaine = Number(achat.semaine) || 1;
    depenseParSemaine.set(semaine, eur((depenseParSemaine.get(semaine) || 0) + montant));
    const poste = (achat.poste || 'Autre').trim() || 'Autre';
    parPoste.set(poste, eur((parPoste.get(poste) || 0) + montant));
    total = eur(total + montant);
  }

  const lignes = semaines.map(semaine => {
    const budget = eur(semaine.budget);
    const depense = eur(depenseParSemaine.get(Number(semaine.numero)) || 0);
    return { numero: Number(semaine.numero), budget, depense, restant: eur(budget - depense) };
  });

  const budget = eur(budgetTotal);
  return {
    semaines: lignes,
    budgetTotal: budget,
    budgetSemaines: eur(lignes.reduce((s, l) => s + l.budget, 0)),
    depense: total,
    restant: eur(budget - total),
    parPoste: Array.from(parPoste.entries())
      .map(([poste, montant]) => ({ poste, montant }))
      .sort((a, b) => b.montant - a.montant),
  };
}

function cumulVide() { return { estime: 0, reel: 0 }; }

function cumule(cumul, estime, reel) {
  cumul.estime = eur(cumul.estime + estime);
  cumul.reel = eur(cumul.reel + reel);
}

function sommeCumuls(...cumuls) {
  const total = cumulVide();
  for (const cumul of cumuls) cumule(total, cumul.estime, cumul.reel);
  return total;
}

/**
 * Totaux du mois.
 * Une ligne en pause garde son montant affiché mais ne compte pas :
 * c'est l'équivalent des colonnes « Actif / Ref » du tableau d'origine.
 */
function recapBudget(lignes) {
  const groupes = {};
  for (const type of TYPES) for (const nature of NATURES) groupes[type + '-' + nature] = cumulVide();

  const parCategorie = new Map();
  const parCategorieRevenus = new Map();
  const enPause = [];
  const garde = cumulVide();
  const caf = cumulVide();

  for (const ligne of lignes) {
    const cle = ligne.type + '-' + ligne.nature;
    if (!groupes[cle]) continue;
    // Une ligne en pause sort entièrement des totaux : ni son prévu, ni son réel
    // ne comptent. Désactiver une dépense doit se voir immédiatement dans le reste.
    const actif = !!ligne.actif;
    const estimeSaisi = eur(ligne.estime);
    const estime = actif ? estimeSaisi : 0;
    const reel = actif ? eur(ligne.reel) : 0;

    cumule(groupes[cle], estime, reel);

    if (!actif && estimeSaisi) {
      enPause.push({ id: ligne.id, libelle: ligne.libelle || '',
                     categorie: ligne.categorie || '', estime: estimeSaisi });
    }

    if (ligne.type !== 'depense') {
      const categorie = (ligne.categorie || '').trim() || 'Sans catégorie';
      if (!parCategorieRevenus.has(categorie)) {
        parCategorieRevenus.set(categorie, { categorie, estime: 0, reel: 0, nb: 0, enPause: 0 });
      }
      const cumulRevenu = parCategorieRevenus.get(categorie);
      cumule(cumulRevenu, estime, reel);
      cumulRevenu.nb += 1;
      if (!actif) cumulRevenu.enPause += 1;
    }

    if (ligne.type === 'depense') {
      const categorie = (ligne.categorie || '').trim() || 'Sans catégorie';
      if (!parCategorie.has(categorie)) {
        parCategorie.set(categorie, { categorie, estime: 0, reel: 0, nb: 0, enPause: 0 });
      }
      const cumulCategorie = parCategorie.get(categorie);
      cumule(cumulCategorie, estime, reel);
      cumulCategorie.nb += 1;
      if (!actif) cumulCategorie.enPause += 1;
    }

    const lien = (ligne.lien || '').trim();
    if (lien === 'garde') cumule(garde, estime, reel);
    else if (lien === 'caf') cumule(caf, estime, reel);
  }

  const depenses = sommeCumuls(groupes['depense-fixe'], groupes['depense-variable']);
  const salaires = sommeCumuls(groupes['salaire-fixe'], groupes['salaire-variable']);
  const aides = sommeCumuls(groupes['aide-fixe'], groupes['aide-variable']);
  const revenus = sommeCumuls(salaires, aides);

  return {
    depenses,
    depensesFixes: groupes['depense-fixe'],
    depensesVariables: groupes['depense-variable'],
    salaires, aides, revenus,
    restant: { estime: eur(revenus.estime - depenses.estime),
               reel: eur(revenus.reel - depenses.reel) },
    /* Positif = on a dépensé moins que prévu (le « Surplus » du tableau). */
    surplus: { estime: 0, reel: eur(depenses.estime - depenses.reel) },
    garde, caf,
    gardeNette: { estime: eur(garde.estime - caf.estime), reel: eur(garde.reel - caf.reel) },
    enPause: enPause.sort((a, b) => b.estime - a.estime),
    economieEnPause: eur(enPause.reduce((s, l) => s + l.estime, 0)),
    parCategorieRevenus: Array.from(parCategorieRevenus.values()),
    parCategorie: Array.from(parCategorie.values()).sort((a, b) => {
      const ecart = Math.max(b.reel, b.estime) - Math.max(a.reel, a.estime);
      return ecart !== 0 ? ecart : a.categorie.localeCompare(b.categorie, 'fr');
    }),
  };
}

/** Assemble les trois récapitulatifs d'un mois. */
function recap(mois) {
  return {
    budget: recapBudget(mois.lignes),
    courses: recapCourses(mois.semaines, mois.achats, budgetCourses(mois)),
    heures: recapHeures(mois.creneaux, mois.tauxHoraire, mois.tauxCotisation),
  };
}

/* ========================================================================== */
/* 3. Stockage dans le navigateur                                             */
/* ========================================================================== */

/** Toutes les données de l'application. */
let D = null;
let stockageDisponible = true;

/* Protection entre onglets : chaque enregistrement porte un numéro de révision.
   Un onglet qui n'a pas vu la dernière révision n'a pas le droit d'écrire
   par-dessus : il se met d'abord à jour. */
let revisionConnue = 0;
let derniereSignature = null;
const CHAMPS_META = new Set(['revision', 'modifieLe', 'fichierLe', 'fichierRevision']);

function moisCourantLibelle() {
  const maintenant = new Date();
  return maintenant.getFullYear() + '-' + String(maintenant.getMonth() + 1).padStart(2, '0');
}

function testeStockage() {
  try {
    const sonde = CLE_STOCKAGE + '.sonde';
    localStorage.setItem(sonde, '1');
    localStorage.removeItem(sonde);
    return true;
  } catch (erreur) {
    return false;
  }
}

/** Empreinte du contenu, sans les informations d'enregistrement : sert à ne
    rien réécrire (ni compter comme modification) quand rien n'a changé. */
function signatureContenu(donnees) {
  return JSON.stringify(donnees, (cle, valeur) => CHAMPS_META.has(cle) ? undefined : valeur);
}

/** Lecture des données du navigateur. Ne renvoie jamais « rien » quand il y a
    quelque chose d'illisible : l'appelant doit pouvoir le mettre à l'abri. */
function lisNavigateur() {
  if (!stockageDisponible) return { etat: 'absent' };
  let brut = null;
  try { brut = localStorage.getItem(CLE_STOCKAGE); } catch (e) { return { etat: 'absent' }; }
  if (!brut) return { etat: 'absent' };
  try {
    const donnees = validees(JSON.parse(brut));
    return donnees ? { etat: 'ok', donnees } : { etat: 'corrompu', brut };
  } catch (erreur) {
    return { etat: 'corrompu', brut };
  }
}

/** Données enregistrées DANS le fichier comptes.html (copies de sauvegarde, voir telechargeCopie). */
function lisIntegrees() {
  const bloc = document.getElementById('donnees-integrees');
  if (!bloc) return null;
  try { return validees(JSON.parse(bloc.textContent || 'null')); } catch (e) { return null; }
}

function revisionStockee() {
  try { return Number(localStorage.getItem(CLE_REVISION)) || 0; } catch (e) { return 0; }
}

/** Écriture brute, vérifiée par relecture. */
function ecritStockage() {
  const texte = JSON.stringify(D);
  localStorage.setItem(CLE_STOCKAGE, texte);
  localStorage.setItem(CLE_REVISION, String(D.revision));
  if (localStorage.getItem(CLE_STOCKAGE) !== texte) {
    throw new Error('la relecture ne correspond pas à ce qui a été écrit');
  }
  revisionConnue = D.revision;
}

/**
 * Enregistre dans le navigateur.
 * Renvoie 'ok', 'inchange', 'conflit' (un autre onglet a écrit entre-temps :
 * rien n'est écrasé) ou 'echec'.
 */
function enregistreDonnees(options = {}) {
  if (!stockageDisponible || !D) return 'echec';
  const signature = signatureContenu(D);
  if (!options.meta && signature === derniereSignature) return 'inchange';
  if (!options.force && revisionStockee() > revisionConnue) return 'conflit';
  try {
    if (!options.meta) {
      D.revision = Math.max(Number(D.revision) || 0, revisionStockee()) + 1;
      D.modifieLe = new Date().toISOString();
    }
    ecritStockage();
    derniereSignature = signature;
    if (!options.meta) versionAutomatique();
    return 'ok';
  } catch (erreur) {
    stockageDisponible = false;
    montreAlerteStockage('Le navigateur a refusé d’enregistrer (' + (erreur.message || erreur.name) + ').');
    return 'echec';
  }
}

/** Cet onglet a-t-il des modifications pas encore écrites dans le navigateur ? */
function modificationsNonEnregistrees() {
  return !!D && signatureContenu(D) !== derniereSignature;
}

/** Remplace les données de cet onglet par celles du stockage (après un conflit). */
function rechargeDepuisStockage() {
  const lu = lisNavigateur();
  if (lu.etat !== 'ok') return false;
  D = lu.donnees;
  revisionConnue = revisionStockee();
  derniereSignature = signatureContenu(D);
  return true;
}

/* -- Versions précédentes : un filet de sécurité dans le navigateur --------- */

function lisVersions() {
  try {
    const liste = JSON.parse(localStorage.getItem(CLE_VERSIONS) || '[]');
    return Array.isArray(liste) ? liste : [];
  } catch (e) { return []; }
}

function resumeDonnees(donnees) {
  const mois = donnees.mois.find(m => m.id === donnees.moisActif) || donnees.mois[0];
  if (!mois) return donnees.mois.length + ' mois';
  const b = recapBudget(mois.lignes);
  return donnees.mois.length + ' mois · ' + mois.libelle + ' : reste ' +
         b.restant.reel.toFixed(2).replace('.', ',') + ' € · ' + mois.lignes.length + ' lignes';
}

/** Ajoute une version à l'historique. Ne fait jamais échouer l'enregistrement principal. */
function ajouteVersion(raison, donnees = D, automatique = false) {
  if (!stockageDisponible || !donnees) return false;
  const liste = lisVersions();
  const contenu = JSON.stringify(donnees);
  if (liste[0] && liste[0].donnees === contenu) return false;       // rien de neuf
  liste.unshift({ le: new Date().toISOString(), raison, automatique,
                  resume: resumeDonnees(donnees), donnees: contenu });
  while (liste.length > MAX_VERSIONS) liste.pop();
  for (let essai = 0; essai < 3; essai++) {
    try { localStorage.setItem(CLE_VERSIONS, JSON.stringify(liste)); return true; }
    catch (e) { liste.splice(Math.max(3, Math.floor(liste.length / 2))); }   // mémoire pleine : on allège
  }
  return false;
}

function versionAutomatique() {
  const derniere = lisVersions().find(v => v.automatique);
  if (!derniere || Date.now() - Date.parse(derniere.le) > INTERVALLE_VERSION_AUTO) {
    ajouteVersion('Enregistrement automatique (toutes les heures d’activité)', D, true);
  }
}

/** Garde de côté un contenu illisible au lieu de l'écraser. */
function metAbri(brut) {
  const cle = PREFIXE_SECOURS + new Date().toISOString();
  try { localStorage.setItem(cle, brut); return cle; } catch (e) { return null; }
}

/**
 * Choisit les données à ouvrir au démarrage, entre celles du navigateur et
 * celles enregistrées dans le fichier. Rien n'est jamais jeté : la version
 * écartée part dans l'historique.
 */
function chargeAuDemarrage() {
  const messages = [];
  let navigateur = lisNavigateur();
  const fichier = lisIntegrees();

  if (navigateur.etat === 'corrompu') {
    const abri = metAbri(navigateur.brut);
    const secours = lisVersions().map(v => {
      try { return { v, d: validees(JSON.parse(v.donnees)) }; } catch (e) { return null; }
    }).find(x => x && x.d);
    messages.push({ erreur: true, texte: 'Les données de ce navigateur étaient illisibles. Elles n’ont pas été effacées' +
      (abri ? ' : une copie brute est gardée de côté.' : '.') +
      (secours ? ' La version du ' + new Date(secours.v.le).toLocaleString('fr-FR') + ' a été rouverte.'
               : (fichier ? ' Les données du fichier ont été ouvertes.' : '')) });
    navigateur = secours ? { etat: 'ok', donnees: secours.d } : { etat: 'absent' };
  }

  const a = navigateur.etat === 'ok' ? navigateur.donnees : null;
  if (!a && !fichier) return { donnees: null, messages, source: 'aucune' };
  if (a && !fichier) return { donnees: a, messages, source: 'navigateur' };
  if (!a) {
    messages.push({ texte: 'Comptes ouverts depuis le fichier' +
      (fichier.fichierLe ? ' (enregistré le ' + new Date(fichier.fichierLe).toLocaleString('fr-FR') + ')' : '') +
      '. Si vous avez une copie de sauvegarde plus récente, ouvrez-la : menu ⋯ → Ouvrir une sauvegarde.' });
    return { donnees: fichier, messages, source: 'fichier' };
  }
  if (signatureContenu(a) === signatureContenu(fichier)) {
    // Même contenu : on garde le navigateur, avec la date d'enregistrement la plus récente.
    if ((fichier.fichierLe || '') > (a.fichierLe || '')) { a.fichierLe = fichier.fichierLe; a.fichierRevision = a.revision; }
    return { donnees: a, messages, source: 'navigateur' };
  }
  if ((fichier.modifieLe || '') > (a.modifieLe || '')) {
    ajouteVersion('Version du navigateur, remplacée par un fichier plus récent', a);
    messages.push({ texte: 'Ce fichier contient des comptes plus récents que ceux du navigateur : ils ont été ouverts. ' +
      'L’ancienne version du navigateur reste disponible dans Paramètres → Versions précédentes.' });
    return { donnees: fichier, messages, source: 'fichier' };
  }
  return { donnees: a, messages, source: 'navigateur' };
}

/** Vérifie la forme des données et complète ce qui manque. */
function validees(donnees) {
  if (!donnees || typeof donnees !== 'object' || !Array.isArray(donnees.mois)) return null;
  const p = Object.assign({}, PARAMETRES_DEFAUT, donnees.parametres || {});
  const liste = (valeur, defaut) => Array.isArray(valeur)
    ? valeur.map(x => String(x).trim()).filter(Boolean) : defaut.slice();
  const rappel = Number(p.rappelJours);
  const parametres = {
    categoriesDepenses: (Array.isArray(p.categoriesDepenses) ? p.categoriesDepenses : [])
      .filter(c => c && String(c.nom || '').trim())
      .map(c => ({ nom: String(c.nom).trim(), nature: NATURES.includes(c.nature) ? c.nature : 'variable' })),
    categoriesRevenus: (Array.isArray(p.categoriesRevenus) ? p.categoriesRevenus : [])
      .filter(c => c && String(c.nom || '').trim())
      .map(c => ({ nom: String(c.nom).trim() })),
    postesCourses: liste(p.postesCourses, POSTES_COURANTS),
    articlesCourses: liste(p.articlesCourses, ACHATS_COURANTS),
    budgetSemaineDefaut: eur(p.budgetSemaineDefaut),
    semainesDefaut: Math.min(6, Math.max(1, Math.round(Number(p.semainesDefaut) || SEMAINES_PAR_DEFAUT))),
    tauxHoraireDefaut: eur(p.tauxHoraireDefaut) || TAUX_HORAIRE_DEFAUT,
    tauxCotisationDefaut: Number.isFinite(Number(p.tauxCotisationDefaut))
      ? Number(p.tauxCotisationDefaut) : TAUX_COTISATION_DEFAUT,
    modules: { courses: !(p.modules && p.modules.courses === false),
               heures: !(p.modules && p.modules.heures === false) },
    nomCourses: String(p.nomCourses || '').trim() || PARAMETRES_DEFAUT.nomCourses,
    nomHeures: String(p.nomHeures || '').trim() || PARAMETRES_DEFAUT.nomHeures,
    seuilAlerte: Math.min(100, Math.max(1, Math.round(Number(p.seuilAlerte) || 85))),
    rappelJours: Number.isFinite(rappel) && rappel >= 0 ? Math.round(rappel) : 7,
    avertirFermeture: !!p.avertirFermeture,
  };
  const propre = {
    version: VERSION_DONNEES,
    prochainId: Number(donnees.prochainId) || 1,
    moisActif: donnees.moisActif ?? null,
    revision: Number(donnees.revision) || 0,
    modifieLe: typeof donnees.modifieLe === 'string' ? donnees.modifieLe : null,
    fichierLe: typeof donnees.fichierLe === 'string' ? donnees.fichierLe : null,
    fichierRevision: donnees.fichierRevision === null || donnees.fichierRevision === undefined
      ? null : Number(donnees.fichierRevision),
    parametres,
    mois: [],
  };
  for (const mois of donnees.mois) {
    if (!mois || typeof mois.libelle !== 'string') continue;
    const complet = {
      id: Number(mois.id) || propre.prochainId++,
      libelle: mois.libelle,
      note: String(mois.note || ''),
      tauxHoraire: Number(mois.tauxHoraire) || parametres.tauxHoraireDefaut,
      tauxCotisation: Number.isFinite(Number(mois.tauxCotisation))
        ? Number(mois.tauxCotisation) : parametres.tauxCotisationDefaut,
      budgetCourses: Number.isFinite(Number(mois.budgetCourses))
        ? Number(mois.budgetCourses) : BUDGET_COURSES_DEFAUT,
      lignes: (mois.lignes || []).map(l => ({
        id: Number(l.id) || propre.prochainId++,
        type: TYPES.includes(l.type) ? l.type : 'depense',
        nature: NATURES.includes(l.nature) ? l.nature : 'variable',
        categorie: String(l.categorie || ''),
        libelle: String(l.libelle || ''),
        estime: eur(l.estime),
        reel: eur(l.reel),
        actif: l.actif === undefined ? true : !!l.actif,
        note: String(l.note || ''),
        lien: String(l.lien || ''),
        rang: Number(l.rang) || 0,
      })),
      semaines: (mois.semaines || []).map(s => ({
        numero: Number(s.numero) || 1,
        budget: eur(s.budget),
      })),
      achats: (mois.achats || []).map(a => ({
        id: Number(a.id) || propre.prochainId++,
        semaine: Number(a.semaine) || 1,
        poste: String(a.poste || ''),
        libelle: String(a.libelle || ''),
        montant: eur(a.montant),
        rang: Number(a.rang) || 0,
      })),
      creneaux: (mois.creneaux || []).map(c => ({
        id: Number(c.id) || propre.prochainId++,
        semaine: Number(c.semaine) || 1,
        jour: Number(c.jour) || 0,
        matinDebut: String(c.matinDebut || ''),
        matinFin: String(c.matinFin || ''),
        apremDebut: String(c.apremDebut || ''),
        apremFin: String(c.apremFin || ''),
      })),
    };
    if (!complet.semaines.length) {
      for (let n = 1; n <= parametres.semainesDefaut; n++) {
        complet.semaines.push({ numero: n, budget: parametres.budgetSemaineDefaut });
      }
    }
    assureCreneaux(complet, propre);
    propre.mois.push(complet);
  }
  if (!propre.mois.length) return null;

  // Revenus : les anciens types « salaire » / « aide » deviennent des catégories.
  for (const mois of propre.mois) {
    for (const l of mois.lignes) {
      if (l.type === 'depense') { l.categorie = l.categorie.trim() || 'Sans catégorie'; continue; }
      const nom = l.categorie.trim();
      if (!nom || nom === 'Salaire' || nom === 'Aide') l.categorie = CATEGORIE_REVENUS_DEFAUT[l.type] || 'Salaires';
    }
  }
  // Toute catégorie utilisée par une ligne figure dans la liste (en fin de liste si elle manquait).
  const depenses = new Set(parametres.categoriesDepenses.map(c => c.nom));
  const revenus = new Set(parametres.categoriesRevenus.map(c => c.nom));
  for (const l of propre.mois.flatMap(m => m.lignes).sort((x, y) => x.rang - y.rang)) {
    if (l.type === 'depense' && !depenses.has(l.categorie)) {
      depenses.add(l.categorie); parametres.categoriesDepenses.push({ nom: l.categorie, nature: l.nature });
    } else if (l.type !== 'depense' && !revenus.has(l.categorie)) {
      revenus.add(l.categorie); parametres.categoriesRevenus.push({ nom: l.categorie });
    }
  }

  // Les identifiants doivent rester uniques après import ou modification à la main.
  const maximum = Math.max(0, ...propre.mois.flatMap(m => [
    m.id, ...m.lignes.map(l => l.id), ...m.achats.map(a => a.id), ...m.creneaux.map(c => c.id),
  ]));
  propre.prochainId = Math.max(propre.prochainId, maximum + 1);
  if (!propre.mois.some(m => m.id === propre.moisActif)) {
    propre.moisActif = trieMois(propre.mois)[0].id;
  }
  return propre;
}

function trieMois(liste) {
  return liste.slice().sort((a, b) => b.libelle.localeCompare(a.libelle));
}

/** Crée les 7 jours de chaque semaine déclarée. */
function assureCreneaux(mois, conteneur) {
  const source = conteneur || D;
  for (const semaine of mois.semaines) {
    for (let jour = 0; jour < 7; jour++) {
      const existe = mois.creneaux.some(c => c.semaine === semaine.numero && c.jour === jour);
      if (existe) continue;
      mois.creneaux.push({
        id: source.prochainId++, semaine: semaine.numero, jour,
        matinDebut: '', matinFin: '', apremDebut: '', apremFin: '',
      });
    }
  }
  mois.creneaux.sort((a, b) => a.semaine - b.semaine || a.jour - b.jour);
}

/** Crée un mois, éventuellement en recopiant un mois existant. */
function creeMois(libelle, copierDe) {
  const existant = D.mois.find(m => m.libelle === libelle);
  if (existant) return existant;

  const source = copierDe ? D.mois.find(m => m.id === copierDe) : null;
  const mois = {
    id: D.prochainId++,
    libelle,
    note: '',
    tauxHoraire: source ? source.tauxHoraire : D.parametres.tauxHoraireDefaut,
    tauxCotisation: source ? source.tauxCotisation : D.parametres.tauxCotisationDefaut,
    budgetCourses: source ? source.budgetCourses : BUDGET_COURSES_DEFAUT,
    // Les lignes récurrentes sont reprises, les montants réels remis à zéro.
    lignes: source
      ? source.lignes.map(l => Object.assign({}, l, { id: D.prochainId++, reel: 0 }))
      : [],
    semaines: source
      ? source.semaines.map(s => ({ numero: s.numero, budget: s.budget }))
      : Array.from({ length: D.parametres.semainesDefaut },
                   (_, i) => ({ numero: i + 1, budget: D.parametres.budgetSemaineDefaut })),
    achats: [],
    creneaux: [],
  };
  assureCreneaux(mois);
  D.mois.push(mois);
  return mois;
}

/** Premier démarrage : un mois pré-rempli avec les données du tableau. */
function donneesDeDepart() {
  D = { version: VERSION_DONNEES, prochainId: 1, moisActif: null, revision: 0, modifieLe: null,
        fichierLe: null, fichierRevision: null,
        parametres: JSON.parse(JSON.stringify(PARAMETRES_DEFAUT)), mois: [] };
  const mois = creeMois(moisCourantLibelle());
  let rang = 0;

  for (const [nature, categorie, libelle, estime, reel, actif, note, lien] of DEPENSES_INITIALES) {
    mois.lignes.push({
      id: D.prochainId++, type: 'depense', nature, categorie, libelle,
      estime: eur(estime), reel: eur(reel), actif: !!actif, note, lien, rang: (rang += 10),
    });
  }
  for (const [type, nature, categorie, libelle, estime, reel, lien] of REVENUS_INITIAUX) {
    mois.lignes.push({
      id: D.prochainId++, type, nature, categorie, libelle,
      estime: eur(estime), reel: eur(reel), actif: true, note: '', lien, rang: (rang += 10),
    });
  }
  for (const [semaine, jour, matinDebut, matinFin, apremDebut, apremFin] of CRENEAUX_INITIAUX) {
    const creneau = mois.creneaux.find(c => c.semaine === semaine && c.jour === jour);
    if (creneau) Object.assign(creneau, { matinDebut, matinFin, apremDebut, apremFin });
  }

  D.moisActif = mois.id;
  // Les catégories suivent l'ordre du tableau d'origine.
  for (const l of mois.lignes) {
    const liste = l.type === 'depense' ? D.parametres.categoriesDepenses : D.parametres.categoriesRevenus;
    if (!liste.some(c => c.nom === l.categorie)) {
      liste.push(l.type === 'depense' ? { nom: l.categorie, nature: l.nature } : { nom: l.categorie });
    }
  }
  return D;
}


/* -- Liaison entre le budget et les modules -------------------------------- *

   Deux lignes du budget ne se saisissent pas à la main : elles sont le reflet
   d'un module.

     ligne « Courses » (lien = courses)  : prévu = payé = budget confié au module
                                           (l'enveloppe est comptée en entier dans
                                           le budget ; les achats ne font que la
                                           consommer, dans le module)
     ligne « Caracole » (lien = heures)  : réel   <- salaire net calculé

   La synchronisation a lieu avant chaque enregistrement et chaque affichage,
   si bien que les deux vues ne peuvent pas diverger.
*/

/** Un module désactivé dans les paramètres ne pilote plus rien. */
function moduleActif(nom) {
  return !(D && D.parametres && D.parametres.modules && D.parametres.modules[nom] === false);
}

function ligneReliee(mois, lien) {
  return mois.lignes.find(l => (l.lien || '') === lien) || null;
}

/** Budget confié aux courses : le montant prévu de la ligne de dépense reliée. */
function budgetCourses(mois) {
  const ligne = ligneReliee(mois, 'courses');
  return eur(ligne ? ligne.estime : mois.budgetCourses);
}

/** Recopie les modules dans les lignes de budget correspondantes.

   Courses : l'enveloppe entière compte comme dépensée dans le budget du mois,
   quels que soient les achats déjà saisis. Elle ne change que si l'on modifie
   le budget courses (ici ou dans le module : c'est le même nombre).

   Heures : le module ne prend la main qu'une fois rempli ; tant qu'aucun
   horaire n'est saisi, le montant écrit à la main dans le budget est conservé. */
function synchroniseLiens(mois) {
  const ligneCourses = moduleActif('courses') ? ligneReliee(mois, 'courses') : null;
  if (ligneCourses) {
    mois.budgetCourses = eur(ligneCourses.estime);
    ligneCourses.reel = eur(ligneCourses.estime);
  }
  const ligneHeures = moduleActif('heures') ? ligneReliee(mois, 'heures') : null;
  if (ligneHeures) {
    const heures = recapHeures(mois.creneaux, mois.tauxHoraire, mois.tauxCotisation);
    if (heures.minutes > 0) ligneHeures.reel = heures.net;
  }
}

/** Un module pilote-t-il déjà sa ligne de budget ? */
function modulePilote(mois, lien) {
  if (!moduleActif(lien) || !ligneReliee(mois, lien)) return false;
  return lien === 'courses' ? true
    : recapHeures(mois.creneaux, mois.tauxHoraire, mois.tauxCotisation).minutes > 0;
}
/* ========================================================================== */
/* 4. Modifications des données                                               */
/*                                                                            */
/* Ces fonctions modifient les données et rien d'autre : elles n'enregistrent */
/* pas et ne redessinent pas. C'est la couche d'interaction (section 6) qui   */
/* décide quand recalculer, quand enregistrer et quand reconstruire la page.  */
/* ========================================================================== */

function moisActif() {
  return D.mois.find(m => m.id === D.moisActif) || trieMois(D.mois)[0];
}

function prochainRang(collection) {
  return collection.reduce((maxi, e) => Math.max(maxi, Number(e.rang) || 0), 0) + 10;
}

/** Champs dont la modification change la forme de la page (et pas seulement un chiffre). */
const CHAMPS_STRUCTURELS = new Set(['actif', 'nature', 'type', 'lien', 'categorie']);

/** Écrit une valeur saisie dans une ligne de budget. */
function ecrisLigne(ligne, champ, valeur) {
  if (champ === 'estime' || champ === 'reel') ligne[champ] = nombre(valeur);
  else if (champ === 'actif') ligne.actif = !!valeur;
  else if (champ === 'type') ligne.type = TYPES.includes(valeur) ? valeur : 'depense';
  else if (champ === 'nature') ligne.nature = NATURES.includes(valeur) ? valeur : 'variable';
  else if (champ === 'lien') {
    const lien = String(valeur || '').trim();
    // Un module ne pilote qu'une seule ligne : on retire le lien de l'ancienne.
    if (lien) for (const autre of moisActif().lignes) if (autre !== ligne && autre.lien === lien) autre.lien = '';
    ligne.lien = lien;
  }
  else if (champ === 'categorie') {
    const sorte = ligne.type === 'depense' ? 'depense' : 'revenu';
    const nom = String(valeur || '').trim() || 'Sans catégorie';
    ligne.categorie = assureCategorie(sorte, nom, ligne.nature).nom;   // respecte la casse existante
  }
  else if (champ === 'libelle' || champ === 'note') ligne[champ] = String(valeur || '');
}

function ecrisAchat(achat, champ, valeur) {
  if (champ === 'montant') achat.montant = nombre(valeur);
  else if (champ === 'semaine') achat.semaine = Math.max(1, Number(valeur) || 1);
  else if (champ === 'poste' || champ === 'libelle') achat[champ] = String(valeur || '');
}

/** Normalise un horaire saisi (« 9h30 » -> « 09:30 ») ; vide s'il est illisible. */
function ecrisCreneau(creneau, champ, valeur) {
  const minutes = minutesDepuisHeure(valeur);
  creneau[champ] = minutes === null ? '' : heureDepuisMinutes(minutes);
  return creneau[champ];
}

function ecrisMois(mois, champ, valeur) {
  if (champ === 'budgetCourses') {
    // Le budget des courses appartient à la ligne de dépense reliée : une seule source.
    const ligne = ligneReliee(mois, 'courses');
    if (ligne) ligne.estime = nombre(valeur); else mois.budgetCourses = nombre(valeur);
  } else if (champ === 'tauxHoraire' || champ === 'tauxCotisation') {
    mois[champ] = nombre(valeur);
  }
}

function ecrisSemaine(mois, numero, valeur) {
  const semaine = mois.semaines.find(s => s.numero === numero);
  if (semaine) semaine.budget = nombre(valeur);
}

function creeLigne(champs) {
  const mois = moisActif();
  const ligne = {
    id: D.prochainId++,
    type: TYPES.includes(champs.type) ? champs.type : 'depense',
    nature: NATURES.includes(champs.nature) ? champs.nature : 'variable',
    categorie: String(champs.categorie || '').trim(),
    libelle: String(champs.libelle || '').trim(),
    estime: nombre(champs.estime),
    reel: nombre(champs.reel),
    actif: champs.actif === undefined ? true : !!champs.actif,
    note: String(champs.note || ''),
    lien: String(champs.lien || '').trim(),
    rang: Number(champs.rang) || prochainRang(mois.lignes),
  };
  mois.lignes.push(ligne);
  return ligne;
}

function supprimeLigne(id) {
  const mois = moisActif();
  const index = mois.lignes.findIndex(l => l.id === id);
  return index < 0 ? null : mois.lignes.splice(index, 1)[0];
}

function creeAchat(champs) {
  const mois = moisActif();
  const achat = {
    id: D.prochainId++,
    semaine: Math.max(1, Number(champs.semaine) || 1),
    poste: String(champs.poste || '').trim(),
    libelle: String(champs.libelle || '').trim(),
    montant: nombre(champs.montant),
    rang: Number(champs.rang) || prochainRang(mois.achats),
  };
  mois.achats.push(achat);
  return achat;
}

function supprimeAchat(id) {
  const mois = moisActif();
  const index = mois.achats.findIndex(a => a.id === id);
  return index < 0 ? null : mois.achats.splice(index, 1)[0];
}

function ajouteSemaine() {
  const mois = moisActif();
  const numero = mois.semaines.reduce((maxi, s) => Math.max(maxi, s.numero), 0) + 1;
  mois.semaines.push({ numero, budget: D.parametres.budgetSemaineDefaut });
  assureCreneaux(mois);
  return numero;
}

function retireSemaine(numero) {
  const mois = moisActif();
  if (mois.semaines.length <= 1) return false;
  mois.semaines = mois.semaines.filter(s => s.numero !== numero);
  mois.achats = mois.achats.filter(a => a.semaine !== numero);
  mois.creneaux = mois.creneaux.filter(c => c.semaine !== numero);
  return true;
}

/* -- Catégories -------------------------------------------------------------
   Les catégories sont communes à tous les mois : les renommer ou les supprimer
   agit sur chaque mois, pour que les comparaisons d'un mois à l'autre gardent
   leur sens. Toute opération destructrice est précédée d'une version dans
   l'historique, et peut être annulée. */

function categoriesDe(sorte) {
  return sorte === 'depense' ? D.parametres.categoriesDepenses : D.parametres.categoriesRevenus;
}

function estDeSorte(ligne, sorte) {
  return sorte === 'depense' ? ligne.type === 'depense' : ligne.type !== 'depense';
}

function trouveCategorie(sorte, nom) {
  const cle = String(nom || '').trim().toLocaleLowerCase('fr');
  return categoriesDe(sorte).find(c => c.nom.toLocaleLowerCase('fr') === cle) || null;
}

/** Nombre de lignes d'une catégorie, dans le mois affiché et dans les autres. */
function compteLignesCategorie(sorte, nom) {
  let ici = 0, ailleurs = 0;
  for (const mois of D.mois) {
    const n = mois.lignes.filter(l => estDeSorte(l, sorte) && l.categorie === nom).length;
    if (mois.id === D.moisActif) ici += n; else ailleurs += n;
  }
  return { ici, ailleurs };
}

/** Crée une catégorie. Lève une erreur lisible si le nom est vide ou déjà pris. */
function creeCategorie(sorte, nom, nature) {
  const propre = String(nom || '').trim();
  if (!propre) throw new Error('Donnez un nom à la catégorie.');
  if (trouveCategorie(sorte, propre)) throw new Error('La catégorie « ' + propre + ' » existe déjà.');
  const categorie = sorte === 'depense'
    ? { nom: propre, nature: NATURES.includes(nature) ? nature : 'variable' }
    : { nom: propre };
  categoriesDe(sorte).push(categorie);
  return categorie;
}

/** S'assure qu'une catégorie existe (utile quand on tape un nom nouveau sur une ligne). */
function assureCategorie(sorte, nom, nature) {
  return trouveCategorie(sorte, nom) || creeCategorie(sorte, nom, nature);
}

/**
 * Renomme une catégorie dans tous les mois. Si le nouveau nom est celui d'une
 * autre catégorie, les deux sont fusionnées. Renvoie 'renommee' ou 'fusionnee'.
 */
function renommeCategorie(sorte, ancien, nouveau) {
  const propre = String(nouveau || '').trim();
  if (!propre) throw new Error('Le nom ne peut pas être vide.');
  const source = trouveCategorie(sorte, ancien);
  if (!source) throw new Error('Catégorie introuvable.');
  const cible = trouveCategorie(sorte, propre);
  const fusion = cible && cible !== source;
  const nomFinal = fusion ? cible.nom : propre;
  for (const mois of D.mois) {
    for (const l of mois.lignes) if (estDeSorte(l, sorte) && l.categorie === source.nom) l.categorie = nomFinal;
  }
  if (fusion) categoriesDe(sorte).splice(categoriesDe(sorte).indexOf(source), 1);
  else source.nom = nomFinal;
  return fusion ? 'fusionnee' : 'renommee';
}

/**
 * Supprime une catégorie. Ses lignes (de tous les mois) sont soit déplacées
 * vers `destination`, soit supprimées si `destination` est vide.
 */
function supprimeCategorie(sorte, nom, destination) {
  const source = trouveCategorie(sorte, nom);
  if (!source) throw new Error('Catégorie introuvable.');
  const cible = destination ? trouveCategorie(sorte, destination) : null;
  if (destination && (!cible || cible === source)) throw new Error('Catégorie de destination invalide.');
  let deplacees = 0, supprimees = 0;
  for (const mois of D.mois) {
    const garder = [];
    for (const l of mois.lignes) {
      if (!estDeSorte(l, sorte) || l.categorie !== source.nom) { garder.push(l); continue; }
      if (cible) { l.categorie = cible.nom; garder.push(l); deplacees++; } else supprimees++;
    }
    mois.lignes = garder;
  }
  categoriesDe(sorte).splice(categoriesDe(sorte).indexOf(source), 1);
  return { deplacees, supprimees };
}

function deplaceCategorie(sorte, nom, pas) {
  const liste = categoriesDe(sorte);
  const i = liste.indexOf(trouveCategorie(sorte, nom));
  const j = i + pas;
  if (i < 0 || j < 0 || j >= liste.length) return false;
  [liste[i], liste[j]] = [liste[j], liste[i]];
  return true;
}

/* ========================================================================== */
/* 5. Affichage                                                               */
/*                                                                            */
/* Deux niveaux, pour que la saisie ne soit jamais interrompue :              */
/*   - la STRUCTURE (dessineTout) : champs, lignes, groupes. Reconstruite     */
/*     seulement quand la forme de la page change (ajout, pause, catégorie…). */
/*   - les ZONES CALCULÉES (rafraichitCalculs) : bilan, totaux, écarts,       */
/*     jauges. Recalculées à chaque frappe, sans toucher aux champs.          */
/* ========================================================================== */

const $  = (sel, racine = document) => racine.querySelector(sel);
const $$ = (sel, racine = document) => Array.from(racine.querySelectorAll(sel));

const VUES = ['budget', 'graphiques', 'courses', 'heures', 'parametres'];

const etat = {
  vue: 'budget',
  mois: null,
  recap: null,
  groupesOuverts: new Set(),
  detailsOuverts: new Set(),
  nouvelleLigne: null,
  suivi: new Map(),          // derniers chiffres affichés, pour signaler ce qui change
  eclats: new Map(),         // chiffres en train de briller : clé -> instant du changement
  suiviMois: null,
  pilotageRendu: '',
  renduEnAttente: false,
  pointeurEnfonce: false,
  valeurInitiale: null,
  dernierEnregistrement: null, // 'ok', 'inchange', 'conflit' ou 'echec'
};

/** replaceChildren insère « null » comme texte : on filtre avant. */
function remplace(hote, ...enfants) {
  if (!hote) return;
  hote.replaceChildren(...enfants.flat(Infinity).filter(e => e !== null && e !== undefined && e !== false));
}

function el(balise, attributs = {}, ...enfants) {
  const noeud = document.createElement(balise);
  for (const [nom, valeur] of Object.entries(attributs)) {
    if (valeur === null || valeur === undefined || valeur === false) continue;
    if (nom === 'class') noeud.className = valeur;
    else if (nom === 'texte') noeud.textContent = valeur;
    else if (nom.startsWith('on')) noeud.addEventListener(nom.slice(2), valeur);
    else noeud.setAttribute(nom, valeur === true ? '' : valeur);
  }
  for (const enfant of enfants.flat(Infinity)) {
    if (enfant === null || enfant === undefined || enfant === false) continue;
    noeud.append(enfant.nodeType ? enfant : document.createTextNode(String(enfant)));
  }
  return noeud;
}

const formatEuros = new Intl.NumberFormat('fr-FR',
  { style: 'currency', currency: 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 2 });
const formatNombre = new Intl.NumberFormat('fr-FR',
  { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const euros = (v) => formatEuros.format(eur(v));
const signe = (v) => (eur(v) > 0 ? '+' : (eur(v) < 0 ? '−' : '')) + formatEuros.format(Math.abs(eur(v)));
const pourcent = (part) => Math.round(part * 100) + ' %';

/** Montant tel qu'on le saisit : « 19,99 », et rien du tout si c'est zéro. */
function montantSaisi(valeur) {
  const n = eur(valeur);
  return n === 0 ? '' : formatNombre.format(n).replace(/[  ]/g, ' ');
}

function libelleMois(code) {
  const [annee, mois] = String(code).split('-').map(Number);
  if (!annee || !mois) return code;
  const nom = new Date(annee, mois - 1, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
  return nom.charAt(0).toUpperCase() + nom.slice(1);
}

function decaleMois(code, pas) {
  const [annee, mois] = String(code).split('-').map(Number);
  const d = new Date(annee, mois - 1 + pas, 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

let minuteurSauvegarde = null;
function signaleSauvegarde(texte = 'Enregistré') {
  const zone = $('#sauvegarde');
  zone.textContent = '✓ ' + texte;
  zone.classList.add('visible');
  clearTimeout(minuteurSauvegarde);
  minuteurSauvegarde = setTimeout(() => zone.classList.remove('visible'), 1400);
}

function toast(texte, options = {}) {
  const boite = el('div', { class: 'toast' + (options.erreur ? ' toast--erreur' : ''), role: 'status' },
    el('span', { class: 'toast__texte', texte }));
  if (options.action) {
    boite.append(el('button', { type: 'button', class: 'bouton', texte: options.action.libelle,
      onclick: () => { boite.remove(); options.action.faire(); } }));
  }
  boite.append(el('button', { type: 'button', class: 'bouton bouton--discret bouton--icone',
    title: 'Fermer', 'aria-label': 'Fermer', texte: '✕', onclick: () => boite.remove() }));
  $('#toasts').append(boite);
  setTimeout(() => boite.remove(), options.duree || 7000);
}

function montreAlerteStockage(detail) {

    'Utilisez le menu ⋯ → « Sauvegarder tout » pour conserver un fichier.'));
}

/* -- Focus conservé quand la structure est reconstruite ------------------- */

function memoriseFocus() {
  const actif = document.activeElement;
  if (!actif || !actif.dataset || !actif.dataset.cle) return null;
  const texte = typeof actif.selectionStart === 'number';
  return { cle: actif.dataset.cle,
           debut: texte ? actif.selectionStart : null, fin: texte ? actif.selectionEnd : null };
}

function restaureFocus(memoire) {
  if (!memoire) return;
  const champ = document.querySelector('[data-cle="' + CSS.escape(memoire.cle) + '"]');
  if (!champ) return;
  champ.focus({ preventScroll: true });
  if (memoire.debut !== null && typeof champ.setSelectionRange === 'function') {
    const n = champ.value.length;
    try { champ.setSelectionRange(Math.min(memoire.debut, n), Math.min(memoire.fin, n)); } catch (e) { /* non textuel */ }
  }
}

/* -- Groupes : l'ordre est STABLE (celui de saisie), jamais celui des montants,
      pour qu'une catégorie ne saute pas ailleurs pendant qu'on la modifie. -- */

function cleCategorie(ligne) { return (ligne.categorie || '').trim() || 'Sans catégorie'; }

/** Les groupes suivent la liste des catégories (Paramètres), y compris les catégories vides. */
function groupesDe(mois, sorte) {
  const prefixe = sorte === 'depense' ? 'd:' : 'r:';
  const lignes = mois.lignes.filter(l => estDeSorte(l, sorte)).sort((a, b) => a.rang - b.rang);
  return categoriesDe(sorte).map((c, index, liste) => ({
    cle: prefixe + c.nom, categorie: c.nom, nom: c.nom, nature: c.nature, sorte,
    premier: index === 0, dernier: index === liste.length - 1,
    lignes: lignes.filter(l => cleCategorie(l) === c.nom),
  }));
}
function groupesRevenus(mois) { return groupesDe(mois, 'revenu'); }
function groupesDepenses(mois) { return groupesDe(mois, 'depense'); }

function signaturePilotage(mois) {
  return modulePilote(mois, 'courses') + '|' + modulePilote(mois, 'heures');
}

/* ======================================================= RENDU STRUCTUREL === */

function dessineTout() {
  etat.renduEnAttente = false;
  const memoire = memoriseFocus();
  const mois = moisActif();
  synchroniseLiens(mois);
  etat.mois = mois;
  etat.recap = recap(mois);
  etat.pilotageRendu = signaturePilotage(mois);

  dessineSelecteurMois();
  dessineBlocRevenus();
  dessineBlocDepenses();
  dessinePageCourses();
  dessinePageHeures();
  dessinePageParametres();
  rafraichitCalculs();
  restaureFocus(memoire);
  if (etat.nouvelleLigne) setTimeout(() => { etat.nouvelleLigne = null; }, 50);
}

function dessineSelecteurMois() {
  const choix = $('#choix-mois');
  remplace(choix, trieMois(D.mois).map(m =>

}

function boutonPlier(bloc) {

function entetesColonnes(sorte) {

function champMontant(ligne, champ, etiquette) {

  if (!l.actif) libelle.append(el('span', { class: 'badge badge--pause', texte: 'En pause' }));

  const reel = auto
    ? el('div', { class: 'montant' },
        el('span', { class: 'montant__etiquette', texte: libelleReel }),
        el('button', {
          type: 'button', class: 'valeur-auto', 'data-aller': moduleLie,
          title: moduleLie === 'courses'
            ? 'Enveloppe courses comptée en entier (égale au prévu) — cliquer pour ouvrir le module et suivre les achats'
            : 'Montant calculé automatiquement par le module ' + nomModule + ' — cliquer pour l’ouvrir',
          'aria-label': libelleReel + ' calculé par le module ' + nomModule + ', ouvrir le module',

const DUREE_ECLAT = 1200;

/** Fait briller un instant tout chiffre suivi dont la valeur vient de changer.
    L'éclat survit à une reconstruction : un élément recréé pendant l'animation
    la reprend là où elle en était, au lieu de s'éteindre d'un coup. */
function signaleChangements() {
  if (etat.suiviMois !== etat.mois.id) { etat.suivi.clear(); etat.eclats.clear(); etat.suiviMois = etat.mois.id; }
  const premier = etat.suivi.size === 0;
  const maintenant = performance.now();
  for (const noeud of $$('[data-suivi]')) {
    const cle = noeud.dataset.suivi;
    const texte = noeud.textContent;
    const avant = etat.suivi.get(cle);
    if (!premier && avant !== undefined && avant !== texte) {
      etat.eclats.set(cle, maintenant);
      noeud.style.animationDelay = '0ms';
      noeud.classList.remove('eclat');
      void noeud.offsetWidth;          // relance l'animation
      noeud.classList.add('eclat');
    } else if (etat.eclats.has(cle) && !noeud.classList.contains('eclat')) {
      const ecoule = maintenant - etat.eclats.get(cle);
      if (ecoule < DUREE_ECLAT) {
        noeud.style.animationDelay = -ecoule + 'ms';
        noeud.classList.add('eclat');
      } else {
        etat.eclats.delete(cle);
      }
    }
    etat.suivi.set(cle, texte);
  }
}

function texteZone(selecteur, texte) {
  const noeud = $(selecteur);
  if (noeud && noeud.textContent !== texte) noeud.textContent = texte;
}

/* --------------------------------------------------------------- Le bilan --- */

function dessineBilan() {
  const b = etat.recap.budget;
  const revenus = b.revenus.reel;
  const fixes = b.depensesFixes.reel;
  const variables = b.depensesVariables.reel;
  const depenses = b.depenses.reel;
  const reste = b.restant.reel;
  const depassement = reste < 0;

  // La barre entière vaut les revenus reçus. Ce qui est peint est parti.
  let partFixes = 0, partVariables = 0;
  if (revenus > 0) {
    partFixes = fixes / revenus * 100;
    partVariables = variables / revenus * 100;
    const total = partFixes + partVariables;
    if (total > 100) { partFixes *= 100 / total; partVariables *= 100 / total; }
  } else if (depenses > 0) {
    partFixes = fixes / depenses * 100;
    partVariables = variables / depenses * 100;
  }
  const part = (m) => revenus > 0 ? ' (' + pourcent(m / revenus) + ')' : '';

  const piste = el('div', {
    class: 'bilan__piste', role: 'img',
    'aria-label': 'Sur ' + euros(revenus) + ' reçus : ' + euros(fixes) + ' de charges fixes, ' +
                  euros(variables) + ' de dépenses variables, ' +
                  (depassement ? 'dépassement de ' + euros(-reste) : 'reste ' + euros(reste)),
  },
    partFixes > 0 ? el('div', { class: 'bilan__part bilan__part--fixes' +
      (partVariables <= 0 && !depassement ? ' bilan__part--fin' : ''), style: 'width:' + partFixes + '%' }) : null,
    partVariables > 0 ? el('div', { class: 'bilan__part bilan__part--variables' +
      (depassement ? '' : ' bilan__part--fin'), style: 'width:' + partVariables + '%' }) : null);

  // Ce qui explique l'écart avec le reste prévu.
  const ecartReste = eur(reste - b.restant.estime);
  const ecartRevenus = eur(b.revenus.reel - b.revenus.estime);
  const ecartDepenses = eur(b.depenses.estime - b.depenses.reel);
  const explication = [];
  if (Math.abs(ecartRevenus) >= 0.01) {
    explication.push('revenus ' + (ecartRevenus > 0 ? signe(ecartRevenus) + ' reçus en plus'
                                                     : signe(ecartRevenus) + ' pas encore reçus'));
  }
  if (Math.abs(ecartDepenses) >= 0.01) {
    explication.push('dépenses ' + (ecartDepenses > 0 ? signe(ecartDepenses) + ' pas encore payées'
                                                        : signe(ecartDepenses) + ' de dépassement'));
  }

  remplace($('#bilan'),
    el('div', { class: 'bilan__haut' },
      el('div', {},
        el('div', { class: 'bilan__etiquette', texte: depassement ? 'Découvert ce mois-ci' : 'Reste à vivre' }),
        el('div', { class: 'bilan__valeur' + (depassement ? ' bilan__valeur--negatif' : ''),
                    'data-suivi': 'reste', texte: euros(reste) })),
      el('div', { class: 'bilan__equation', 'aria-label': 'Calcul du reste' },
        el('span', {}, 'Reçu ', el('b', { 'data-suivi': 'recu', texte: euros(revenus) })),
        el('span', { class: 'bilan__operateur', texte: '−' }),
        el('span', {}, 'Payé ', el('b', { 'data-suivi': 'paye', texte: euros(depenses) })),
        el('span', { class: 'bilan__operateur', texte: '=' }),
        el('span', {}, el('b', { texte: euros(reste) })))),
    piste,
    el('div', { class: 'bilan__legende' },
      el('span', { class: 'bilan__cle' }, el('i', { class: 'pastille pastille--fixes' }),
        'Charges fixes', el('b', { 'data-suivi': 'fixes', texte: euros(fixes) }), el('small', { texte: part(fixes) })),
      el('span', { class: 'bilan__cle' }, el('i', { class: 'pastille pastille--variables' }),
        'Dépenses variables', el('b', { 'data-suivi': 'variables', texte: euros(variables) }),
        el('small', { texte: part(variables) })),
      el('span', { class: 'bilan__cle' }, el('i', { class: 'pastille pastille--reste' }),
        depassement ? 'Dépassement' : 'Reste', el('b', { texte: euros(Math.abs(reste)) }),
        el('small', { texte: depassement ? '' : part(reste) }))),
    depassement ? el('div', { class: 'bilan__alerte', role: 'alert' },
      '✕ Vos dépenses dépassent vos revenus de ' + euros(-reste) + ' ce mois-ci.') : null,
    el('div', { class: 'bilan__prevu' },
      'Reste prévu en début de mois : ', el('b', { 'data-suivi': 'reste-prevu', texte: euros(b.restant.estime) }),
      Math.abs(ecartReste) < 0.01 ? ' — conforme au prévu.'
        : [' — écart ', el('b', { class: ecartReste > 0 ? 'texte-bon' : 'texte-mauvais', texte: signe(ecartReste) }),
           explication.length ? ' (' + explication.join(' ; ') + ').' : '.']));
}

function totauxGroupeRevenus(g) {
  const cumul = etat.recap.budget.parCategorieRevenus.find(c => c.categorie === g.categorie);
  return cumul || { reel: 0, estime: 0, nb: 0, enPause: 0 };
}

function totauxGroupeDepenses(g) {
  const cumul = etat.recap.budget.parCategorie.find(c => c.categorie === g.categorie);
  return cumul || { reel: 0, estime: 0, nb: 0, enPause: 0 };
}

function contenuResume(g, sorte, t) {
  const revenus = etat.recap.budget.revenus.reel;
  let compte = t.nb ? t.nb + (t.nb > 1 ? ' lignes' : ' ligne') : 'vide';
  if (t.enPause) compte += ' · ' + t.enPause + ' en pause';
  if (sorte === 'depense' && g.lignes.some(l => l.lien === 'garde')) {
    compte += ' · net après CAF ' + euros(etat.recap.budget.gardeNette.reel);
  }
  const part = sorte === 'depense' && revenus > 0 ? Math.min(1, Math.max(0, t.reel / revenus)) : null;
  return [
    el('span', { class: 'groupe__chevron', 'aria-hidden': 'true', texte: '▶' }),
    el('span', {}, el('span', { class: 'groupe__nom', texte: g.nom }),
                   el('span', { class: 'groupe__compte', texte: compte })),
    el('span', { class: 'groupe__part' },
      part === null ? null : [
        el('span', { class: 'groupe__piste' }, el('span', { class: 'groupe__jauge', style: 'width:' + (part * 100) + '%' })),
        el('span', { class: 'groupe__part-texte', texte: pourcent(part) + ' de vos revenus' })]),
    el('span', { class: 'groupe__montants' },
      el('span', { class: 'groupe__reel', 'data-suivi': 'g:' + g.cle, texte: euros(t.reel) }),
      el('span', { class: 'groupe__prevu', texte: 'sur ' + euros(t.estime) + ' prévus' })),
  ];
}

/** Écart de chaque ligne et montants calculés par les modules. */
function majLignes() {
  for (const l of etat.mois.lignes) {
    const zone = $('[data-ecart="' + l.id + '"]');
    if (zone) remplace(zone, contenuEcart(l));
    const auto = $('[data-auto="' + l.id + '"]');
    if (auto) texteZone('[data-auto="' + l.id + '"]', euros(l.reel));
  }
}

function contenuEcart(l) {
  if (!l.actif) return el('span', { title: 'En pause : cette ligne ne compte pas dans les totaux', texte: 'hors total' });
  if (l.lien === 'courses' && modulePilote(etat.mois, 'courses')) {
    // L'enveloppe compte en entier ; on montre seulement où en sont les achats.
    const c = etat.recap.courses;
    return el('span', {
      class: c.restant >= 0 ? 'texte-bon' : 'texte-mauvais', 'data-suivi': 'e:' + l.id,
      title: euros(c.depense) + ' d’achats sur ' + euros(c.budgetTotal) + '. L’enveloppe entière est déjà comptée dans le reste à vivre.',
      texte: c.restant >= 0 ? 'reste ' + euros(c.restant) : 'dépassé ' + euros(-c.restant),
    });
  }
  const estime = eur(l.estime), reel = eur(l.reel);
  const ecart = l.type === 'depense' ? eur(estime - reel) : eur(reel - estime);
  if (Math.abs(ecart) < 0.005) return el('span', { title: 'Conforme au prévu', texte: '—' });
  const titre = l.type === 'depense'
    ? (ecart > 0 ? formatEuros.format(ecart) + ' de moins que prévu (ou pas encore payé)'
                 : formatEuros.format(-ecart) + ' de plus que prévu')
    : (ecart > 0 ? formatEuros.format(ecart) + ' reçus en plus du prévu'
                 : formatEuros.format(-ecart) + ' reçus en moins que prévu');
  return el('span', { class: ecart > 0 ? 'texte-bon' : 'texte-mauvais', title: titre,
                      'data-suivi': 'e:' + l.id, texte: signe(ecart) });
}

/* ---------------------------------------------------------- Les modules --- */

function jauge(nom, valeur, budget) {
  const part = budget > 0 ? valeur / budget : (valeur > 0 ? 2 : 0);
  const pct = Math.min(100, Math.max(0, part * 100));
  let mod = '', icone = '✓', message = 'Dans le budget';
  if (part > 1) { mod = '--critique'; icone = '✕'; message = 'Budget dépassé'; }
  else if (part >= D.parametres.seuilAlerte / 100) { mod = '--alerte'; icone = '⚠'; message = 'Budget presque atteint'; }
  const reste = eur(budget - valeur);
  return el('div', { class: 'jauge' },
    el('div', { class: 'jauge__entete' },
