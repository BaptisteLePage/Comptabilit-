<!doctype html>
<html lang="fr" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comptes</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>&#x1F4B6;</text></svg>">
<!--
  Comptes - suivi budgetaire mensuel.

  Un seul fichier : ouvrez-le dans votre navigateur, rien a installer.
  Vos donnees restent dans ce navigateur et ne partent nulle part.

  La page principale tient en une seule vue : ce qui rentre, ce qui sort,
  ce qui reste. Les graphiques, les courses et les heures gardees sont
  des pages secondaires.

  Pour verifier les calculs : ouvrez ce fichier avec #autotest a la fin
  de l'adresse.
-->
<style>
/* ==========================================================================
   Comptes — feuille de style
   Palette et règles graphiques issues du système de visualisation validé :
   marques fines, grilles en filet, écarts de 2 px en couleur de fond.
   ========================================================================== */

:root {
  color-scheme: light;

  --plan:            #f4f4f1;
  --surface:         #fcfcfb;
  --surface-2:       #f2f1ee;
  --surface-3:       #e9e8e3;
  --encre:           #0b0b0b;
  --encre-2:         #52514e;
  --encre-3:         #898781;
  --filet:           #e1e0d9;
  --ligne-base:      #c3c2b7;
  --bord:            rgba(11, 11, 11, .09);

  --serie-1:         #2a78d6;   /* dépenses fixes */
  --serie-2:         #eb6834;   /* dépenses variables */
  --serie-1-clair:   #cde2fb;

  --bon:             #0ca30c;
  --bon-texte:       #006300;
  --alerte:          #fab219;
  --critique:        #d03b3b;

  --ombre-1: 0 1px 2px rgba(11, 11, 11, .04);
  --ombre-2: 0 4px 16px rgba(11, 11, 11, .07);
  --ombre-3: 0 10px 30px rgba(11, 11, 11, .10);

  --r-xl: 16px;
  --r-l:  12px;
  --r-m:  9px;
  --r-s:  6px;

  --police: system-ui, -apple-system, "Segoe UI", sans-serif;

  /* Hauteurs mesurees au chargement : l'en-tete et la navigation peuvent
     passer sur deux lignes selon la largeur de l'ecran. */
  --haut-tete: 49px;
  --haut-nav:  44px;
}

@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --plan:       #0d0d0d;
    --surface:    #1a1a19;
    --surface-2:  #232322;
    --surface-3:  #2c2c2a;
    --encre:      #ffffff;
    --encre-2:    #c3c2b7;
    --encre-3:    #898781;
    --filet:      #2c2c2a;
    --ligne-base: #383835;
    --bord:       rgba(255, 255, 255, .10);
    --serie-1:    #3987e5;
    --serie-2:    #d95926;
    --serie-1-clair: #184f95;
    --bon-texte:  #0ca30c;
    --ombre-1: 0 1px 2px rgba(0, 0, 0, .3);
    --ombre-2: 0 4px 16px rgba(0, 0, 0, .35);
    --ombre-3: 0 10px 30px rgba(0, 0, 0, .45);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --plan:       #0d0d0d;
  --surface:    #1a1a19;
  --surface-2:  #232322;
  --surface-3:  #2c2c2a;
  --encre:      #ffffff;
  --encre-2:    #c3c2b7;
  --encre-3:    #898781;
  --filet:      #2c2c2a;
  --ligne-base: #383835;
  --bord:       rgba(255, 255, 255, .10);
  --serie-1:    #3987e5;
  --serie-2:    #d95926;
  --serie-1-clair: #184f95;
  --bon-texte:  #0ca30c;
  --ombre-1: 0 1px 2px rgba(0, 0, 0, .3);
  --ombre-2: 0 4px 16px rgba(0, 0, 0, .35);
  --ombre-3: 0 10px 30px rgba(0, 0, 0, .45);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--plan);
  color: var(--encre);
  font-family: var(--police);
  font-size: 15px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.012em; }

.cache {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip-path: inset(50%); white-space: nowrap;
}
.pousse { flex: 1 1 auto; }
.chiffres { font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------- En-tête --- */

.tete {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 10px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--filet);
}

.tete__marque { display: flex; align-items: center; gap: 9px; }
.tete__logo {
  display: grid; place-items: center;
  width: 28px; height: 28px; border-radius: 9px;
  background: var(--serie-1); color: #fff; font-weight: 700; font-size: .95rem;
}
.tete__marque h1 { font-size: 1rem; }

/* Sélecteur de mois : le repère temporel doit sauter aux yeux. */
.mois {
  display: flex; align-items: center; gap: 2px;
  background: var(--surface-2); border: 1px solid var(--bord);
  border-radius: 999px; padding: 2px;
}
.mois__fleche {
  appearance: none; border: 0; background: none; cursor: pointer;
  width: 28px; height: 28px; border-radius: 50%;
  color: var(--encre-2); font-size: 1.1rem; line-height: 1;
}
.mois__fleche:hover { background: var(--surface-3); color: var(--encre); }
.mois__choix {
  appearance: none; border: 0; background: none; cursor: pointer;
  padding: 3px 10px; font: inherit; font-size: .92rem; font-weight: 600;
  color: var(--encre); text-align: center;
}

.tete__actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }

/* ------------------------------------------------------------ Navigation --- */

.nav {
  position: sticky; top: var(--haut-tete); z-index: 30;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding: 7px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--filet);
}

.nav__lien {
  appearance: none; border: 1px solid transparent; background: none; cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 13px; border-radius: 999px;
  color: var(--encre-2); font: inherit; font-size: .875rem; white-space: nowrap;
}
.nav__lien:hover { background: var(--surface-2); color: var(--encre); }
.nav__lien[aria-current="page"] {
  background: var(--serie-1); border-color: transparent; color: #fff; font-weight: 600;
}
.nav__lien[aria-current="page"] .nav__jeton { background: rgba(255, 255, 255, .22); color: #fff; }

/* Les modules sont volontairement mis à part du budget. */
.nav__separateur {
  width: 1px; height: 22px; margin: 0 6px; background: var(--filet);
}
.nav__groupe { display: flex; gap: 4px; flex-wrap: wrap; }
.nav__groupe .nav__lien { font-size: .83rem; padding: 5px 11px; }
.nav__jeton {
  padding: 1px 7px; border-radius: 999px;
  background: var(--surface-3); color: var(--encre-2);
  font-size: .74rem; font-variant-numeric: tabular-nums;
}

main { max-width: 900px; margin: 0 auto; padding: 18px 16px 80px; }
main.large { max-width: 1180px; }

/* ------------------------------------------------------------- Contrôles --- */

.bouton {
  appearance: none; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 13px;
  border: 1px solid var(--bord); border-radius: var(--r-s);
  background: var(--surface); color: var(--encre);
  font: inherit; font-size: .875rem;
  transition: background .12s ease, border-color .12s ease;
}
.bouton:hover { background: var(--surface-2); }
.bouton--primaire { background: var(--serie-1); border-color: transparent; color: #fff; font-weight: 500; }
.bouton--primaire:hover { background: var(--serie-1); filter: brightness(1.08); }
.bouton--fantome {
  border-color: transparent; background: none; color: var(--encre-2);
  padding: 5px 9px; font-size: .82rem;
}
.bouton--fantome:hover { background: var(--surface-2); color: var(--encre); }
.bouton--rond {
  width: 30px; height: 30px; padding: 0; justify-content: center;
  border-radius: 50%; border-color: transparent; background: none;
  color: var(--encre-3); font-size: 1rem;
}
.bouton--rond:hover { background: var(--surface-2); color: var(--encre); }
.bouton--rond.danger:hover { background: color-mix(in srgb, var(--critique) 14%, transparent); color: var(--critique); }

:focus-visible { outline: 2px solid var(--serie-1); outline-offset: 2px; border-radius: 3px; }

input[type="text"], input[type="search"], select {
  padding: 6px 9px;
  border: 1px solid var(--bord); border-radius: var(--r-s);
  background: var(--surface); color: var(--encre);
  font: inherit; font-size: .875rem;
}
input::placeholder { color: var(--encre-3); }

.bascule {
  appearance: none; margin: 0; cursor: pointer; flex: none;
  width: 28px; height: 16px; border-radius: 999px;
  background: var(--ligne-base); border: 0; position: relative;
  transition: background .14s ease;
}
.bascule::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 12px; height: 12px; border-radius: 50%; background: #fff;
  transition: transform .14s ease;
}
.bascule:checked { background: var(--serie-1); }
.bascule:checked::after { transform: translateX(12px); }

.menu { position: relative; }
.menu > summary { list-style: none; display: inline-block; }
.menu > summary::-webkit-details-marker { display: none; }
.menu__contenu {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 50;
  min-width: 250px; padding: 6px;
  background: var(--surface); border: 1px solid var(--bord);
  border-radius: var(--r-l); box-shadow: var(--ombre-3);
}
.menu__contenu button {
  display: block; width: 100%; text-align: left;
  padding: 8px 10px; border: 0; border-radius: var(--r-s);
  background: none; color: inherit; font: inherit; font-size: .875rem; cursor: pointer;
}
.menu__contenu button:hover { background: var(--surface-2); }
.menu__contenu hr { border: 0; border-top: 1px solid var(--filet); margin: 5px 2px; }
.danger { color: var(--critique); }

/* ====================================================== LE BILAN (héros) === */
/*  La barre entière représente les revenus du mois. Ce qui est peint est
    parti ; ce qui reste vide est ce dont on dispose encore.                  */

.bilan {
  position: sticky; top: calc(var(--haut-tete) + var(--haut-nav)); z-index: 20;
  margin-bottom: 18px; padding: 16px 18px 14px;
  background: var(--surface);
  border: 1px solid var(--bord); border-radius: var(--r-xl);
  box-shadow: var(--ombre-2);
}

.bilan__haut { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.bilan__etiquette {
  font-size: .78rem; font-weight: 500; letter-spacing: .05em;
  text-transform: uppercase; color: var(--encre-2);
}
.bilan__valeur {
  display: block; margin-top: 1px;
  font-size: 2.9rem; font-weight: 600; line-height: 1; letter-spacing: -.025em;
}
.bilan__valeur--negatif { color: var(--critique); }
.bilan__cote { margin-left: auto; text-align: right; font-size: .84rem; color: var(--encre-2); }
.bilan__cote b { color: var(--encre); font-variant-numeric: tabular-nums; }

.bilan__piste {
  display: flex; gap: 2px; overflow: hidden;
  height: 15px; margin: 14px 0 9px;
  border-radius: 999px;
  background: var(--surface-3);
}
.bilan__part { height: 100%; min-width: 2px; }
.bilan__part--fixes { background: var(--serie-1); }
.bilan__part--variables { background: var(--serie-2); }
.bilan__part--fin { border-radius: 0 4px 4px 0; }

.bilan__legende {
  display: flex; gap: 16px; flex-wrap: wrap;
  font-size: .8rem; color: var(--encre-2);
}
.bilan__cle { display: inline-flex; align-items: center; gap: 7px; }
.bilan__pastille { width: 11px; height: 11px; border-radius: 3px; flex: none; }
.bilan__pastille--fixes { background: var(--serie-1); }
.bilan__pastille--variables { background: var(--serie-2); }
.bilan__pastille--reste { background: var(--surface-3); border: 1px solid var(--ligne-base); }
.bilan__cle b { color: var(--encre); font-variant-numeric: tabular-nums; }

.bilan__alerte {
  display: flex; align-items: center; gap: 8px;
  margin-top: 10px; padding: 8px 11px;
  border-radius: var(--r-m);
  background: color-mix(in srgb, var(--critique) 11%, var(--surface));
  color: var(--critique); font-size: .84rem; font-weight: 500;
}

/* Version compacte quand on a fait défiler la page */
.bilan.compact { padding: 10px 18px; }
.bilan.compact .bilan__valeur { font-size: 1.7rem; }
.bilan.compact .bilan__legende, .bilan.compact .bilan__cote { display: none; }
.bilan.compact .bilan__piste { margin: 9px 0 0; height: 10px; }

/* ============================================================== Les blocs === */

.bloc {
  margin-bottom: 16px;
  background: var(--surface);
  border: 1px solid var(--bord); border-radius: var(--r-xl);
  box-shadow: var(--ombre-1);
  overflow: hidden;
}

.bloc__tete {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 13px 18px;
  border-bottom: 1px solid var(--filet);
}
.bloc__titre { display: flex; align-items: baseline; gap: 10px; }
.bloc__titre h2 { font-size: .95rem; }
.bloc__total { font-size: 1.1rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.bloc__prevu { font-size: .8rem; color: var(--encre-3); font-variant-numeric: tabular-nums; }
.bloc__corps > :last-child { border-bottom: 0; }

/* --------------------------------------------------- Catégorie dépliable --- */

.cat { border-bottom: 1px solid var(--filet); }
.cat > summary {
  display: grid; align-items: center; gap: 4px 12px; cursor: pointer;
  grid-template-columns: 18px minmax(0, 1fr) 170px 152px;
  padding: 10px 18px;
  list-style: none;
}
.cat > summary::-webkit-details-marker { display: none; }
.cat > summary:hover { background: var(--surface-2); }
.cat__fleche { color: var(--encre-3); transition: transform .15s ease; font-size: .8rem; }
.cat[open] > summary .cat__fleche { transform: rotate(90deg); }
.cat__nom { font-weight: 600; font-size: .9rem; }
.cat__compte { font-weight: 400; font-size: .78rem; color: var(--encre-3); margin-left: 6px; }

/* Part du revenu absorbée par la catégorie : l'incidence, ligne par ligne. */
.cat__part { display: grid; gap: 3px; }
.cat__part-piste {
  display: block; height: 5px; border-radius: 999px;
  background: var(--surface-3); overflow: hidden;
}
.cat__part-jauge { display: block; height: 100%; border-radius: 999px; background: var(--serie-1); }
.cat__part-texte { font-size: .72rem; color: var(--encre-3); }

.cat__montants { text-align: right; font-variant-numeric: tabular-nums; }
.cat__reel { font-weight: 600; font-size: .95rem; }
.cat__prevu { font-size: .76rem; color: var(--encre-3); }

.cat__corps { padding: 2px 0 10px; background: var(--surface-2); }
.cat__pied { padding: 4px 18px 0; }

/* ------------------------------------------------------------- Une ligne --- */

.ligne {
  display: grid; align-items: center; gap: 3px 10px;
  grid-template-columns: 30px minmax(0, 1fr) 106px 106px 84px 30px;
  grid-template-areas: "actif libelle prevu reel ecart suppr";
  padding: 3px 18px 3px 14px;
}
.ligne:hover { background: color-mix(in srgb, var(--surface) 60%, transparent); }
.ligne--pause > :not(.ligne__actif) { opacity: .5; }

.ligne__actif { grid-area: actif; display: flex; justify-content: center; }
.ligne__libelle { grid-area: libelle; display: flex; align-items: center; gap: 6px; min-width: 0; }
.ligne__libelle input {
  width: 100%; min-width: 0;
  border-color: transparent; background: transparent; font-weight: 500;
}
.ligne__libelle input:hover { border-color: var(--bord); background: var(--surface); }
.ligne__libelle input:focus { border-color: var(--serie-1); background: var(--surface); }

.ligne__montants { display: contents; }
.champ-montant { position: relative; }
.champ-montant input {
  width: 100%; text-align: right; font-variant-numeric: tabular-nums;
  border-color: transparent; background: transparent;
}
.champ-montant input:hover { border-color: var(--bord); background: var(--surface); }
.champ-montant input:focus { border-color: var(--serie-1); background: var(--surface); }
.champ-montant input:read-only { color: var(--encre-2); cursor: default; }
.champ-montant--prevu { grid-area: prevu; }
.champ-montant--reel { grid-area: reel; }
.champ-montant__etiquette { display: none; }

.ligne__ecart {
  grid-area: ecart; text-align: right; white-space: nowrap;
  font-size: .82rem; font-variant-numeric: tabular-nums; color: var(--encre-3);
}
.ligne__ecart--bon { color: var(--bon-texte); }
.ligne__ecart--mauvais { color: var(--critique); }
.ligne__suppr { grid-area: suppr; }

/* Jeton « ce montant vient d'un module » */
.jeton-lien {
  appearance: none; cursor: pointer;
  display: inline-flex; align-items: center; gap: 4px; flex: none;
  padding: 1px 8px; border: 1px solid var(--bord); border-radius: 999px;
  background: var(--surface-3); color: var(--encre-2);
  font: inherit; font-size: .72rem; white-space: nowrap;
}
.jeton-lien:hover { background: var(--serie-1); border-color: transparent; color: #fff; }

.entete-colonnes {
  display: grid; gap: 10px;
  grid-template-columns: 30px minmax(0, 1fr) 106px 106px 84px 30px;
  padding: 6px 18px 6px 14px;
  font-size: .7rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase;
  color: var(--encre-3);
}
.entete-colonnes span:nth-child(3),
.entete-colonnes span:nth-child(4),
.entete-colonnes span:nth-child(5) { text-align: right; }

/* -------------------------------------------------------- Sous-sections --- */

.sous-bloc { border-bottom: 1px solid var(--filet); }
.sous-bloc__tete {
  display: flex; align-items: baseline; gap: 10px;
  padding: 9px 18px 3px;
}
.sous-bloc__nom {
  font-size: .74rem; font-weight: 600; letter-spacing: .07em;
  text-transform: uppercase; color: var(--encre-2);
}
.sous-bloc__total { font-size: .8rem; color: var(--encre-3); font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------- Modules --- */

.modules { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }

.module {
  display: grid; gap: 10px; align-content: start;
  padding: 16px 18px;
  background: var(--surface);
  border: 1px solid var(--bord); border-radius: var(--r-xl);
  box-shadow: var(--ombre-1);
}
.module__tete { display: flex; align-items: center; gap: 10px; }
.module__icone {
  display: grid; place-items: center; flex: none;
  width: 30px; height: 30px; border-radius: var(--r-m);
  background: var(--surface-3); font-size: .95rem;
}
.module__titre { font-size: .92rem; font-weight: 600; }
.module__sous-titre { font-size: .78rem; color: var(--encre-3); }
.module__valeur { font-size: 1.6rem; font-weight: 600; letter-spacing: -.015em; }
.module__detail { font-size: .8rem; color: var(--encre-2); }

/* --------------------------------------------------------------- Jauges --- */

.jauge { display: grid; gap: 5px; }
.jauge__entete { display: flex; justify-content: space-between; gap: 10px; font-size: .82rem; }
.jauge__nom { color: var(--encre-2); }
.jauge__chiffres { font-variant-numeric: tabular-nums; }
.jauge__piste { height: 9px; border-radius: 999px; background: var(--serie-1-clair); overflow: hidden; }
.jauge__remplissage { height: 100%; border-radius: 999px; background: var(--serie-1); }
.jauge__remplissage--alerte { background: var(--alerte); }
.jauge__remplissage--critique { background: var(--critique); }
.jauge__etat { font-size: .78rem; color: var(--encre-2); }
.jauge__etat--critique { color: var(--critique); }

/* ----------------------------------------------------- Pages secondaires --- */

.carte {
  margin-bottom: 16px; padding: 16px 18px;
  background: var(--surface);
  border: 1px solid var(--bord); border-radius: var(--r-xl);
  box-shadow: var(--ombre-1);
}
.carte__tete { margin-bottom: 12px; }
.carte__tete h2 { font-size: .95rem; }
.carte__sous-titre { margin: 2px 0 0; font-size: .78rem; color: var(--encre-3); }

.outils { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.champ-inline { display: inline-flex; align-items: center; gap: 8px; font-size: .82rem; color: var(--encre-2); }
.champ-inline input { width: 96px; text-align: right; font-variant-numeric: tabular-nums; }

.graphique { width: 100%; }
.graphique svg { display: block; width: 100%; height: auto; }

.legende { display: flex; gap: 16px; flex-wrap: wrap; margin: 2px 0 10px; font-size: .78rem; color: var(--encre-2); }
.legende__cle { display: inline-flex; align-items: center; gap: 6px; }
.legende__pastille { width: 11px; height: 11px; border-radius: 3px; background: var(--serie-1); }
.legende__trait { width: 2px; height: 13px; background: var(--encre-2); }

.jumeau { margin-top: 12px; font-size: .84rem; }
.jumeau summary { cursor: pointer; color: var(--encre-2); }
.jumeau table { width: 100%; border-collapse: collapse; margin-top: 8px; }
.jumeau th, .jumeau td {
  padding: 5px 6px; border-bottom: 1px solid var(--filet);
  text-align: right; font-variant-numeric: tabular-nums;
}
.jumeau th:first-child, .jumeau td:first-child { text-align: left; font-variant-numeric: normal; }

.infobulle {

.semaines { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }

.semaine__titre { font-size: .92rem; font-weight: 600; }

.achat {
  display: grid; align-items: center; gap: 8px;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr) 92px 30px;
  padding: 2px 0;
}
.achat input { width: 100%; min-width: 0; border-color: transparent; background: transparent; }
.achat input:hover { border-color: var(--bord); background: var(--surface); }
.achat input:focus { border-color: var(--serie-1); background: var(--surface); }
.achat__montant input { text-align: right; font-variant-numeric: tabular-nums; }
.achat__entete {
  font-size: .7rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase;
  color: var(--encre-3); padding-bottom: 4px; border-bottom: 1px solid var(--filet); margin-bottom: 4px;
}
.achat__entete span:nth-child(3) { text-align: right; }

.puces { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
.puce {
  appearance: none; cursor: pointer;
  padding: 4px 10px; border: 1px solid var(--bord); border-radius: 999px;
  background: var(--surface); color: var(--encre-2); font: inherit; font-size: .78rem;
}
.puce:hover { background: var(--serie-1); border-color: transparent; color: #fff; }
.suggestions { width: 100%; }
.suggestions > summary { cursor: pointer; font-size: .8rem; color: var(--encre-2); padding: 4px 2px; }
.suggestions > summary:hover { color: var(--encre); }

/* ---------------------------------------------------------------- Heures --- */

.heures { width: 100%; border-collapse: collapse; table-layout: fixed; }
.heures th {
  padding: 5px 4px; font-size: .7rem; font-weight: 500; letter-spacing: .06em;
  text-transform: uppercase; color: var(--encre-3); text-align: left;
  border-bottom: 1px solid var(--filet);

.heures td { padding: 2px 3px; border-bottom: 1px solid var(--filet); }
.heures tr:last-child td { border-bottom: 0; }
.heures th:first-child, .heures td:first-child { width: 22%; }
.heures th:last-child, .heures td:last-child { width: 15%; }
.heures .jour { font-size: .82rem; color: var(--encre-2); white-space: nowrap; padding-left: 6px; }
.heures .duree { font-size: .82rem; font-variant-numeric: tabular-nums; text-align: right; padding-right: 6px; white-space: nowrap; }
.heures input {

}
.heures input:hover { border-color: var(--bord); background: var(--surface); }
.heures input:focus { border-color: var(--serie-1); background: var(--surface); }
.heures .separateur { border-left: 1px solid var(--filet); }

.bandeau { display: grid; gap: 12px; margin-bottom: 16px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.tuile {
  padding: 13px 14px; background: var(--surface);

.tuile__etiquette { font-size: .78rem; color: var(--encre-2); }

.tuile__note--bon { color: var(--bon-texte); }
.tuile__note--mauvais { color: var(--critique); }

/* ------------------------------------------------------- Retours visuels --- */

.vide {
  padding: 22px 16px; text-align: center; color: var(--encre-2); font-size: .88rem;

}

.toasts {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);

}
.toast {
  display: flex; align-items: center; gap: 12px;

  background: var(--surface); color: var(--encre);
  border: 1px solid var(--bord); border-radius: var(--r-l); box-shadow: var(--ombre-3);

.toast__texte { flex: 1 1 auto; }
.toast--erreur { border-color: var(--critique); }

.sauvegarde {

.alerte {
  margin: 0; padding: 10px 20px;

function eur(valeur) {
  const nombre = Number(valeur);
  if (!Number.isFinite(nombre)) return 0;
  return Math.round(nombre * 100 + (nombre < 0 ? -1e-6 : 1e-6)) / 100;
}

/** Lit un montant saisi à la française : « 1 234,56 » ou « 12,50 € » -> nombre. */
function nombre(valeur) {
  if (valeur === null || valeur === undefined || valeur === '') return 0;
  if (typeof valeur === 'number') return eur(valeur);
  let texte = String(valeur).trim()
    .replace(/[\s  ]/g, '')
    .replace(/€/g, '')
    .replace(',', '.');
  if (texte === '' || texte === '-' || texte === '.' || texte === '-.') return 0;
  const lu = Number(texte);
  return Number.isFinite(lu) ? eur(lu) : 0;

/** « 09:30 », « 9h30 » ou « 9 » -> minutes depuis minuit. null si illisible. */
function minutesDepuisHeure(texte) {
  if (texte === null || texte === undefined) return null;
  const propre = String(texte).trim().toLowerCase().replace(/h/g, ':').replace(/\./g, ':');
  if (!propre) return null;
  const morceaux = propre.split(':');
  const heures = Number(morceaux[0]);
  const minutes = morceaux.length > 1 && morceaux[1] !== '' ? Number(morceaux[1]) : 0;
  if (!Number.isInteger(heures) || !Number.isInteger(minutes)) return null;
  if (heures < 0 || heures > 23 || minutes < 0 || minutes > 59) return null;
  return heures * 60 + minutes;

  if (minutes === null || minutes === undefined) return '';
  const total = ((Math.trunc(minutes) % 1440) + 1440) % 1440;
  return String(Math.floor(total / 60)).padStart(2, '0') + ':' +

  const a = minutesDepuisHeure(debut);
  const b = minutesDepuisHeure(fin);
  if (a === null || b === null || b <= a) return 0;
  return b - a;

function formatDuree(minutes) {
  const total = Math.round(minutes || 0);
  return Math.floor(total / 60) + ' h ' + String(total % 60).padStart(2, '0');
}

/** Heures gardées puis salaire brut / cotisations / net. */
function recapHeures(creneaux, tauxHoraire, tauxCotisation) {
  const parSemaine = new Map();
  let total = 0;
  for (const creneau of creneaux) {
    const duree = dureeCreneau(creneau);
    total += duree;
    const semaine = Number(creneau.semaine) || 1;
    parSemaine.set(semaine, (parSemaine.get(semaine) || 0) + duree);
  }
  const heures = total / 60;
  const brut = eur(heures * (Number(tauxHoraire) || 0));
  const cotisation = eur(brut * (Number(tauxCotisation) || 0) / 100);
  return {
    minutes: total,
    heures,
    duree: formatDuree(total),
    tauxHoraire: eur(tauxHoraire),
    tauxCotisation: Math.round((Number(tauxCotisation) || 0) * 100) / 100,
    brut,
    cotisation,
    net: eur(brut - cotisation),
    parSemaine: Array.from(parSemaine.keys()).sort((a, b) => a - b)
      .map(s => ({ semaine: s, minutes: parSemaine.get(s), duree: formatDuree(parSemaine.get(s)) })),
  };
}

/** Suivi hebdomadaire des courses. */
function recapCourses(semaines, achats, budgetTotal) {
  const depenseParSemaine = new Map();
  const parPoste = new Map();
  let total = 0;

  for (const achat of achats) {
    const montant = eur(achat.montant);
    const semaine = Number(achat.semaine) || 1;
    depenseParSemaine.set(semaine, eur((depenseParSemaine.get(semaine) || 0) + montant));
    const poste = (achat.poste || 'Autre').trim() || 'Autre';
    parPoste.set(poste, eur((parPoste.get(poste) || 0) + montant));
    total = eur(total + montant);
  }

  const lignes = semaines.map(semaine => {
    const budget = eur(semaine.budget);
    const depense = eur(depenseParSemaine.get(Number(semaine.numero)) || 0);
    return { numero: Number(semaine.numero), budget, depense, restant: eur(budget - depense) };
  });

  const budget = eur(budgetTotal);
  return {
    semaines: lignes,
    budgetTotal: budget,
    budgetSemaines: eur(lignes.reduce((s, l) => s + l.budget, 0)),
    depense: total,
    restant: eur(budget - total),
    parPoste: Array.from(parPoste.entries())
      .map(([poste, montant]) => ({ poste, montant }))
      .sort((a, b) => b.montant - a.montant),
  };
}

function cumulVide() { return { estime: 0, reel: 0 }; }

function cumule(cumul, estime, reel) {
  cumul.estime = eur(cumul.estime + estime);
  cumul.reel = eur(cumul.reel + reel);
}

function sommeCumuls(...cumuls) {
  const total = cumulVide();
  for (const cumul of cumuls) cumule(total, cumul.estime, cumul.reel);
  return total;
}

/**
 * Totaux du mois.
 * Une ligne en pause garde son montant affiché mais ne compte pas :
 * c'est l'équivalent des colonnes « Actif / Ref » du tableau d'origine.
 */
function recapBudget(lignes) {
  const groupes = {};
  for (const type of TYPES) for (const nature of NATURES) groupes[type + '-' + nature] = cumulVide();

  const parCategorie = new Map();
  const enPause = [];
  const garde = cumulVide();
  const caf = cumulVide();

  for (const ligne of lignes) {
    const cle = ligne.type + '-' + ligne.nature;
    if (!groupes[cle]) continue;
    const actif = !!ligne.actif;
    const estimeSaisi = eur(ligne.estime);
    const estime = actif ? estimeSaisi : 0;
    const reel = eur(ligne.reel);

    cumule(groupes[cle], estime, reel);

    if (!actif && estimeSaisi) {
      enPause.push({ id: ligne.id, libelle: ligne.libelle || '',
                     categorie: ligne.categorie || '', estime: estimeSaisi });
    }

    if (ligne.type === 'depense') {
      const categorie = (ligne.categorie || '').trim() || 'Sans catégorie';
      if (!parCategorie.has(categorie)) {
        parCategorie.set(categorie, { categorie, estime: 0, reel: 0 });
      }
      cumule(parCategorie.get(categorie), estime, reel);
    }

    const lien = (ligne.lien || '').trim();
    if (lien === 'garde') cumule(garde, estime, reel);
    else if (lien === 'caf') cumule(caf, estime, reel);
  }

  const depenses = sommeCumuls(groupes['depense-fixe'], groupes['depense-variable']);
  const salaires = sommeCumuls(groupes['salaire-fixe'], groupes['salaire-variable']);
  const aides = sommeCumuls(groupes['aide-fixe'], groupes['aide-variable']);
  const revenus = sommeCumuls(salaires, aides);

  return {
    depenses,
    depensesFixes: groupes['depense-fixe'],
    depensesVariables: groupes['depense-variable'],
    salaires, aides, revenus,
    restant: { estime: eur(revenus.estime - depenses.estime),
               reel: eur(revenus.reel - depenses.reel) },
    /* Positif = on a dépensé moins que prévu (le « Surplus » du tableau). */
    surplus: { estime: 0, reel: eur(depenses.estime - depenses.reel) },
    garde, caf,
    gardeNette: { estime: eur(garde.estime - caf.estime), reel: eur(garde.reel - caf.reel) },
    enPause: enPause.sort((a, b) => b.estime - a.estime),
    economieEnPause: eur(enPause.reduce((s, l) => s + l.estime, 0)),
    parCategorie: Array.from(parCategorie.values()).sort((a, b) => {
      const ecart = Math.max(b.reel, b.estime) - Math.max(a.reel, a.estime);
      return ecart !== 0 ? ecart : a.categorie.localeCompare(b.categorie, 'fr');
    }),
  };
}

/** Assemble les trois récapitulatifs d'un mois. */
function recap(mois) {
  return {
    budget: recapBudget(mois.lignes),
    courses: recapCourses(mois.semaines, mois.achats, budgetCourses(mois)),
    heures: recapHeures(mois.creneaux, mois.tauxHoraire, mois.tauxCotisation),
  };
}

/* 3. Stockage dans le navigateur                                             */
/* ========================================================================== */

/** Toutes les données de l'application. */
let D = null;
let stockageDisponible = true;

function moisCourantLibelle() {
  const maintenant = new Date();
  return maintenant.getFullYear() + '-' + String(maintenant.getMonth() + 1).padStart(2, '0');
}

function testeStockage() {
  try {
    const sonde = CLE_STOCKAGE + '.sonde';
    localStorage.setItem(sonde, '1');
    localStorage.removeItem(sonde);
    return true;
  } catch (erreur) {
    return false;
  }
}

function lisDonnees() {
  if (!stockageDisponible) return null;
  try {
    const brut = localStorage.getItem(CLE_STOCKAGE);
    if (!brut) return null;
    const donnees = JSON.parse(brut);
    return validees(donnees);
  } catch (erreur) {
    console.warn('Données illisibles, on repart de zéro.', erreur);
    return null;
  }
}

function enregistreDonnees() {
  if (!stockageDisponible) return false;
  try {
    localStorage.setItem(CLE_STOCKAGE, JSON.stringify(D));
    return true;
  } catch (erreur) {
    stockageDisponible = false;
    montreAlerteStockage(
      'Le navigateur a refusé d’enregistrer (mémoire pleine ou navigation privée).');
    return false;
  }
}

/** Vérifie la forme des données et complète ce qui manque. */
function validees(donnees) {
  if (!donnees || typeof donnees !== 'object' || !Array.isArray(donnees.mois)) return null;
  const propre = {
    version: VERSION_DONNEES,
    prochainId: Number(donnees.prochainId) || 1,
    moisActif: donnees.moisActif ?? null,
    mois: [],
  };
  for (const mois of donnees.mois) {
    if (!mois || typeof mois.libelle !== 'string') continue;
    const complet = {
      id: Number(mois.id) || propre.prochainId++,
      libelle: mois.libelle,
      note: String(mois.note || ''),
      tauxHoraire: Number(mois.tauxHoraire) || TAUX_HORAIRE_DEFAUT,
      tauxCotisation: Number.isFinite(Number(mois.tauxCotisation))
        ? Number(mois.tauxCotisation) : TAUX_COTISATION_DEFAUT,
      budgetCourses: Number.isFinite(Number(mois.budgetCourses))
        ? Number(mois.budgetCourses) : BUDGET_COURSES_DEFAUT,
      lignes: (mois.lignes || []).map(l => ({
        id: Number(l.id) || propre.prochainId++,
        type: TYPES.includes(l.type) ? l.type : 'depense',
        nature: NATURES.includes(l.nature) ? l.nature : 'variable',
        categorie: String(l.categorie || ''),
        libelle: String(l.libelle || ''),
        estime: eur(l.estime),
        reel: eur(l.reel),
        actif: l.actif === undefined ? true : !!l.actif,
        note: String(l.note || ''),
        lien: String(l.lien || ''),
        rang: Number(l.rang) || 0,
      })),
      semaines: (mois.semaines || []).map(s => ({
        numero: Number(s.numero) || 1,
        budget: eur(s.budget),
      })),
      achats: (mois.achats || []).map(a => ({
        id: Number(a.id) || propre.prochainId++,
        semaine: Number(a.semaine) || 1,
        poste: String(a.poste || ''),
        libelle: String(a.libelle || ''),
        montant: eur(a.montant),
        rang: Number(a.rang) || 0,
      })),
      creneaux: (mois.creneaux || []).map(c => ({
        id: Number(c.id) || propre.prochainId++,
        semaine: Number(c.semaine) || 1,
        jour: Number(c.jour) || 0,
        matinDebut: String(c.matinDebut || ''),
        matinFin: String(c.matinFin || ''),
        apremDebut: String(c.apremDebut || ''),
        apremFin: String(c.apremFin || ''),
      })),
    };
    if (!complet.semaines.length) {
      for (let n = 1; n <= SEMAINES_PAR_DEFAUT; n++) {
        complet.semaines.push({ numero: n, budget: BUDGET_SEMAINE_DEFAUT });
      }
    }
    assureCreneaux(complet, propre);
    propre.mois.push(complet);
  }
  if (!propre.mois.length) return null;
  // Les identifiants doivent rester uniques après import ou modification à la main.
  const maximum = Math.max(0, ...propre.mois.flatMap(m => [
    m.id, ...m.lignes.map(l => l.id), ...m.achats.map(a => a.id), ...m.creneaux.map(c => c.id),
  ]));
  propre.prochainId = Math.max(propre.prochainId, maximum + 1);
  if (!propre.mois.some(m => m.id === propre.moisActif)) {
    propre.moisActif = trieMois(propre.mois)[0].id;
  }
  return propre;
}

function trieMois(liste) {
  return liste.slice().sort((a, b) => b.libelle.localeCompare(a.libelle));
}

/** Crée les 7 jours de chaque semaine déclarée. */
function assureCreneaux(mois, conteneur) {
  const source = conteneur || D;
  for (const semaine of mois.semaines) {
    for (let jour = 0; jour < 7; jour++) {
      const existe = mois.creneaux.some(c => c.semaine === semaine.numero && c.jour === jour);
      if (existe) continue;
      mois.creneaux.push({
        id: source.prochainId++, semaine: semaine.numero, jour,
        matinDebut: '', matinFin: '', apremDebut: '', apremFin: '',
      });
    }
  }
  mois.creneaux.sort((a, b) => a.semaine - b.semaine || a.jour - b.jour);
}

/** Crée un mois, éventuellement en recopiant un mois existant. */
function creeMois(libelle, copierDe) {
  const existant = D.mois.find(m => m.libelle === libelle);
  if (existant) return existant;

  const source = copierDe ? D.mois.find(m => m.id === copierDe) : null;
  const mois = {
    id: D.prochainId++,
    libelle,
    note: '',
    tauxHoraire: source ? source.tauxHoraire : TAUX_HORAIRE_DEFAUT,
    tauxCotisation: source ? source.tauxCotisation : TAUX_COTISATION_DEFAUT,
    budgetCourses: source ? source.budgetCourses : BUDGET_COURSES_DEFAUT,
    // Les lignes récurrentes sont reprises, les montants réels remis à zéro.
    lignes: source
      ? source.lignes.map(l => Object.assign({}, l, { id: D.prochainId++, reel: 0 }))
      : [],
    semaines: source
      ? source.semaines.map(s => ({ numero: s.numero, budget: s.budget }))
      : Array.from({ length: SEMAINES_PAR_DEFAUT },
                   (_, i) => ({ numero: i + 1, budget: BUDGET_SEMAINE_DEFAUT })),
    achats: [],
    creneaux: [],
  };
  assureCreneaux(mois);
  D.mois.push(mois);
  return mois;
}

/** Premier démarrage : un mois pré-rempli avec les données du tableau. */
function donneesDeDepart() {
  D = { version: VERSION_DONNEES, prochainId: 1, moisActif: null, mois: [] };
  const mois = creeMois(moisCourantLibelle());
  let rang = 0;

  for (const [nature, categorie, libelle, estime, reel, actif, note, lien] of DEPENSES_INITIALES) {
    mois.lignes.push({
      id: D.prochainId++, type: 'depense', nature, categorie, libelle,
      estime: eur(estime), reel: eur(reel), actif: !!actif, note, lien, rang: (rang += 10),
    });
  }
  for (const [type, nature, categorie, libelle, estime, reel, lien] of REVENUS_INITIAUX) {
    mois.lignes.push({
      id: D.prochainId++, type, nature, categorie, libelle,
      estime: eur(estime), reel: eur(reel), actif: true, note: '', lien, rang: (rang += 10),
    });
  }
  for (const [semaine, jour, matinDebut, matinFin, apremDebut, apremFin] of CRENEAUX_INITIAUX) {
    const creneau = mois.creneaux.find(c => c.semaine === semaine && c.jour === jour);
    if (creneau) Object.assign(creneau, { matinDebut, matinFin, apremDebut, apremFin });
  }

  D.moisActif = mois.id;
  return D;
}

/* ========================================================================== */
/* 4. Modifications des données                                               */
/* ========================================================================== */

function moisActif() {
  return D.mois.find(m => m.id === D.moisActif) || trieMois(D.mois)[0];
}

/** Toute modification passe par ici : on synchronise, on enregistre, on redessine. */
function applique(message) {
  synchroniseLiens(moisActif());
  const enregistre = enregistreDonnees();
  dessineTout();
  if (message && enregistre) signaleSauvegarde(message);
}

function prochainRang(collection) {
  return collection.reduce((maxi, e) => Math.max(maxi, Number(e.rang) || 0), 0) + 10;
}

function majMois(champ, valeur) {
  const mois = moisActif();
  if (champ === 'note') mois.note = String(valeur || '');
  else if (champ === 'budgetCourses') {
    // Le budget des courses appartient à la ligne de dépense : une seule source.
    const ligne = ligneReliee(mois, 'courses');
    if (ligne) ligne.estime = nombre(valeur); else mois.budgetCourses = nombre(valeur);
  } else mois[champ] = nombre(valeur);
  applique('Enregistré');
}

function creeLigne(champs) {
  const mois = moisActif();
  const ligne = {
    id: D.prochainId++,
    type: TYPES.includes(champs.type) ? champs.type : 'depense',
    nature: NATURES.includes(champs.nature) ? champs.nature : 'variable',
    categorie: String(champs.categorie || '').trim(),
    libelle: String(champs.libelle || '').trim(),
    estime: nombre(champs.estime),
    reel: nombre(champs.reel),
    actif: champs.actif === undefined ? true : !!champs.actif,
    note: String(champs.note || ''),
    lien: String(champs.lien || '').trim(),
    rang: Number(champs.rang) || prochainRang(mois.lignes),
  };
  mois.lignes.push(ligne);
  return ligne;
}

function majLigne(id, champ, valeur) {
  const ligne = moisActif().lignes.find(l => l.id === id);
  if (!ligne) return;
  if (champ === 'estime' || champ === 'reel') ligne[champ] = nombre(valeur);
  else if (champ === 'actif') ligne.actif = !!valeur;
  else if (champ === 'type') ligne.type = TYPES.includes(valeur) ? valeur : 'depense';
  else if (champ === 'nature') ligne.nature = NATURES.includes(valeur) ? valeur : 'variable';
  else if (champ === 'note') ligne.note = String(valeur || '');
  else ligne[champ] = String(valeur || '').trim();
  applique('Enregistré');
}

function supprimeLigne(id) {
  const mois = moisActif();
  const index = mois.lignes.findIndex(l => l.id === id);
  if (index < 0) return null;
  return mois.lignes.splice(index, 1)[0];
}

function creeAchat(champs) {
  const mois = moisActif();
  const achat = {
    id: D.prochainId++,
    semaine: Math.max(1, Number(champs.semaine) || 1),
    poste: String(champs.poste || '').trim(),
    libelle: String(champs.libelle || '').trim(),
    montant: nombre(champs.montant),
    rang: Number(champs.rang) || prochainRang(mois.achats),
  };
  mois.achats.push(achat);
  return achat;
}

function majAchat(id, champ, valeur) {
  const achat = moisActif().achats.find(a => a.id === id);
  if (!achat) return;
  if (champ === 'montant') achat.montant = nombre(valeur);
  else if (champ === 'semaine') achat.semaine = Math.max(1, Number(valeur) || 1);
  else achat[champ] = String(valeur || '').trim();
  applique('Enregistré');
}

function supprimeAchat(id) {
  const mois = moisActif();
  const index = mois.achats.findIndex(a => a.id === id);
  if (index < 0) return null;
  return mois.achats.splice(index, 1)[0];
}

function majCreneau(id, champ, valeur) {
  const creneau = moisActif().creneaux.find(c => c.id === id);
  if (!creneau) return;
  const minutes = minutesDepuisHeure(valeur);
  creneau[champ] = minutes === null ? '' : heureDepuisMinutes(minutes);
  applique('Enregistré');
}

function majSemaine(numero, budget) {
  const semaine = moisActif().semaines.find(s => s.numero === numero);
  if (semaine) semaine.budget = nombre(budget);
  applique('Enregistré');
}

function ajouteSemaine() {
  const mois = moisActif();
  const numero = mois.semaines.reduce((maxi, s) => Math.max(maxi, s.numero), 0) + 1;
  mois.semaines.push({ numero, budget: BUDGET_SEMAINE_DEFAUT });
  assureCreneaux(mois);
  applique('Semaine ajoutée');
}

function retireSemaine(numero) {
  const mois = moisActif();
  if (mois.semaines.length <= 1) {
    toast('Il faut garder au moins une semaine.', { erreur: true });
    return;
  }
  mois.semaines = mois.semaines.filter(s => s.numero !== numero);
  mois.achats = mois.achats.filter(a => a.semaine !== numero);
  mois.creneaux = mois.creneaux.filter(c => c.semaine !== numero);
  applique('Semaine supprimée');
}

/* -- Liaison entre le budget et les modules -------------------------------- *

   Deux lignes du budget ne se saisissent pas à la main : elles sont le reflet
   d'un module.

     ligne « Courses » (lien = courses)  : prévu  -> budget confié au module
                                           réel   <- total dépensé dans le module
     ligne « Caracole » (lien = heures)  : réel   <- salaire net calculé

   La synchronisation a lieu avant chaque enregistrement et chaque affichage,
   si bien que les deux vues ne peuvent pas diverger.
*/

function ligneReliee(mois, lien) {
  return mois.lignes.find(l => (l.lien || '') === lien) || null;
}

/** Budget confié aux courses : le montant prévu de la ligne de dépense reliée. */
function budgetCourses(mois) {
  const ligne = ligneReliee(mois, 'courses');
  return eur(ligne ? ligne.estime : mois.budgetCourses);
}

/** Recopie les totaux des modules dans les lignes de budget correspondantes.

   Un module ne prend la main qu'une fois rempli : tant qu'aucun achat n'est
   saisi, le montant écrit à la main dans le budget est conservé. Sans cette
   règle, ouvrir l'application effacerait des montants que personne n'a
   demandé d'effacer. */
function synchroniseLiens(mois) {
  const ligneCourses = ligneReliee(mois, 'courses');
  if (ligneCourses) {
    mois.budgetCourses = eur(ligneCourses.estime);
    if (mois.achats.length) {
      ligneCourses.reel = recapCourses(mois.semaines, mois.achats, budgetCourses(mois)).depense;
    }
  }
  const ligneHeures = ligneReliee(mois, 'heures');
  if (ligneHeures) {
    const heures = recapHeures(mois.creneaux, mois.tauxHoraire, mois.tauxCotisation);
    if (heures.minutes > 0) ligneHeures.reel = heures.net;
  }
}

/** Un module pilote-t-il déjà sa ligne de budget ? */
function modulePilote(mois, lien) {
  if (!ligneReliee(mois, lien)) return false;
  return lien === 'courses' ? mois.achats.length > 0
    : recapHeures(mois.creneaux, mois.tauxHoraire, mois.tauxCotisation).minutes > 0;
}

const $  = (sel, racine = document) => racine.querySelector(sel);
const $$ = (sel, racine = document) => Array.from(racine.querySelectorAll(sel));

const VUES = ['budget', 'graphiques', 'courses', 'heures'];

const etat = {
  vue: 'budget',
  mois: null,
  recap: null,
  creneaux: [],
  categoriesFermees: new Set(),
  detailsOuverts: new Set(),
};

/** replaceChildren insère « null » comme texte : on filtre avant. */
function remplace(hote, ...enfants) {
  hote.replaceChildren(
    ...enfants.flat().filter(e => e !== null && e !== undefined && e !== false));
}

function el(balise, attributs = {}, ...enfants) {
  const noeud = document.createElement(balise);
  for (const [nom, valeur] of Object.entries(attributs)) {
    if (valeur === null || valeur === undefined || valeur === false) continue;
    if (nom === 'class') noeud.className = valeur;
    else if (nom === 'texte') noeud.textContent = valeur;
    else if (nom.startsWith('on')) noeud.addEventListener(nom.slice(2), valeur);
    else noeud.setAttribute(nom, valeur === true ? '' : valeur);
  }
  for (const enfant of enfants.flat()) {
    if (enfant === null || enfant === undefined || enfant === false) continue;
    noeud.append(enfant.nodeType ? enfant : document.createTextNode(String(enfant)));
  }
  return noeud;
}

const formatEuros = new Intl.NumberFormat('fr-FR',
  { style: 'currency', currency: 'EUR', maximumFractionDigits: 2 });
const formatNombre = new Intl.NumberFormat('fr-FR',
  { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const euros = (v) => formatEuros.format(Number(v) || 0);
const signe = (v) => (Number(v) > 0 ? '+' : '') + euros(v);
const pourcent = (part) => Math.round(part * 100) + ' %';

/** Montant tel qu'on le saisit : « 19,99 », et rien du tout si c'est zéro. */
function montantSaisi(valeur) {
  const n = Number(valeur) || 0;
  return n === 0 ? '' : formatNombre.format(n).replace(/[  ]/g, ' ');
}

function libelleMois(code) {
  const [annee, mois] = String(code).split('-').map(Number);
  if (!annee || !mois) return code;
  const nom = new Date(annee, mois - 1, 1)
    .toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
  return nom.charAt(0).toUpperCase() + nom.slice(1);
}

function decaleMois(code, pas) {
  const [annee, mois] = String(code).split('-').map(Number);
  const d = new Date(annee, mois - 1 + pas, 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

let minuteurSauvegarde = null;
function signaleSauvegarde(texte = 'Enregistré') {
  const zone = $('#sauvegarde');
  zone.textContent = texte;
  zone.classList.add('visible');
  clearTimeout(minuteurSauvegarde);
  minuteurSauvegarde = setTimeout(() => zone.classList.remove('visible'), 1400);
}

function toast(texte, options = {}) {
  const boite = el('div', { class: 'toast' + (options.erreur ? ' toast--erreur' : '') },
    el('span', { class: 'toast__texte', texte }));
  if (options.action) {
    boite.append(el('button', {
      class: 'bouton', texte: options.action.libelle,

    }));

  boite.append(el('button', {
    class: 'bouton bouton--fantome', title: 'Fermer', texte: '✕',
    onclick: () => boite.remove(),
  }));
  $('#toasts').append(boite);
  setTimeout(() => boite.remove(), options.duree || 7000);
}

function montreAlerteStockage(detail) {

/* -- Focus conservé pendant le redessin ---------------------------------- */

function memoriseFocus() {
  const actif = document.activeElement;
  if (!actif || !actif.dataset || !actif.dataset.cle) return null;
  return {
    cle: actif.dataset.cle,
    debut: typeof actif.selectionStart === 'number' ? actif.selectionStart : null,
  };
}

function restaureFocus(memoire) {
  if (!memoire) return;
  const champ = document.querySelector('[data-cle="' + CSS.escape(memoire.cle) + '"]');
  if (!champ) return;
  champ.focus({ preventScroll: true });
  if (memoire.debut !== null && typeof champ.setSelectionRange === 'function') {
    const position = Math.min(memoire.debut, champ.value.length);
    try { champ.setSelectionRange(position, position); } catch (e) { /* champ non textuel */ }
  }
}

/* -- Rendu général -------------------------------------------------------- */

function dessineTout() {
  const memoire = memoriseFocus();
  const mois = moisActif();
  synchroniseLiens(mois);
  etat.mois = mois;
  etat.recap = recap(mois);
  etat.creneaux = mois.creneaux.map(c => {
    const minutes = dureeCreneau(c);
    return Object.assign({}, c, { minutes, duree: minutes ? formatDuree(minutes) : '' });
  });

  dessineSelecteurMois();
  dessineJetonsNav();
  dessineBilan();
  dessineRevenus();
  dessineDepenses();
  dessineModules();
  dessineGraphiqueCategories();
  dessineGraphiqueEvolution();
  dessineCourses();
  dessineHeures();
  restaureFocus(memoire);
}

function dessineSelecteurMois() {
  const choix = $('#choix-mois');
  choix.textContent = '';
  for (const mois of trieMois(D.mois)) {
    choix.append(el('option', { value: mois.id, selected: mois.id === D.moisActif },
      libelleMois(mois.libelle)));
  }
}

function dessineJetonsNav() {
  $('#jeton-courses').textContent = euros(etat.recap.courses.depense);
  $('#jeton-heures').textContent = etat.recap.heures.duree;
}

function montreVue(nom) {
  if (!VUES.includes(nom)) nom = 'budget';
  etat.vue = nom;
  for (const lien of $$('.nav__lien')) {
    if (lien.dataset.vue === nom) lien.setAttribute('aria-current', 'page');
    else lien.removeAttribute('aria-current');
  }
  for (const vue of $$('.vue')) vue.hidden = vue.id !== 'vue-' + nom;
  $('#contenu').classList.toggle('large', nom !== 'budget');
  if (nom === 'graphiques') { dessineGraphiqueCategories(); dessineGraphiqueEvolution(); }
  if (location.hash.slice(1) !== nom) history.replaceState(null, '', '#' + nom);
  try { localStorage.setItem('comptes.vue', nom); } catch (e) { /* ignoré */ }
}

/* ======================================================= LE BILAN (héros) ===
   La barre entière vaut les revenus du mois. Ce qui est peint est parti,
   ce qui reste vide est ce dont on dispose encore : c'est là que se lit
   l'incidence des dépenses sur les revenus.
   ========================================================================== */

function dessineBilan() {
  const b = etat.recap.budget;
  const revenus = b.revenus.reel;
  const fixes = b.depensesFixes.reel;
  const variables = b.depensesVariables.reel;
  const depenses = b.depenses.reel;
  const reste = b.restant.reel;
  const depassement = reste < 0;

  // Largeurs en pourcentage des revenus ; en cas de dépassement la barre est pleine.
  let partFixes = 0, partVariables = 0;
  if (revenus > 0) {
    partFixes = (fixes / revenus) * 100;
    partVariables = (variables / revenus) * 100;
    const totale = partFixes + partVariables;
    if (totale > 100) { partFixes = partFixes * 100 / totale; partVariables = partVariables * 100 / totale; }
  } else if (depenses > 0) {
    partFixes = (fixes / depenses) * 100;
    partVariables = (variables / depenses) * 100;
  }

  const piste = el('div', {
    class: 'bilan__piste', role: 'img',
    'aria-label': 'Sur ' + euros(revenus) + ' encaissés, ' + euros(fixes) +
                  ' de charges fixes et ' + euros(variables) + ' de dépenses variables' +
                  (depassement ? ', budget dépassé de ' + euros(-reste)
                               : ', il reste ' + euros(reste)),
  });
  if (partFixes > 0) {
    piste.append(el('div', {
      class: 'bilan__part bilan__part--fixes' + (partVariables <= 0 && !depassement ? ' bilan__part--fin' : ''),
      style: 'width:' + partFixes + '%',
    }));
  }
  if (partVariables > 0) {
    piste.append(el('div', {
      class: 'bilan__part bilan__part--variables' + (depassement ? '' : ' bilan__part--fin'),
      style: 'width:' + partVariables + '%',
    }));
  }

  const cle = (classe, nom, montant) => el('span', { class: 'bilan__cle' },
    el('i', { class: 'bilan__pastille bilan__pastille--' + classe, 'aria-hidden': 'true' }),
    nom, ' ', el('b', { texte: euros(montant) }));

  remplace($('#bilan'),
    el('div', { class: 'bilan__haut' },
      el('div', {},
        el('span', { class: 'bilan__etiquette', texte: depassement ? 'Découvert' : 'Reste à vivre' }),
        el('strong', { class: 'bilan__valeur' + (depassement ? ' bilan__valeur--negatif' : ''),
                       texte: euros(reste) })),
      el('div', { class: 'bilan__cote' },
        el('div', {}, 'Encaissé ', el('b', { texte: euros(revenus) })),
        el('div', {}, 'Dépensé ', el('b', { texte: euros(depenses) })),
        el('div', {}, 'Prévu ', el('b', { texte: euros(b.restant.estime) })))),
    piste,
    el('div', { class: 'bilan__legende' },
      cle('fixes', 'Charges fixes', fixes),
      cle('variables', 'Dépenses variables', variables),
      cle('reste', depassement ? 'Dépassement' : 'Reste', Math.abs(reste))),
    depassement
      ? el('div', { class: 'bilan__alerte' }, '✕ ',
          'Vos dépenses dépassent vos revenus de ' + euros(-reste) + ' ce mois-ci.')
      : null);
}

/* ============================================================ UNE LIGNE ===
   Colonnes visibles : interrupteur · nature · libellé · prévu · réel · écart.
   Le reste (catégorie, note, lien, suppression) est derrière le bouton « ⋯ ».
   ========================================================================== */

function champMontant(entite, id, champ, valeur, etiquette, options = {}) {
  return el('label', { class: 'champ-montant champ-montant--' + options.place },
    el('span', { class: 'champ-montant__etiquette', texte: options.court || etiquette }),
    el('input', {
      type: 'text', inputmode: 'decimal', value: montantSaisi(valeur), placeholder: '0,00',
      readonly: options.verrouille || null,
      title: options.titre || null,
      'aria-label': etiquette,
      'data-cle': entite + '-' + id + '-' + champ,
      'data-entite': entite, 'data-id': id, 'data-champ': champ,
    }));
}

function ligneBudget(l, options = {}) {
  const estime = l.actif ? Number(l.estime) : 0;
  // Dépense : dépenser moins que prévu est bon. Revenu : encaisser plus est bon.
  const ecart = l.type === 'depense' ? estime - Number(l.reel) : Number(l.reel) - estime;
  const lien = l.lien || '';
  const moduleLie = lien === 'courses' ? 'courses' : (lien === 'heures' ? 'heures' : null);

  const libelle = el('div', { class: 'ligne__libelle' });
  if (options.nature) {
    const estFixe = l.nature === 'fixe';
    libelle.append(el('button', {
      type: 'button',
      class: 'jeton-nature jeton-nature--' + (estFixe ? 'fixes' : 'variables'),
      title: (estFixe ? 'Charge fixe' : 'Dépense variable') + ' — cliquer pour basculer',
      'aria-label': (estFixe ? 'Charge fixe' : 'Dépense variable') + ', cliquer pour basculer',
      'data-bascule-nature': l.id,
    }));
  }
  libelle.append(el('input', {
    type: 'text', value: l.libelle, placeholder: options.placeholder || 'Libellé',
    'aria-label': 'Libellé', 'data-cle': 'ligne-' + l.id + '-libelle',
    'data-entite': 'ligne', 'data-id': l.id, 'data-champ': 'libelle',
  }));
  if (moduleLie) {
    libelle.append(el('button', {
      type: 'button', class: 'jeton-lien', 'data-aller': moduleLie,
      title: 'Montant calculé dans le module ' +
             (moduleLie === 'courses' ? 'Courses' : 'Heures gardées') + ' — cliquer pour l’ouvrir',
    }, '↗ ', moduleLie === 'courses' ? 'Courses' : 'Heures'));
  }

  const ligne = el('div', {
    class: 'ligne' + (l.actif ? '' : ' ligne--pause'), 'data-ligne': l.id,
  },
    el('div', { class: 'ligne__actif' },
      el('input', {
        type: 'checkbox', class: 'bascule', checked: !!l.actif,
        title: l.actif ? 'Compté dans les totaux' : 'En pause : non compté',
        'aria-label': 'Compter « ' + (l.libelle || 'cette ligne') + ' » dans les totaux',
        'data-cle': 'ligne-' + l.id + '-actif',
        'data-entite': 'ligne', 'data-id': l.id, 'data-champ': 'actif',
      })),
    libelle,
    el('div', { class: 'ligne__montants' },
      champMontant('ligne', l.id, 'estime', l.estime, 'Montant prévu',
        { place: 'prevu', court: 'Prévu' }),
      champMontant('ligne', l.id, 'reel', l.reel, 'Montant réel',
        { place: 'reel', court: 'Réel', verrouille: !!moduleLie,
          titre: moduleLie ? 'Calculé automatiquement par le module ' +
                 (moduleLie === 'courses' ? 'Courses' : 'Heures gardées') : null }),
      el('span', {
        class: 'ligne__ecart' +
          (ecart > 0.004 ? ' ligne__ecart--bon' : (ecart < -0.004 ? ' ligne__ecart--mauvais' : '')),
        title: 'Écart entre le prévu et le réel',
        texte: ecart === 0 ? '—' : signe(ecart),
      })),
    el('div', { class: 'ligne__suppr' },
      el('button', {
        type: 'button', class: 'bouton bouton--rond', texte: '⋯',
        title: 'Catégorie, note, suppression…',
        'aria-expanded': String(etat.detailsOuverts.has(l.id)),
        'data-detail': l.id,
      })));

  if (!etat.detailsOuverts.has(l.id)) return [ligne];
  return [ligne, detailLigne(l, options)];
}

function detailLigne(l, options) {
  const champ = (nom, etiquette, valeur, attributs = {}) =>
    el('label', { class: 'champ-inline' }, etiquette,
      el('input', Object.assign({
        type: 'text', value: valeur || '', 'aria-label': etiquette,
        'data-cle': 'ligne-' + l.id + '-' + nom,
        'data-entite': 'ligne', 'data-id': l.id, 'data-champ': nom,
      }, attributs)));

  return el('div', { class: 'ligne-detail' },
    options.categorie === false ? null
      : champ('categorie', 'Catégorie', l.categorie,
              { list: 'liste-categories', style: 'width:170px;text-align:left' }),
    champ('note', 'Note', l.note, { style: 'width:220px;text-align:left' }),
    el('label', { class: 'champ-inline' }, 'Nature',
      el('select', {
        'data-cle': 'ligne-' + l.id + '-nature', 'aria-label': 'Nature',
        'data-entite': 'ligne', 'data-id': l.id, 'data-champ': 'nature',
      }, [['fixe', 'Fixe'], ['variable', 'Variable']].map(([v, t]) =>
        el('option', { value: v, selected: l.nature === v }, t)))),
    options.type ? el('label', { class: 'champ-inline' }, 'Type',
      el('select', {
        'data-cle': 'ligne-' + l.id + '-type', 'aria-label': 'Type',
        'data-entite': 'ligne', 'data-id': l.id, 'data-champ': 'type',
      }, [['salaire', 'Salaire'], ['aide', 'Aide']].map(([v, t]) =>
        el('option', { value: v, selected: l.type === v }, t)))) : null,
    el('label', { class: 'champ-inline' }, 'Relié à',
      el('select', {
        'data-cle': 'ligne-' + l.id + '-lien', 'aria-label': 'Module relié',
        'data-entite': 'ligne', 'data-id': l.id, 'data-champ': 'lien',
      }, Object.entries(LIENS).map(([v, t]) =>
        el('option', { value: v, selected: (l.lien || '') === v }, t)))),
    el('span', { class: 'pousse' }),
    el('button', {
      type: 'button', class: 'bouton bouton--fantome danger', texte: '✕ Supprimer',
      'data-supprimer': 'ligne', 'data-id': l.id,
    }));
}

  const corps = el('div', { class: 'bloc__corps' });
  const sections = [
    ['salaire', 'Salaires', b.salaires],
    ['aide', 'Aides', b.aides],

  for (const [type, nom, totaux] of sections) {
    const membres = lignes.filter(l => l.type === type);

      el('div', { class: 'sous-bloc__tete' },

        el('span', { class: 'sous-bloc__total',

        el('h2', { texte: 'Ce qui rentre' }),
        el('span', { class: 'bloc__total', texte: euros(b.revenus.reel) }),
        el('span', { class: 'bloc__prevu', texte: 'prévu ' + euros(b.revenus.estime) })),
      el('span', { class: 'pousse' })),
    el('div', { class: 'entete-colonnes' },
      el('span', {}), el('span', { texte: 'Libellé' }),
      el('span', { texte: 'Prévu' }), el('span', { texte: 'Réel' }),
      el('span', { texte: 'Écart' }), el('span', {})),
    corps);
}

/* =========================================================== CE QUI SORT === */

function dessineDepenses() {
  const b = etat.recap.budget;
  const revenus = b.revenus.reel;
  const parCategorie = new Map();
  for (const l of etat.mois.lignes) {
    if (l.type !== 'depense') continue;
    const cle = (l.categorie || '').trim() || 'Sans catégorie';
    if (!parCategorie.has(cle)) parCategorie.set(cle, []);
    parCategorie.get(cle).push(l);
  }
  // Les catégories les plus lourdes d'abord : c'est ce qui pèse qu'on veut voir.
  const ordre = b.parCategorie.map(c => c.categorie)
    .filter(c => parCategorie.has(c))
    .concat(Array.from(parCategorie.keys()).filter(c => !b.parCategorie.some(x => x.categorie === c)));

  const corps = el('div', { class: 'bloc__corps' });
  corps.append(el('datalist', { id: 'liste-categories' },
    Array.from(parCategorie.keys()).sort((a, x) => a.localeCompare(x, 'fr'))
      .map(c => el('option', { value: c }))));

  if (!ordre.length) {
    corps.append(el('div', { class: 'vide',
      texte: 'Aucune dépense pour l’instant. Utilisez « + Dépense ».' }));
  }

  for (const nom of ordre) {
    const membres = parCategorie.get(nom);
    const totalReel = eur(membres.reduce((s, l) => s + Number(l.reel), 0));
    const totalPrevu = eur(membres.reduce((s, l) => s + (l.actif ? Number(l.estime) : 0), 0));
    const part = revenus > 0 ? Math.min(1, totalReel / revenus) : 0;
    const ouverte = !etat.categoriesFermees.has(nom);

    const details = el('details', { class: 'cat', open: ouverte, 'data-categorie': nom });
    details.append(el('summary', {},
      el('span', { class: 'cat__fleche', 'aria-hidden': 'true', texte: '▶' }),
      el('span', {},
        el('span', { class: 'cat__nom', texte: nom }),
        el('span', { class: 'cat__compte',
                     texte: membres.length + (membres.length > 1 ? ' lignes' : ' ligne') })),
      el('span', { class: 'cat__part' },
        el('span', { class: 'cat__part-piste' },
          el('span', { class: 'cat__part-jauge', style: 'width:' + (part * 100) + '%' })),
        el('span', { class: 'cat__part-texte',
                     texte: revenus > 0 ? pourcent(part) + ' de vos revenus' : '—' })),
      el('span', { class: 'cat__montants' },
        el('span', { class: 'cat__reel', texte: euros(totalReel) }),
        el('span', { class: 'cat__prevu', texte: 'sur ' + euros(totalPrevu) + ' prévus' }))));

    const contenu = el('div', { class: 'cat__corps' });
    for (const l of membres) contenu.append(...ligneBudget(l, { nature: true }));
    contenu.append(el('div', { class: 'cat__pied' },
      el('button', { type: 'button', class: 'bouton bouton--fantome',
                     texte: '+ Ajouter dans « ' + nom + ' »',
                     'data-ajouter': 'depense', 'data-categorie': nom })));
    details.append(contenu);
    corps.append(details);
  }

  const toutesOuvertes = ordre.every(n => !etat.categoriesFermees.has(n));
  remplace($('#bloc-depenses'),
    el('header', { class: 'bloc__tete' },
      el('div', { class: 'bloc__titre' },
        el('h2', { texte: 'Ce qui sort' }),
        el('span', { class: 'bloc__total', texte: euros(b.depenses.reel) }),
        el('span', { class: 'bloc__prevu', texte: 'prévu ' + euros(b.depenses.estime) })),
      el('span', { class: 'pousse' }),
      el('button', { type: 'button', class: 'bouton bouton--fantome',
                     texte: toutesOuvertes ? 'Tout replier' : 'Tout déplier',
                     'data-plier': toutesOuvertes ? 'fermer' : 'ouvrir' }),
      el('button', { type: 'button', class: 'bouton bouton--primaire',
                     texte: '+ Dépense', 'data-ajouter': 'depense' })),
    el('div', { class: 'entete-colonnes' },
      el('span', {}), el('span', { texte: 'Libellé' }),
      el('span', { texte: 'Prévu' }), el('span', { texte: 'Réel' }),
      el('span', { texte: 'Écart' }), el('span', {})),
    corps);
}

function jauge(nom, valeur, budget) {
  const part = budget > 0 ? valeur / budget : 0;
  const pct = Math.min(100, Math.max(0, part * 100));
  let mod = '', icone = '✓', message = 'Dans le budget';
  if (part > 1) { mod = '--critique'; icone = '✕'; message = 'Budget dépassé'; }
  else if (part >= 0.85) { mod = '--alerte'; icone = '⚠'; message = 'Budget presque atteint'; }

  return el('div', { class: 'jauge' },
    el('div', { class: 'jauge__entete' },
      el('span', { class: 'jauge__nom', texte: nom }),
      el('span', { class: 'jauge__chiffres', texte: euros(valeur) + ' / ' + euros(budget) })),
    el('div', {
      class: 'jauge__piste', role: 'meter', 'aria-valuenow': Math.round(valeur),
      'aria-valuemin': '0', 'aria-valuemax': Math.round(budget) || 0,
      'aria-label': nom + ' : ' + euros(valeur) + ' sur ' + euros(budget),
    }, el('div', { class: 'jauge__remplissage jauge__remplissage' + mod,
                   style: 'width:' + pct + '%' })),
    el('div', { class: 'jauge__etat jauge__etat' + mod,
                texte: icone + ' ' + message + ' · reste ' + euros(budget - valeur) }));
}

/* ========================================================== GRAPHIQUES === */

/** Échelle terminant sur un chiffre rond, avec des graduations lisibles. */
function graduationsJolies(maxi, cible = 4) {
  if (!(maxi > 0)) return { haut: 100, valeurs: [0, 25, 50, 75, 100] };
  const brut = maxi / cible;
  const puissance = Math.pow(10, Math.floor(Math.log10(brut)));
  const pas = [1, 2, 2.5, 5, 10].map(m => m * puissance).find(p => p >= brut) || 10 * puissance;
  const haut = Math.ceil(maxi / pas) * pas;
  const valeurs = [];
  for (let v = 0; v <= haut + 1e-9; v += pas) valeurs.push(Math.round(v * 100) / 100);
  return { haut, valeurs };
}

/** Barre horizontale : bout arrondi côté valeur, carré sur la ligne de base. */
function cheminBarre(x0, y, longueur, hauteur, rayon) {
  const r = Math.min(rayon, longueur, hauteur / 2);
  if (longueur <= r) return 'M' + x0 + ',' + y + ' h' + longueur + ' v' + hauteur +
                             ' h' + (-longueur) + ' z';
  return 'M' + x0 + ',' + y + ' h' + (longueur - r) + ' a' + r + ',' + r + ' 0 0 1 ' + r + ',' + r +
         ' v' + (hauteur - 2 * r) + ' a' + r + ',' + r + ' 0 0 1 ' + (-r) + ',' + r +
         ' h' + (-(longueur - r)) + ' z';
}

function svg(balise, attributs = {}, ...enfants) {
  const noeud = document.createElementNS('http://www.w3.org/2000/svg', balise);
  for (const [nom, valeur] of Object.entries(attributs)) {
    if (valeur === null || valeur === undefined || valeur === false) continue;
    noeud.setAttribute(nom, valeur === true ? '' : String(valeur));
  }
  for (const enfant of enfants.flat()) {
    if (enfant === null || enfant === undefined || enfant === false) continue;
    noeud.append(enfant.nodeType ? enfant : document.createTextNode(String(enfant)));
  }
  return noeud;
}

function tronque(texte, largeurDisponible) {
  const maxi = Math.max(6, Math.floor(largeurDisponible / 6.6));
  return texte.length > maxi ? texte.slice(0, maxi - 1) + '…' : texte;
}

function ligneInfobulle(nom, valeur, couleur) {
  return el('div', { class: 'infobulle__ligne' },
    el('span', { class: 'infobulle__nom' },
      couleur ? el('span', { class: 'legende__pastille', style: 'background:' + couleur })
              : el('span', { class: 'legende__trait' }),
      nom),
    el('span', { class: 'infobulle__valeur', texte: valeur }));
}

function placeInfobulle(evenement, ancre) {
  const boite = $('#infobulle');
  boite.hidden = false;
  const rect = ancre ? ancre.getBoundingClientRect() : null;
  const gauche = evenement ? evenement.clientX + 14 : rect.left + 20;
  const haut = evenement ? evenement.clientY + 14 : rect.top;
  boite.style.left = Math.min(gauche, window.innerWidth - boite.offsetWidth - 12) + 'px';
  boite.style.top = Math.min(haut, window.innerHeight - boite.offsetHeight - 12) + 'px';
}

function cacheInfobulle() { $('#infobulle').hidden = true; }

function dessineGraphiqueCategories() {
  const hote = $('#graphique-categories');
  if (!hote || !etat.recap) return;
  const donnees = etat.recap.budget.parCategorie.filter(c => c.reel > 0 || c.estime > 0);

  hote.textContent = '';
  if (!donnees.length) {
    hote.append(el('p', { class: 'vide', texte: 'Aucune dépense saisie pour ce mois.' }));
    return;
  }

  hote.append(el('div', { class: 'legende' },
    el('span', { class: 'legende__cle' }, el('span', { class: 'legende__pastille' }), 'Dépensé'),
    el('span', { class: 'legende__cle' }, el('span', { class: 'legende__trait' }), 'Prévu')));

  const largeur = Math.max(300, hote.clientWidth || 700);
  const gauche = Math.min(160, Math.max(88, Math.round(largeur * 0.24)));
  const droite = 96;
  const hautBande = 30, epaisseur = 18, hautPlot = 10, basAxe = 28;
  const hauteurTrace = donnees.length * hautBande;
  const hauteur = hautPlot + hauteurTrace + basAxe;
  const echelle = graduationsJolies(Math.max(...donnees.map(d => Math.max(d.reel, d.estime))));
  const largeurUtile = largeur - gauche - droite;
  const x = (v) => gauche + (Math.max(0, v) / echelle.haut) * largeurUtile;

  const racine = svg('svg', {
    viewBox: '0 0 ' + largeur + ' ' + hauteur, width: largeur, height: hauteur,
    role: 'img', 'aria-label': 'Dépenses réelles et prévues par catégorie',
  });

  for (const valeur of echelle.valeurs) {
    racine.append(svg('line', {
      x1: x(valeur), x2: x(valeur), y1: hautPlot, y2: hautPlot + hauteurTrace,
      stroke: valeur === 0 ? 'var(--ligne-base)' : 'var(--filet)', 'stroke-width': 1,
    }));
    racine.append(svg('text', {
      x: x(valeur), y: hautPlot + hauteurTrace + 17, 'text-anchor': 'middle',
      fill: 'var(--encre-3)', 'font-size': 11, 'font-family': 'inherit',
    }, formatEuros.format(valeur).replace(/,00/, '')));
  }

  donnees.forEach((categorie, index) => {
    const y = hautPlot + index * hautBande;
    const yBarre = y + (hautBande - epaisseur) / 2;
    const ecart = categorie.estime - categorie.reel;
    const groupe = svg('g', {
      tabindex: 0, role: 'group',
      'aria-label': categorie.categorie + ' : ' + euros(categorie.reel) + ' dépensés, ' +
                    euros(categorie.estime) + ' prévus',
    });

    groupe.append(svg('text', {
      x: gauche - 10, y: y + hautBande / 2 + 4, 'text-anchor': 'end',
      fill: 'var(--encre-2)', 'font-size': 12, 'font-family': 'inherit',
    }, tronque(categorie.categorie, gauche - 14)));

    if (categorie.reel > 0) {
      groupe.append(svg('path', {
        d: cheminBarre(gauche, yBarre, Math.max(2, x(categorie.reel) - gauche), epaisseur, 4),
        fill: 'var(--serie-1)',
      }));
      // Valeur posée après la marque la plus à droite : elle ne croise jamais le repère.
      groupe.append(svg('text', {
        x: Math.max(x(categorie.reel), x(categorie.estime)) + 10,
        y: y + hautBande / 2 + 4, 'text-anchor': 'start',
        fill: 'var(--encre-2)', 'font-size': 11.5, 'font-family': 'inherit',
      }, euros(categorie.reel).replace(/,00/, '')));
    }
    if (categorie.estime > 0) {
      groupe.append(svg('line', {
        x1: x(categorie.estime), x2: x(categorie.estime),
        y1: yBarre - 3, y2: yBarre + epaisseur + 3,
        stroke: 'var(--encre-2)', 'stroke-width': 2, 'stroke-linecap': 'round',
      }));
    }
    groupe.append(svg('rect', { x: 0, y, width: largeur, height: hautBande, fill: 'transparent' }));

    const montre = (evenement) => {
      remplace($('#infobulle'),
        el('div', { class: 'infobulle__titre', texte: categorie.categorie }),
        ligneInfobulle('Dépensé', euros(categorie.reel), 'var(--serie-1)'),
        ligneInfobulle('Prévu', euros(categorie.estime), null),
        ligneInfobulle(ecart >= 0 ? 'Reste' : 'Dépassement', euros(Math.abs(ecart)), null));
      placeInfobulle(evenement, groupe);
    };
    groupe.addEventListener('pointerenter', montre);
    groupe.addEventListener('pointermove', montre);
    groupe.addEventListener('focus', () => montre(null));
    groupe.addEventListener('pointerleave', cacheInfobulle);
    groupe.addEventListener('blur', cacheInfobulle);
    racine.append(groupe);
  });

  hote.append(racine);
  remplace($('#tableau-categories'),
    el('table', {},
      el('thead', {}, el('tr', {},
        el('th', { texte: 'Catégorie' }), el('th', { texte: 'Prévu' }),
        el('th', { texte: 'Dépensé' }), el('th', { texte: 'Écart' }))),
      el('tbody', {}, etat.recap.budget.parCategorie.map(c => el('tr', {},
        el('td', { texte: c.categorie }),
        el('td', { texte: euros(c.estime) }),
        el('td', { texte: euros(c.reel) }),
        el('td', { texte: signe(c.estime - c.reel) }))))));
}

/** Courbes des revenus et des dépenses, mois après mois. */
function dessineGraphiqueEvolution() {
  const hote = $('#graphique-evolution');
  if (!hote) return;
  const mois = trieMois(D.mois).slice().reverse()
    .map(m => ({ libelle: m.libelle, recap: recapBudget(m.lignes) }));

  hote.textContent = '';
  $('#tableau-evolution').textContent = '';

  if (mois.length < 2) {
    hote.append(el('p', { class: 'vide',
      texte: 'Il faut au moins deux mois pour voir une évolution. ' +
             'Créez le mois suivant depuis le menu ⋯.' }));
    return;
  }

  hote.append(el('div', { class: 'legende' },
    el('span', { class: 'legende__cle' },
      el('span', { class: 'legende__pastille', style: 'background:var(--serie-1)' }), 'Encaissé'),
    el('span', { class: 'legende__cle' },
      el('span', { class: 'legende__pastille', style: 'background:var(--serie-2)' }), 'Dépensé')));

  const largeur = Math.max(320, hote.clientWidth || 700);
  const haut = 14, bas = 34, gauche = 64, droite = 16;
  const hauteurTrace = 190;
  const hauteur = haut + hauteurTrace + bas;
  const maxi = Math.max(...mois.flatMap(m => [m.recap.revenus.reel, m.recap.depenses.reel]), 1);
  const echelle = graduationsJolies(maxi);
  const x = (i) => gauche + (mois.length === 1 ? (largeur - gauche - droite) / 2
    : (i / (mois.length - 1)) * (largeur - gauche - droite));
  const y = (v) => haut + hauteurTrace - (Math.max(0, v) / echelle.haut) * hauteurTrace;

  const racine = svg('svg', {
    viewBox: '0 0 ' + largeur + ' ' + hauteur, width: largeur, height: hauteur,
    role: 'img', 'aria-label': 'Évolution des revenus et des dépenses mois par mois',
  });

  for (const valeur of echelle.valeurs) {
    racine.append(svg('line', {
      x1: gauche, x2: largeur - droite, y1: y(valeur), y2: y(valeur),
      stroke: valeur === 0 ? 'var(--ligne-base)' : 'var(--filet)', 'stroke-width': 1,
    }));
    racine.append(svg('text', {
      x: gauche - 8, y: y(valeur) + 4, 'text-anchor': 'end',
      fill: 'var(--encre-3)', 'font-size': 11, 'font-family': 'inherit',
    }, formatEuros.format(valeur).replace(/,00/, '')));
  }

  mois.forEach((m, i) => {
    racine.append(svg('text', {
      x: x(i), y: haut + hauteurTrace + 18, 'text-anchor': 'middle',
      fill: 'var(--encre-3)', 'font-size': 11, 'font-family': 'inherit',
    }, libelleMois(m.libelle).split(' ')[0].slice(0, 4) + '.'));
  });

  const series = [
    { cle: 'revenus', couleur: 'var(--serie-1)', valeurs: mois.map(m => m.recap.revenus.reel) },
    { cle: 'depenses', couleur: 'var(--serie-2)', valeurs: mois.map(m => m.recap.depenses.reel) },
  ];
  for (const serie of series) {
    racine.append(svg('polyline', {
      points: serie.valeurs.map((v, i) => x(i) + ',' + y(v)).join(' '),
      fill: 'none', stroke: serie.couleur, 'stroke-width': 2,
      'stroke-linejoin': 'round', 'stroke-linecap': 'round',
    }));
    serie.valeurs.forEach((v, i) => {
      // Anneau de 2 px en couleur de fond : les points restent lisibles quand ils se croisent.
      racine.append(svg('circle', {
        cx: x(i), cy: y(v), r: 4.5, fill: serie.couleur,
        stroke: 'var(--surface)', 'stroke-width': 2,
      }));
    });
  }

  // Valeur au dernier point seulement : jamais un nombre sur chaque point.
  for (const serie of series) {
    const dernier = serie.valeurs.length - 1;
    racine.append(svg('text', {
      x: x(dernier) - 6, y: y(serie.valeurs[dernier]) - 10, 'text-anchor': 'end',
      fill: 'var(--encre-2)', 'font-size': 11.5, 'font-family': 'inherit',
    }, euros(serie.valeurs[dernier]).replace(/,00/, '')));
  }

  mois.forEach((m, i) => {
    const demi = (largeur - gauche - droite) / Math.max(1, (mois.length - 1) * 2);
    const zone = svg('rect', {
      x: x(i) - demi, y: haut, width: demi * 2, height: hauteurTrace,
      fill: 'transparent', tabindex: 0, role: 'group',
      'aria-label': libelleMois(m.libelle) + ' : encaissé ' + euros(m.recap.revenus.reel) +
                    ', dépensé ' + euros(m.recap.depenses.reel),
    });
    const montre = (evenement) => {
      remplace($('#infobulle'),
        el('div', { class: 'infobulle__titre', texte: libelleMois(m.libelle) }),
        ligneInfobulle('Encaissé', euros(m.recap.revenus.reel), 'var(--serie-1)'),
        ligneInfobulle('Dépensé', euros(m.recap.depenses.reel), 'var(--serie-2)'),
        ligneInfobulle('Reste', euros(m.recap.restant.reel), null));
      placeInfobulle(evenement, zone);
    };
    zone.addEventListener('pointerenter', montre);
    zone.addEventListener('pointermove', montre);
    zone.addEventListener('focus', () => montre(null));
    zone.addEventListener('pointerleave', cacheInfobulle);
    zone.addEventListener('blur', cacheInfobulle);
    racine.append(zone);
  });

  hote.append(racine);
  remplace($('#tableau-evolution'),
    el('table', {},
      el('thead', {}, el('tr', {},
        el('th', { texte: 'Mois' }), el('th', { texte: 'Encaissé' }),
        el('th', { texte: 'Dépensé' }), el('th', { texte: 'Reste' }))),
      el('tbody', {}, mois.map(m => el('tr', {},
        el('td', { texte: libelleMois(m.libelle) }),
        el('td', { texte: euros(m.recap.revenus.reel) }),
        el('td', { texte: euros(m.recap.depenses.reel) }),
        el('td', { texte: euros(m.recap.restant.reel) }))))));
}

      'data-entite': 'creneau', 'data-id': creneau.id, 'data-champ': champ,
