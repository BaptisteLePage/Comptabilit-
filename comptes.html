}

function dessineHeures() {
  const { heures } = etat.recap;
  const ligne = ligneReliee(etat.mois, 'heures');
  $('#taux-horaire').value = montantSaisi(etat.mois.tauxHoraire);
  $('#taux-cotisation').value = montantSaisi(etat.mois.tauxCotisation);

  remplace($('#resume-heures'),
    el('div', { class: 'bandeau' },
      tuile('Heures gardées', heures.duree,
            heures.parSemaine.length + ' semaine(s) renseignée(s)'),
      tuile('Salaire brut', euros(heures.brut),
            heures.duree + ' × ' + formatNombre.format(heures.tauxHoraire) + ' €'),
      tuile('Cotisations', euros(heures.cotisation),
            formatNombre.format(heures.tauxCotisation) + ' % du brut'),
      tuile('Salaire net', euros(heures.net),
            ligne ? 'Reporté sur « ' + (ligne.libelle || 'Caracole') + ' »'
                  : 'Aucun revenu relié',
            ligne ? 'tuile__note--bon' : null)));

  const parSemaine = new Map();
  for (const creneau of etat.creneaux) {
    if (!parSemaine.has(creneau.semaine)) parSemaine.set(creneau.semaine, []);
    parSemaine.get(creneau.semaine).push(creneau);
  }

  const hote = $('#semaines-heures');
  hote.textContent = '';

  for (const numero of Array.from(parSemaine.keys()).sort((a, b) => a - b)) {
    const creneaux = parSemaine.get(numero).sort((a, b) => a.jour - b.jour);
    const minutes = creneaux.reduce((s, c) => s + c.minutes, 0);

    hote.append(el('article', { class: 'carte' },
      el('header', { class: 'semaine__tete' },
        el('span', { class: 'semaine__titre', texte: 'Semaine ' + numero }),
        el('span', { class: 'pousse' }),
        el('span', { class: 'chiffres', texte: minutes ? formatDuree(minutes) : '—' })),
      el('table', { class: 'heures' },
        el('thead', {}, el('tr', {},
          el('th', { texte: 'Jour' }),
          el('th', { texte: 'Matin' }), el('th', { texte: '' }),
          el('th', { class: 'separateur', texte: 'Après-midi' }), el('th', { texte: '' }),
          el('th', { style: 'text-align:right', texte: 'Durée' }))),
        el('tbody', {}, creneaux.map(creneau => el('tr', {}, [
          el('td', { class: 'jour', texte: JOURS[creneau.jour] }),
          celluleHeure(creneau, 'matinDebut', JOURS[creneau.jour] + ' matin, début'),
          celluleHeure(creneau, 'matinFin', JOURS[creneau.jour] + ' matin, fin'),
          celluleHeure(creneau, 'apremDebut', JOURS[creneau.jour] + ' après-midi, début', true),
          celluleHeure(creneau, 'apremFin', JOURS[creneau.jour] + ' après-midi, fin'),
          el('td', { class: 'duree', texte: creneau.duree || '—' }),
        ]))))));
  }
}

document.addEventListener('change', (evenement) => {
  const cible = evenement.target;

  if (cible.id === 'choix-mois') { D.moisActif = Number(cible.value); applique(); return; }
  if (cible.id === 'fichier-import') { importeFichier(cible.files[0]); return; }

  const champsMois = { 'budget-courses': 'budgetCourses', 'taux-horaire': 'tauxHoraire',
                       'taux-cotisation': 'tauxCotisation' };
  if (champsMois[cible.id]) { majMois(champsMois[cible.id], cible.value); return; }

  const { entite, id, champ } = cible.dataset;
  if (!entite || !champ) return;
  const valeur = cible.type === 'checkbox' ? cible.checked : cible.value;
  if (entite === 'ligne') majLigne(Number(id), champ, valeur);
  else if (entite === 'achat') majAchat(Number(id), champ, valeur);
  else if (entite === 'creneau') majCreneau(Number(id), champ, valeur);
  else if (entite === 'semaine') majSemaine(Number(id), valeur);
});

/* Retour immédiat sur l'écart pendant la frappe, avant l'enregistrement. */
document.addEventListener('input', (evenement) => {
  const cible = evenement.target;
  if (cible.dataset.entite !== 'ligne') return;
  if (cible.dataset.champ !== 'estime' && cible.dataset.champ !== 'reel') return;
  const ligne = cible.closest('.ligne');
  const cellule = ligne && ligne.querySelector('.ligne__ecart');
  if (!cellule) return;
  const lit = (nom) => {
    const champ = ligne.querySelector('[data-champ="' + nom + '"]');
    return nombre(champ ? champ.value : 0);
  };
  const bascule = ligne.querySelector('[data-champ="actif"]');
  const ecart = (!bascule || bascule.checked ? lit('estime') : 0) - lit('reel');
  cellule.textContent = ecart === 0 ? '—' : signe(ecart);
  cellule.className = 'ligne__ecart' +
    (ecart > 0.004 ? ' ligne__ecart--bon' : (ecart < -0.004 ? ' ligne__ecart--mauvais' : ''));
});

document.addEventListener('click', (evenement) => {
  // Les catégories se replient nous-mêmes, pour retenir leur état d'un mois à l'autre.
  const sommaire = evenement.target.closest('.cat > summary');
  if (sommaire) {
    evenement.preventDefault();
    const nom = sommaire.parentElement.dataset.categorie;
    if (etat.categoriesFermees.has(nom)) etat.categoriesFermees.delete(nom);
    else etat.categoriesFermees.add(nom);
    enregistrePreferences();
    dessineDepenses();
    return;
  }

  const cible = evenement.target.closest('button');
  if (!cible) {
    if (!evenement.target.closest('.menu')) {
      $$('.menu[open]').forEach(m => m.removeAttribute('open'));
    }
    return;
  }

  if (cible.dataset.vue) { montreVue(cible.dataset.vue); window.scrollTo({ top: 0 }); return; }
  if (cible.dataset.aller) { montreVue(cible.dataset.aller); window.scrollTo({ top: 0 }); return; }
  if (cible.dataset.action) { actionMenu(cible.dataset.action); return; }
  if (cible.dataset.ajouter) { ajouteLigne(cible); return; }
  if (cible.dataset.ajouterAchat) { ajouteAchat(cible); return; }
  if (cible.dataset.supprimer) { demandeSuppression(cible); return; }

  if (cible.dataset.detail) {
    const id = Number(cible.dataset.detail);
    if (etat.detailsOuverts.has(id)) etat.detailsOuverts.delete(id);
    else etat.detailsOuverts.add(id);
    dessineTout();
    return;
  }

  if (cible.dataset.basculeNature) {
    const ligne = etat.mois.lignes.find(l => l.id === Number(cible.dataset.basculeNature));
    if (ligne) majLigne(ligne.id, 'nature', ligne.nature === 'fixe' ? 'variable' : 'fixe');
    return;
  }

  if (cible.dataset.plier) {
    const fermer = cible.dataset.plier === 'fermer';
    etat.categoriesFermees = new Set(fermer
      ? $$('.cat').map(d => d.dataset.categorie)
      : []);
    enregistrePreferences();
    dessineDepenses();
    return;
  }

  if (cible.id === 'mois-precedent') { changeMoisRelatif(-1); return; }
  if (cible.id === 'mois-suivant') { changeMoisRelatif(1); return; }
  if (cible.id === 'ajouter-semaine') { ajouteSemaine(); return; }
  if (cible.id === 'retirer-semaine') {
    const semaines = etat.recap.courses.semaines;
    const derniere = semaines[semaines.length - 1];
    if (!derniere) return;
    if (!confirm('Supprimer la semaine ' + derniere.numero +
                 ' et tout ce qu’elle contient ?')) return;
    retireSemaine(derniere.numero);
  }
});

function ajouteLigne(bouton) {
  const type = bouton.dataset.ajouter;
  const categorie = bouton.dataset.categorie || '';
  const ligne = creeLigne({
    type,
    nature: type === 'depense' ? 'variable' : 'fixe',
    categorie: categorie || (type === 'depense' ? 'Sans catégorie'
                                                : (type === 'aide' ? 'Aide' : 'Salaire')),
  });
  // Une ligne neuve s'ouvre sur son panneau : la catégorie est à portée de main.
  if (!categorie) etat.detailsOuverts.add(ligne.id);
  etat.categoriesFermees.delete(ligne.categorie);
  applique('Ligne ajoutée');
  montreVue('budget');
  const champ = document.querySelector('[data-cle="ligne-' + ligne.id + '-libelle"]');
  if (champ) { champ.focus(); champ.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
}

function ajouteAchat(bouton) {
  const achat = creeAchat({
    semaine: Number(bouton.dataset.ajouterAchat),
    libelle: bouton.dataset.libelle || '',
    poste: bouton.dataset.poste || '',
  });
  applique('Achat ajouté');
  const cle = bouton.dataset.libelle
    ? 'achat-' + achat.id + '-montant' : 'achat-' + achat.id + '-libelle';
  const champ = document.querySelector('[data-cle="' + cle + '"]');
  if (champ) champ.focus();
}

function demandeSuppression(bouton) {
  const entite = bouton.dataset.supprimer;
  const id = Number(bouton.dataset.id);
  const supprime = entite === 'ligne' ? supprimeLigne(id) : supprimeAchat(id);
  if (!supprime) return;
  etat.detailsOuverts.delete(id);
  applique();
  toast('« ' + (supprime.libelle || 'Ligne sans nom') + ' » supprimée.', {
    action: {
      libelle: 'Annuler',
      faire: () => {
        if (entite === 'ligne') creeLigne(supprime); else creeAchat(supprime);
        applique('Ligne rétablie');
      },
    },
  });
}

function nouveauMois() {
  const propose = decaleMois(etat.mois.libelle, 1);
  const saisi = prompt(
    'Quel mois créer ? (format AAAA-MM)\n\n' +
    'Les lignes récurrentes du mois affiché sont recopiées, ' +
    'avec les montants réels remis à zéro.', propose);
  if (!saisi) return;
  const libelle = saisi.trim();
  if (!/^\d{4}-\d{2}$/.test(libelle)) {
    toast('Le mois doit être au format AAAA-MM (par exemple 2026-10).', { erreur: true });
    return;
  }
  const mois = creeMois(libelle, D.moisActif);
  D.moisActif = mois.id;
  applique('Mois créé');
}

function changeMoisRelatif(pas) {
  const cible = decaleMois(etat.mois.libelle, pas);
  const existant = D.mois.find(m => m.libelle === cible);
  if (existant) { D.moisActif = existant.id; applique(); return; }
  if (!confirm(libelleMois(cible) + ' n’existe pas encore. ' +
               'Le créer à partir du mois affiché ?')) return;
  const mois = creeMois(cible, D.moisActif);
  D.moisActif = mois.id;
  applique('Mois créé');
}

/* -- Import / export ------------------------------------------------------ */

function telecharge(nomFichier, contenu, typeMime) {
  const lien = el('a', {
    href: URL.createObjectURL(new Blob([contenu], { type: typeMime })),
    download: nomFichier,
  });
  document.body.append(lien);
  lien.click();
  lien.remove();
  setTimeout(() => URL.revokeObjectURL(lien.href), 2000);
}

function virgule(valeur) { return eur(valeur).toFixed(2).replace('.', ','); }

/** CSV au format français : séparateur « ; », virgule décimale, BOM pour Excel. */
function construitCsv(mois) {
  synchroniseLiens(mois);
  const totaux = recap(mois);
  const lignes = [];
  const ajoute = (cellules) => lignes.push(cellules.map(c => {
    const texte = String(c === null || c === undefined ? '' : c);
    return /[";\n]/.test(texte) ? '"' + texte.replace(/"/g, '""') + '"' : texte;
  }).join(';'));

  ajoute(['Type', 'Nature', 'Catégorie', 'Libellé', 'Estimé', 'Réel', 'Écart', 'Actif', 'Note']);
  for (const ligne of mois.lignes) {
    const estime = ligne.actif ? eur(ligne.estime) : 0;
    ajoute([ligne.type, ligne.nature, ligne.categorie, ligne.libelle,
            virgule(ligne.estime), virgule(ligne.reel), virgule(estime - eur(ligne.reel)),
            ligne.actif ? 'oui' : 'non', ligne.note]);
  }
  ajoute([]);
  ajoute(['TOTAL DÉPENSES', '', '', '',
          virgule(totaux.budget.depenses.estime), virgule(totaux.budget.depenses.reel)]);
  ajoute(['TOTAL REVENUS', '', '', '',
          virgule(totaux.budget.revenus.estime), virgule(totaux.budget.revenus.reel)]);
  ajoute(['RESTE À VIVRE', '', '', '',
          virgule(totaux.budget.restant.estime), virgule(totaux.budget.restant.reel)]);
  ajoute([]);
  ajoute(['Courses — semaine', 'Poste', 'Libellé', 'Montant']);
  for (const achat of mois.achats) {
    ajoute([achat.semaine, achat.poste, achat.libelle, virgule(achat.montant)]);
  }
  ajoute([]);
  ajoute(['Heures gardées', totaux.heures.duree]);
  ajoute(['Salaire brut', virgule(totaux.heures.brut)]);
  ajoute(['Cotisations', virgule(totaux.heures.cotisation)]);
  ajoute(['Salaire net', virgule(totaux.heures.net)]);
  return '﻿' + lignes.join('\r\n') + '\r\n';
}

function actionMenu(action) {
  $$('.menu[open]').forEach(m => m.removeAttribute('open'));

  if (action === 'nouveau-mois') { nouveauMois(); return; }
  if (action === 'export-csv') {
    telecharge('comptes-' + etat.mois.libelle + '.csv', construitCsv(etat.mois),
               'text/csv;charset=utf-8');
    return;
  }
  if (action === 'export-json') {
    telecharge('comptes-sauvegarde-' + new Date().toISOString().slice(0, 10) + '.json',
               JSON.stringify(Object.assign({ application: 'comptes' }, D), null, 2),
               'application/json');
    toast('Sauvegarde téléchargée. Rangez ce fichier : il contient tous vos mois.');
    return;
  }
  if (action === 'import-json') { $('#fichier-import').click(); return; }
  if (action === 'theme') { changeTheme(); return; }
  if (action === 'supprimer-mois') {
    if (D.mois.length <= 1) {
      toast('C’est le seul mois : il ne peut pas être supprimé.', { erreur: true });
      return;
    }
    if (!confirm('Supprimer définitivement ' + libelleMois(etat.mois.libelle) +
                 ' et toutes ses données ?')) return;
    D.mois = D.mois.filter(m => m.id !== D.moisActif);
    D.moisActif = trieMois(D.mois)[0].id;
    applique('Mois supprimé');
  }
}

async function importeFichier(fichier) {
  if (!fichier) return;
  try {
    const donnees = validees(JSON.parse(await fichier.text()));
    if (!donnees) throw new Error('ce fichier ne contient aucun mois exploitable');

    const existants = new Set(D.mois.map(m => m.libelle));
    let importes = 0;
    for (const mois of donnees.mois) {
      if (existants.has(mois.libelle)) continue;
      mois.id = D.prochainId++;
      for (const collection of [mois.lignes, mois.achats, mois.creneaux]) {
        for (const element of collection) element.id = D.prochainId++;
      }
      D.mois.push(mois);
      importes++;
    }
    if (importes) D.moisActif = trieMois(D.mois)[0].id;
    applique();
    toast(importes
      ? importes + ' mois restauré(s). Les mois déjà présents ont été conservés.'
      : 'Aucun mois nouveau à restaurer : ils sont déjà tous là.');
  } catch (erreur) {
    toast('Fichier illisible : ' + erreur.message, { erreur: true });
  } finally {
    $('#fichier-import').value = '';
  }
}

/* -- Thème et préférences ------------------------------------------------- */

function changeTheme() {
  const suite = { auto: 'light', light: 'dark', dark: 'auto' };
  appliqueTheme(suite[document.documentElement.dataset.theme || 'auto']);
}

function appliqueTheme(theme) {
  document.documentElement.dataset.theme = theme;
  $('#etat-theme').textContent = { auto: 'auto', light: 'clair', dark: 'sombre' }[theme];
  try { localStorage.setItem('comptes.theme', theme); } catch (e) { /* ignoré */ }
  if (etat.recap && etat.vue === 'graphiques') {
    dessineGraphiqueCategories();
    dessineGraphiqueEvolution();
  }
}

function enregistrePreferences() {
  try {
    localStorage.setItem('comptes.categoriesFermees',
      JSON.stringify(Array.from(etat.categoriesFermees)));
  } catch (e) { /* ignoré */ }
}

function demarre() {
  stockageDisponible = testeStockage();

  let theme = 'auto', vue = 'budget';
  try {
    theme = localStorage.getItem('comptes.theme') || 'auto';
    vue = localStorage.getItem('comptes.vue') || 'budget';
    const fermees = JSON.parse(localStorage.getItem('comptes.categoriesFermees') || '[]');
    if (Array.isArray(fermees)) etat.categoriesFermees = new Set(fermees);
  } catch (e) { /* stockage indisponible */ }
  appliqueTheme(theme);

  D = lisDonnees();
  if (!D) { donneesDeDepart(); synchroniseLiens(moisActif()); enregistreDonnees(); }
  if (!stockageDisponible) montreAlerteStockage();

  dessineTout();
  montreVue(location.hash.slice(1) || vue);
  ajusteAncrages();
  // Les polices peuvent finir de charger après le premier rendu.
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajusteAncrages);
}

  teste('Dépenses réelles', b.depenses.reel, 550);
  teste('Charges fixes', b.depensesFixes.reel, 550);
  teste('Dépenses variables', b.depensesVariables.reel, 0);
  teste('Revenus réels', b.revenus.reel, 2060);
  teste('Reste à vivre', b.restant.reel, 1510);
  teste('Écart sur les dépenses', b.surplus.reel, 20);
  teste('Coût net de la garde', b.gardeNette.reel, 170);
  teste('Revenus absents des catégories',
        b.parCategorie.some(x => x.categorie === 'Salaire'), false);
  teste('Type inconnu ignoré',
        recapBudget([{ type: 'autre', nature: 'fixe', estime: 99, reel: 99, actif: true }])
          .depenses.reel, 0);

  // Duplication d'un mois.
  D = { version: 1, prochainId: 1, moisActif: null, mois: [] };
  const source = creeMois('2026-01');
  source.lignes.push({ id: D.prochainId++, type: 'depense', nature: 'fixe', categorie: 'A',
                       libelle: 'X', estime: 10, reel: 9, actif: false, note: '', lien: '',
                       rang: 10 });
  const copie = creeMois('2026-02', source.id);
  teste('Duplication : nombre de lignes', copie.lignes.length, source.lignes.length);
  teste('Duplication : réels à zéro', copie.lignes.every(l => l.reel === 0), true);
  teste('Duplication : prévus conservés', copie.lignes[0].estime, 10);
  teste('Duplication : pauses conservées', copie.lignes[0].actif, false);
  teste('Duplication : identifiants distincts', copie.lignes[0].id !== source.lignes[0].id, true);
  teste('Un mois créé deux fois n’est pas dupliqué', creeMois('2026-01').id, source.id);
  teste('Créneaux créés', copie.creneaux.length, 28);

  // Liaison entre le budget et les modules.
  donneesDeDepart();
  const mois = moisActif();
  const ligneCourses = ligneReliee(mois, 'courses');
  const ligneHeures = ligneReliee(mois, 'heures');
  teste('Une ligne de dépense est reliée aux courses', !!ligneCourses, true);
  teste('Un revenu est relié aux heures', !!ligneHeures, true);

  ligneCourses.estime = 250;
  teste('Le budget des courses suit la ligne de dépense', budgetCourses(mois), 250);
  creeAchat({ semaine: 1, poste: 'Marché', libelle: 'Pain', montant: 12.30 });
  creeAchat({ semaine: 2, poste: 'Carrefour', libelle: 'Épicerie', montant: 47.70 });
  synchroniseLiens(mois);
  teste('Le total des courses remonte dans la dépense', ligneCourses.reel, 60);
  teste('Le restant courses tient compte du budget confié',
        recap(mois).courses.restant, 190);
  teste('Le salaire net remonte dans le revenu', ligneHeures.reel, 140.66);

  // Une ligne déliée cesse d'être pilotée par son module.
  ligneCourses.lien = '';
  ligneCourses.reel = 999;
  synchroniseLiens(mois);
  teste('Une ligne déliée garde son montant saisi', ligneCourses.reel, 999);
  ligneCourses.lien = 'courses';
  synchroniseLiens(mois);
  teste('Reliée à nouveau, elle reprend le total du module', ligneCourses.reel, 60);

  // Aller-retour export / import.
  donneesDeDepart();
  synchroniseLiens(moisActif());
  const avant = recap(moisActif());
  const relu = validees(JSON.parse(JSON.stringify(D)));
  const apres = recap(relu.mois.find(m => m.id === relu.moisActif));
  teste('Sauvegarde/restauration : dépenses', apres.budget.depenses, avant.budget.depenses);
  teste('Sauvegarde/restauration : heures', apres.heures.minutes, avant.heures.minutes);
  teste('Données de départ : nombre de lignes', moisActif().lignes.length, 47);

  const rates = resultats.filter(r => !r.memeChose);
  document.body.replaceChildren(el('div', { class: 'verif' },
    el('h2', { texte: 'Auto-vérification des calculs' }),
    el('ul', {}, resultats.map(r => el('li', {},
      el('span', { class: r.memeChose ? 'ok' : 'ko', texte: r.memeChose ? '✓' : '✕' }),
      el('span', { texte: r.nom }),
      r.memeChose ? null : el('span', { class: 'ko',
        texte: ' → obtenu ' + JSON.stringify(r.obtenu) +
               ', attendu ' + JSON.stringify(r.attendu) })))),
    el('p', { class: 'verif__bilan',
              texte: rates.length
                ? rates.length + ' vérification(s) en échec sur ' + resultats.length
                : resultats.length + ' vérifications passées.' }),
    el('p', {}, el('a', { href: '#budget', onclick: () => location.reload() },
                   '← Revenir à l’application'))));
  document.title = (rates.length ? 'ECHECS=' + rates.length : 'TOUT OK') +
                   ' (' + resultats.length + ' verifications)';
}

if (location.hash.slice(1) === 'autotest') verifie(); else demarre();
</script>
</body>
</html>
