<!doctype html>
<html lang="fr" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comptes</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>&#x1F4B6;</text></svg>">
<!--
  Comptes — suivi budgetaire mensuel.
  Un seul fichier : ouvrez-le dans votre navigateur, rien a installer.
  Vos donnees restent dans ce navigateur et ne partent nulle part.
-->
<style>
/* ==========================================================================
   Comptes — feuille de style
   Palette et règles graphiques issues du système de visualisation validé :
   marques fines, grilles en filet, écarts de 2 px en couleur de fond.
   ========================================================================== */

:root {
  color-scheme: light;

  /* Surfaces et encres */
  --plan:            #f9f9f7;
  --surface:         #fcfcfb;
  --surface-creuse:  #f2f1ee;
  --encre:           #0b0b0b;
  --encre-2:         #52514e;
  --encre-3:         #898781;
  --filet:           #e1e0d9;
  --ligne-base:      #c3c2b7;
  --bord:            rgba(11, 11, 11, .10);

  /* Séries (emplacements 1 et 2 de la palette catégorielle) */
  --serie-1:         #2a78d6;
  --serie-2:         #eb6834;
  --serie-1-clair:   #cde2fb;

  /* États : toujours accompagnés d'une icône et d'un libellé */
  --bon:             #0ca30c;
  --bon-texte:       #006300;
  --alerte:          #fab219;
  --grave:           #ec835a;
  --critique:        #d03b3b;

  --rayon:           10px;
  --rayon-petit:     6px;
  --police: system-ui, -apple-system, "Segoe UI", sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --plan:           #0d0d0d;
    --surface:        #1a1a19;
    --surface-creuse: #232322;
    --encre:          #ffffff;
    --encre-2:        #c3c2b7;
    --encre-3:        #898781;
    --filet:          #2c2c2a;
    --ligne-base:     #383835;
    --bord:           rgba(255, 255, 255, .10);
    --serie-1:        #3987e5;
    --serie-2:        #d95926;
    --serie-1-clair:  #184f95;
    --bon-texte:      #0ca30c;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --plan:           #0d0d0d;
  --surface:        #1a1a19;
  --surface-creuse: #232322;
  --encre:          #ffffff;
  --encre-2:        #c3c2b7;
  --encre-3:        #898781;
  --filet:          #2c2c2a;
  --ligne-base:     #383835;
  --bord:           rgba(255, 255, 255, .10);
  --serie-1:        #3987e5;
  --serie-2:        #d95926;
  --serie-1-clair:  #184f95;
  --bon-texte:      #0ca30c;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--plan);
  color: var(--encre);
  font-family: var(--police);
  font-size: 15px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.01em; }
h1 { font-size: 1.05rem; }
h2 { font-size: .95rem; }

.visuellement-cache {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip-path: inset(50%); white-space: nowrap;
}

.pousse { flex: 1 1 auto; }

/* ------------------------------------------------------------ Barre haute */

.barre {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--filet);
}

.barre__titre { display: flex; align-items: center; gap: 8px; }

.barre__logo {
  display: grid; place-items: center;
  width: 26px; height: 26px; border-radius: 8px;
  background: var(--serie-1); color: #fff;
  font-weight: 700; font-size: .9rem;
}

.barre__mois { display: flex; align-items: center; gap: 4px; }
.barre__actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }

/* --------------------------------------------------------------- Contrôles */

.bouton {
  appearance: none;
  padding: 7px 12px;
  border: 1px solid var(--bord);
  border-radius: var(--rayon-petit);
  background: var(--surface);
  color: var(--encre);
  font: inherit; font-size: .875rem;
  cursor: pointer;
  transition: background .12s ease, border-color .12s ease;
}
.bouton:hover { background: var(--surface-creuse); }
.bouton:focus-visible,
select:focus-visible, input:focus-visible, summary:focus-visible,
[role="tab"]:focus-visible, .segmente button:focus-visible {
  outline: 2px solid var(--serie-1); outline-offset: 2px;
}

.bouton--primaire {
  background: var(--serie-1); border-color: transparent; color: #fff; font-weight: 500;
}
.bouton--primaire:hover { filter: brightness(1.08); background: var(--serie-1); }
.bouton--icone { padding: 6px 10px; font-size: 1rem; line-height: 1; }
.bouton--fantome {
  border-color: transparent; background: none; color: var(--encre-2);
  padding: 5px 8px; font-size: .8rem;
}
.bouton--fantome:hover { background: var(--surface-creuse); color: var(--encre); }
.danger { color: var(--critique); }

select, input[type="text"], input[type="search"], input[type="month"] {
  padding: 6px 9px;
  border: 1px solid var(--bord);
  border-radius: var(--rayon-petit);
  background: var(--surface);
  color: var(--encre);
  font: inherit; font-size: .875rem;
}
input::placeholder { color: var(--encre-3); }

.champ-recherche { min-width: 180px; }

.champ-inline {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: .82rem; color: var(--encre-2);
}
.champ-inline input { width: 94px; }

.interrupteur-texte {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: .82rem; color: var(--encre-2); cursor: pointer;
}

.segmente { display: inline-flex; border: 1px solid var(--bord); border-radius: var(--rayon-petit); overflow: hidden; }
.segmente button {
  appearance: none; border: 0; background: var(--surface); color: var(--encre-2);
  padding: 6px 12px; font: inherit; font-size: .82rem; cursor: pointer;
}
.segmente button + button { border-left: 1px solid var(--bord); }
.segmente button.actif { background: var(--serie-1); color: #fff; font-weight: 500; }

/* Menu « ⋯ » */
.menu { position: relative; }
.menu > summary { list-style: none; display: inline-block; }
.menu > summary::-webkit-details-marker { display: none; }
.menu__contenu {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 40;
  min-width: 240px; padding: 6px;
  background: var(--surface);
  border: 1px solid var(--bord); border-radius: var(--rayon);
  box-shadow: 0 12px 28px rgba(0, 0, 0, .14);
}
.menu__contenu button {
  display: block; width: 100%; text-align: left;
  padding: 8px 10px; border: 0; border-radius: var(--rayon-petit);
  background: none; color: inherit; font: inherit; font-size: .875rem; cursor: pointer;
}
.menu__contenu button:hover { background: var(--surface-creuse); }
.menu__contenu hr { border: 0; border-top: 1px solid var(--filet); margin: 5px 2px; }

/* ---------------------------------------------------------------- Onglets */

.onglets {
  display: flex; gap: 2px; overflow-x: auto;
  padding: 0 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--filet);
  position: sticky; top: 51px; z-index: 20;
}
.onglet {
  appearance: none; border: 0; background: none;
  padding: 11px 13px; margin-bottom: -1px;
  border-bottom: 2px solid transparent;
  color: var(--encre-2); font: inherit; font-size: .875rem; white-space: nowrap;
  cursor: pointer;
}
.onglet:hover { color: var(--encre); }
.onglet[aria-selected="true"] { color: var(--encre); font-weight: 600; border-bottom-color: var(--serie-1); }

main { max-width: 1180px; margin: 0 auto; padding: 18px 16px 72px; }

/* ----------------------------------------------------------- Mise en page */

.carte {
  background: var(--surface);
  border: 1px solid var(--bord);
  border-radius: var(--rayon);
  padding: 14px 16px;
}
.carte__entete { margin-bottom: 10px; }
.carte__sous-titre { margin: 2px 0 0; font-size: .78rem; color: var(--encre-3); }

.grille-deux {
  display: grid; gap: 14px; align-items: start;
  grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
}
.pile { display: grid; gap: 14px; align-content: start; }

/* ------------------------------------------------- Chiffre clé et tuiles */

.heros {
  display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap;
  padding: 4px 2px 16px;
}
.heros__bloc { display: grid; gap: 2px; }
.heros__etiquette { font-size: .8rem; color: var(--encre-2); }
.heros__valeur { font-size: 3rem; font-weight: 600; line-height: 1.05; letter-spacing: -.02em; }
.heros__valeur--negatif { color: var(--critique); }
.heros__note { font-size: .82rem; color: var(--encre-2); }

.tuiles {
  display: grid; gap: 12px; margin-bottom: 16px;
  grid-template-columns: repeat(auto-fit, minmax(178px, 1fr));
}
.tuile {
  background: var(--surface); border: 1px solid var(--bord);
  border-radius: var(--rayon); padding: 12px 13px;
}
.tuile__etiquette { font-size: .78rem; color: var(--encre-2); }
.tuile__valeur { margin-top: 3px; font-size: 1.45rem; font-weight: 600; letter-spacing: -.01em; }
.tuile__delta { margin-top: 2px; font-size: .78rem; color: var(--encre-3); }
.tuile__delta--bon { color: var(--bon-texte); }
.tuile__delta--mauvais { color: var(--critique); }

/* ------------------------------------------------------------ Graphique */

.graphique { width: 100%; }
.graphique svg { display: block; width: 100%; height: auto; }

.legende {
  display: flex; gap: 16px; flex-wrap: wrap;
  margin: 2px 0 10px; font-size: .78rem; color: var(--encre-2);
}
.legende__cle { display: inline-flex; align-items: center; gap: 6px; }
.legende__pastille { width: 11px; height: 11px; border-radius: 2px; background: var(--serie-1); }
.legende__trait { width: 2px; height: 13px; background: var(--encre-2); }

.tableau-jumeau { margin-top: 10px; font-size: .84rem; }
.tableau-jumeau summary { cursor: pointer; color: var(--encre-2); }
.tableau-jumeau table { width: 100%; border-collapse: collapse; margin-top: 8px; }
.tableau-jumeau th, .tableau-jumeau td {
  padding: 5px 6px; border-bottom: 1px solid var(--filet); text-align: right;
  font-variant-numeric: tabular-nums;
}
.tableau-jumeau th:first-child, .tableau-jumeau td:first-child { text-align: left; font-variant-numeric: normal; }
.tableau-jumeau th { color: var(--encre-2); font-weight: 500; }

.infobulle {
  position: fixed; z-index: 60; pointer-events: none;
  min-width: 150px; padding: 8px 10px;
  background: var(--surface); color: var(--encre);
  border: 1px solid var(--bord); border-radius: var(--rayon-petit);
  box-shadow: 0 8px 22px rgba(0, 0, 0, .16);
  font-size: .8rem;
}
.infobulle__titre { font-weight: 600; margin-bottom: 4px; }
.infobulle__ligne { display: flex; align-items: center; gap: 7px; justify-content: space-between; }
.infobulle__valeur { font-weight: 600; font-variant-numeric: tabular-nums; }
.infobulle__nom { color: var(--encre-2); display: inline-flex; align-items: center; gap: 6px; }

/* --------------------------------------------------------------- Jauges */

.jauge { display: grid; gap: 5px; }
.jauge__entete { display: flex; justify-content: space-between; gap: 10px; font-size: .82rem; }
.jauge__nom { color: var(--encre-2); }
.jauge__chiffres { font-variant-numeric: tabular-nums; }
.jauge__piste {
  height: 9px; border-radius: 999px; background: var(--serie-1-clair); overflow: hidden;
}
.jauge__remplissage { height: 100%; border-radius: 999px; background: var(--serie-1); }
.jauge__remplissage--alerte { background: var(--alerte); }
.jauge__remplissage--critique { background: var(--critique); }
.jauge__etat { font-size: .78rem; color: var(--encre-2); }
.jauge__etat--alerte { color: var(--encre); }
.jauge__etat--critique { color: var(--critique); }

/* --------------------------------------------------------------- Tableaux */

.outils {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-bottom: 14px;
}

.groupe { margin-bottom: 18px; }
.groupe__entete {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  padding: 6px 2px; margin-bottom: 2px;
}
.groupe__nom { font-size: .82rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.groupe__total { font-size: .82rem; color: var(--encre-2); font-variant-numeric: tabular-nums; }

table.lignes {
  width: 100%; border-collapse: collapse;
  background: var(--surface);
  border: 1px solid var(--bord); border-radius: var(--rayon);
  overflow: hidden;
}
table.lignes thead th {
  padding: 8px 10px;
  font-size: .72rem; font-weight: 500; text-transform: uppercase; letter-spacing: .05em;
  color: var(--encre-3); text-align: left;
  background: var(--surface-creuse);
  border-bottom: 1px solid var(--filet);
  white-space: nowrap;
}
table.lignes td { padding: 4px 6px; border-bottom: 1px solid var(--filet); vertical-align: middle; }
table.lignes tr:last-child td { border-bottom: 0; }
table.lignes tr:hover td { background: color-mix(in srgb, var(--surface-creuse) 55%, transparent); }
table.lignes tr.en-pause td:not(.col-actif) { opacity: .55; }

.col-nombre { text-align: right; }
.col-nombre input { text-align: right; font-variant-numeric: tabular-nums; }
.col-actif { width: 42px; text-align: center; }
.col-suppr { width: 40px; text-align: center; }

table.lignes input[type="text"], table.lignes select {
  width: 100%; min-width: 0;
  border-color: transparent; background: transparent;
  padding: 5px 7px;
}
table.lignes input[type="text"]:hover, table.lignes select:hover { border-color: var(--bord); }
table.lignes input[type="text"]:focus { border-color: var(--serie-1); background: var(--surface); }
table.lignes .col-nombre input { width: 100px; }
table.lignes .col-libelle input { font-weight: 500; }

.ecart { font-size: .84rem; font-variant-numeric: tabular-nums; color: var(--encre-3); white-space: nowrap; }
.ecart--bon { color: var(--bon-texte); }
.ecart--mauvais { color: var(--critique); }

.bascule {
  appearance: none; margin: 0; cursor: pointer;
  width: 30px; height: 17px; border-radius: 999px;
  background: var(--ligne-base); border: 0; position: relative;
  transition: background .14s ease;
}
.bascule::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 13px; height: 13px; border-radius: 50%; background: #fff;
  transition: transform .14s ease;
}
.bascule:checked { background: var(--serie-1); }
.bascule:checked::after { transform: translateX(13px); }

.pied-tableau { padding: 8px 4px 0; }

.vide {
  padding: 26px 16px; text-align: center; color: var(--encre-2);
  background: var(--surface); border: 1px dashed var(--bord); border-radius: var(--rayon);
}

/* ------------------------------------------------------ Courses / heures */

.semaines { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.semaines--larges { grid-template-columns: repeat(auto-fit, minmax(460px, 1fr)); }
.semaine__entete { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.semaine__titre { font-size: .9rem; font-weight: 600; }

.puces { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.puce {
  appearance: none; cursor: pointer;
  padding: 4px 9px; border: 1px solid var(--bord); border-radius: 999px;
  background: var(--surface); color: var(--encre-2); font: inherit; font-size: .78rem;
}
.puce:hover { background: var(--surface-creuse); color: var(--encre); }

.resume-bandeau {
  display: grid; gap: 12px; margin-bottom: 16px;
  grid-template-columns: repeat(auto-fit, minmax(178px, 1fr));
}

/* Largeurs maîtrisées : ces tableaux vivent dans des cartes étroites. */
table.lignes--achats { table-layout: fixed; }
table.lignes--achats th:nth-child(1), table.lignes--achats td:nth-child(1) { width: 30%; }
table.lignes--achats th:nth-child(2), table.lignes--achats td:nth-child(2) { width: 36%; }
table.lignes--achats th:nth-child(3), table.lignes--achats td:nth-child(3) { width: 26%; }
table.lignes--achats th:nth-child(4), table.lignes--achats td:nth-child(4) { width: 8%; }
table.lignes--achats .col-nombre input { width: 100%; }

table.heures { table-layout: fixed; }
table.heures th, table.heures td { padding: 3px 4px; }
table.heures th:first-child, table.heures td:first-child { width: 22%; }
table.heures th:last-child, table.heures td:last-child { width: 14%; }
table.heures input[type="text"] { width: 100%; min-width: 0; text-align: center; font-variant-numeric: tabular-nums; }
table.heures .jour { font-size: .82rem; color: var(--encre-2); white-space: nowrap; padding-left: 8px; }
table.heures .duree { font-size: .82rem; font-variant-numeric: tabular-nums; text-align: right; padding-right: 8px; white-space: nowrap; }
table.heures .separateur { border-left: 1px solid var(--filet); }

/* ------------------------------------------------------- Retours visuels */

.toasts {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
  z-index: 80; display: grid; gap: 8px; width: min(440px, calc(100vw - 32px));
}
.toast {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px;
  background: var(--surface); color: var(--encre);
  border: 1px solid var(--bord); border-radius: var(--rayon);
  box-shadow: 0 10px 26px rgba(0, 0, 0, .18);
  font-size: .86rem;
}
.toast__texte { flex: 1 1 auto; }
.toast--erreur { border-color: var(--critique); }

.sauvegarde {
  position: fixed; right: 14px; bottom: 14px; z-index: 70;
  padding: 5px 10px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--bord);
  font-size: .76rem; color: var(--encre-2);
  opacity: 0; transition: opacity .2s ease; pointer-events: none;
}
.sauvegarde.visible { opacity: 1; }

/* ---------------------------------------------------------- Petits écrans */

@media (max-width: 900px) {
  .grille-deux { grid-template-columns: 1fr; }
}

@media (max-width: 760px) {
  .onglets { top: 92px; }
  main { padding: 14px 12px 72px; }
  .heros__valeur { font-size: 2.4rem; }
  .semaines, .semaines--larges { grid-template-columns: 1fr; }

  /* Rien ne doit dépasser en largeur : tout passe à la ligne. */
  .barre { padding: 8px 12px; }
  .barre__mois { flex: 1 1 auto; min-width: 0; }
  .barre__mois select { flex: 1 1 auto; min-width: 0; max-width: 220px; }
  .barre__actions { margin-left: 0; }
  .outils > * { min-width: 0; }
  .champ-recherche { flex: 1 1 100%; min-width: 0; }
  .interrupteur-texte { flex: 1 1 100%; }

  /* Chaque ligne devient une fiche lisible au pouce. */
  table.lignes, table.lignes tbody, table.lignes tr, table.lignes td { display: block; width: 100%; }
  table.lignes, table.lignes--achats, table.heures { table-layout: auto; border: 0; background: none; }
  table.lignes thead { display: none; }
  table.lignes tr {
    position: relative;
    margin-bottom: 10px; padding: 8px 10px 8px 10px;
    background: var(--surface); border: 1px solid var(--bord); border-radius: var(--rayon);
  }
  /* Place réservée en haut à droite pour l'interrupteur et la suppression. */
  table.lignes tr:has(.col-actif), table.lignes tr:has(.col-suppr) { padding-right: 84px; }
  table.lignes tr:hover td { background: none; }
  table.lignes td { border: 0; padding: 3px 0; width: auto; }
  table.lignes td::before {
    content: attr(data-etiquette);
    display: inline-block; width: 90px; vertical-align: middle;
    font-size: .74rem; color: var(--encre-3); text-transform: uppercase; letter-spacing: .04em;
  }
  table.lignes td.col-libelle::before { display: none; }
  table.lignes .col-nombre { text-align: left; }
  table.lignes input[type="text"], table.lignes select {
    width: calc(100% - 96px); max-width: none; border-color: var(--bord);
  }
  table.lignes .col-nombre input { width: 120px; text-align: left; }
  table.lignes td.col-libelle input { width: 100%; font-size: 1rem; }
  table.lignes .col-actif, table.lignes .col-suppr {
    position: absolute; top: 9px; z-index: 2; width: auto; padding: 0; text-align: right;
  }
  table.lignes .col-actif { right: 44px; }
  table.lignes .col-suppr { right: 6px; }
  table.lignes .col-actif::before, table.lignes .col-suppr::before { display: none; }

  /* Les heures restent un tableau : la grille jour/matin/après-midi y est essentielle. */
  table.heures, table.heures tbody, table.heures tr { display: table; width: 100%; }
  table.heures thead { display: table-header-group; }
  table.heures td { display: table-cell; width: auto; padding: 3px 2px; }
  table.heures td::before { display: none; }
  table.heures tr { margin: 0; padding: 0; border: 0; border-radius: 0;
                    border-bottom: 1px solid var(--filet); background: none; }
  table.heures { font-size: .8rem; }
  table.heures input[type="text"] { width: 100%; padding: 5px 2px; }
  table.heures .jour { padding-left: 4px; }
}

@media (max-width: 380px) {
  table.lignes td::before { display: block; width: auto; }
  table.lignes input[type="text"], table.lignes select { width: 100%; }

<script>
/* ==========================================================================

   Organisation du script :
     1. Réglages et données de départ
     2. Calculs (purs : ils ne touchent ni à l'écran ni au stockage)
     3. Stockage dans le navigateur
     4. Modifications des données
     5. Affichage
     6. Interactions
     7. Démarrage et auto-vérification
   ========================================================================== */

'use strict';

/* ========================================================================== */
/* 1. Réglages et données de départ                                           */
/* ========================================================================== */

const CLE_STOCKAGE = 'comptes.donnees.v1';
const VERSION_DONNEES = 1;

const TYPES = ['depense', 'salaire', 'aide'];
const NATURES = ['fixe', 'variable'];
const TAUX_HORAIRE_DEFAUT = 12.02;
const TAUX_COTISATION_DEFAUT = 21.2;
const BUDGET_COURSES_DEFAUT = 400;
const BUDGET_SEMAINE_DEFAUT = 100;
const SEMAINES_PAR_DEFAUT = 4;

const JOURS = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
const VUES = ['tableau', 'depenses', 'revenus', 'courses', 'heures'];
const POSTES_COURANTS = ['Marché', 'Carrefour', 'Wevrac', 'Boulangerie', 'Pharmacie'];
const ACHATS_COURANTS = ['Fruits/Légumes', 'Olives', 'Fromage', 'Viande', 'Poisson',
                         'Pain', 'Italien', 'Café', 'Poulet'];
const LIENS = { '': '—', courses: 'Courses', heures: 'Heures gardées',
                garde: 'Garde (coût brut)', caf: 'CAF (aide garde)' };

/* Reprise du tableau d'origine : [nature, catégorie, libellé, prévu, réel, actif, note, lien] */
const DEPENSES_INITIALES = [

  ['fixe', 'Transports', 'Essence', 80, 0, 1, '', ''],

  ['variable', 'Abonnements', 'Claude Max', 90, 90, 1, '', ''],
  ['variable', 'Abonnements', 'PlayStation Plus', 16, 15, 1, '', ''],
  ['variable', 'Abonnements', 'GitHub', 4, 4, 1, '', ''],
  ['variable', 'Abonnements', 'DeepL Pro', 30, 0, 1, '', ''],
  ['variable', 'Abonnements', 'ChatGPT', 21.99, 0, 0, '', ''],
  ['variable', 'Abonnements', 'Amazon Prime', 7, 0, 0, '', ''],
  ['variable', 'Paiement en 4 fois', 'Aspirateur', 0, 0, 1, '', ''],
  ['variable', 'Paiement en 4 fois', 'Chemises', 24.75, 24.75, 1, '', ''],
  ['variable', 'Paiement en 4 fois', 'AirSense 11', 249, 249, 1, '', ''],
  ['variable', 'Paiement en 4 fois', 'PlayStation', 150, 150, 1, '', ''],
  ['variable', 'Paiement en 4 fois', 'TV', 225, 225, 1, '', ''],
  ['variable', 'Autres', 'Cotisations', 91, 91, 1, '', ''],
  ['variable', 'Autres', 'Piano différé', 60, 60, 1, '', ''],
  ['variable', 'Autres', 'Julie', 30, 30, 1, '', ''],
  ['variable', 'Autres', 'Restaurant Paris', 35, 35, 1, '', ''],
  ['variable', 'Autres', 'Jeux', 70, 70, 1, '', ''],
];

/* [type, nature, catégorie, libellé, prévu, réel, lien] */
const REVENUS_INITIAUX = [
  ['salaire', 'fixe', 'Salaire', 'Evry', 1781.34, 1174.88, ''],
  ['salaire', 'fixe', 'Salaire', 'Creil', 394.40, 394.40, ''],
  ['salaire', 'variable', 'Salaire', 'Caracole', 0, 0, 'heures'],
  ['salaire', 'variable', 'Salaire', 'Commande', 0, 0, ''],
  ['salaire', 'variable', 'Salaire', 'Virement 1', 0, 0, ''],
  ['salaire', 'variable', 'Salaire', 'Virement 2', 0, 0, ''],
  ['aide', 'fixe', 'Aide', 'RLP', 360, 360, ''],
  ['aide', 'variable', 'Aide', 'CAF', 0, 0, 'caf'],
];

/* [semaine, jour, matin début, matin fin, après-midi début, après-midi fin] */
const CRENEAUX_INITIAUX = [
  [1, 0, '10:04', '11:30', '13:36', '17:00'],
  [1, 3, '09:30', '11:30', '12:30', '15:00'],
  [2, 0, '10:00', '11:30', '12:44', '13:28'],
  [3, 3, '09:30', '12:16', '12:48', '13:19'],
];

/* ========================================================================== */
/* 2. Calculs                                                                 */
/* ========================================================================== */

/** Arrondit un montant au centime. */
function eur(valeur) {
  const nombre = Number(valeur);
  if (!Number.isFinite(nombre)) return 0;
  return Math.round(nombre * 100 + (nombre < 0 ? -1e-6 : 1e-6)) / 100;
}

/** Lit un montant saisi à la française : « 1 234,56 » ou « 12,50 € » -> nombre. */
function nombre(valeur) {
  if (valeur === null || valeur === undefined || valeur === '') return 0;
  if (typeof valeur === 'number') return eur(valeur);
  let texte = String(valeur).trim()
    .replace(/[\s  ]/g, '')
    .replace(/€/g, '')
    .replace(',', '.');
  if (texte === '' || texte === '-' || texte === '.' || texte === '-.') return 0;
  const lu = Number(texte);
  return Number.isFinite(lu) ? eur(lu) : 0;
}

/** « 09:30 », « 9h30 » ou « 9 » -> minutes depuis minuit. null si illisible. */
function minutesDepuisHeure(texte) {
  if (texte === null || texte === undefined) return null;
  const propre = String(texte).trim().toLowerCase().replace(/h/g, ':').replace(/\./g, ':');
  if (!propre) return null;
  const morceaux = propre.split(':');
  const heures = Number(morceaux[0]);
  const minutes = morceaux.length > 1 && morceaux[1] !== '' ? Number(morceaux[1]) : 0;
  if (!Number.isInteger(heures) || !Number.isInteger(minutes)) return null;
  if (heures < 0 || heures > 23 || minutes < 0 || minutes > 59) return null;
  return heures * 60 + minutes;
}

/** 570 -> « 09:30 ». */
function heureDepuisMinutes(minutes) {
  if (minutes === null || minutes === undefined) return '';
  const total = ((Math.trunc(minutes) % 1440) + 1440) % 1440;
  return String(Math.floor(total / 60)).padStart(2, '0') + ':' +
         String(total % 60).padStart(2, '0');
}

/** Durée d'une plage en minutes. 0 si incomplète ou incohérente. */
function dureePlage(debut, fin) {
  const a = minutesDepuisHeure(debut);
  const b = minutesDepuisHeure(fin);
  if (a === null || b === null || b <= a) return 0;
  return b - a;
}

/** Durée d'une journée = matin + après-midi. */
function dureeCreneau(creneau) {
  return dureePlage(creneau.matinDebut, creneau.matinFin) +
         dureePlage(creneau.apremDebut, creneau.apremFin);
}

/** 891 -> « 14 h 51 ». */
function formatDuree(minutes) {
  const total = Math.round(minutes || 0);
  return Math.floor(total / 60) + ' h ' + String(total % 60).padStart(2, '0');
}

/** Heures gardées puis salaire brut / cotisations / net. */
function recapHeures(creneaux, tauxHoraire, tauxCotisation) {
  const parSemaine = new Map();
  let total = 0;
  for (const creneau of creneaux) {
    const duree = dureeCreneau(creneau);
    total += duree;
    const semaine = Number(creneau.semaine) || 1;
    parSemaine.set(semaine, (parSemaine.get(semaine) || 0) + duree);
  }
  const heures = total / 60;
  const brut = eur(heures * (Number(tauxHoraire) || 0));
  const cotisation = eur(brut * (Number(tauxCotisation) || 0) / 100);
  return {
    minutes: total,
    heures,
    duree: formatDuree(total),
    tauxHoraire: eur(tauxHoraire),
    tauxCotisation: Math.round((Number(tauxCotisation) || 0) * 100) / 100,
    brut,
    cotisation,
    net: eur(brut - cotisation),
    parSemaine: Array.from(parSemaine.keys()).sort((a, b) => a - b)
      .map(s => ({ semaine: s, minutes: parSemaine.get(s), duree: formatDuree(parSemaine.get(s)) })),
  };
}

/** Suivi hebdomadaire des courses. */
function recapCourses(semaines, achats, budgetTotal) {
  const depenseParSemaine = new Map();
  const parPoste = new Map();
  let total = 0;

  for (const achat of achats) {
    const montant = eur(achat.montant);
    const semaine = Number(achat.semaine) || 1;
    depenseParSemaine.set(semaine, eur((depenseParSemaine.get(semaine) || 0) + montant));
    const poste = (achat.poste || 'Autre').trim() || 'Autre';
    parPoste.set(poste, eur((parPoste.get(poste) || 0) + montant));
    total = eur(total + montant);
  }

  const lignes = semaines.map(semaine => {
    const budget = eur(semaine.budget);
    const depense = eur(depenseParSemaine.get(Number(semaine.numero)) || 0);
    return { numero: Number(semaine.numero), budget, depense, restant: eur(budget - depense) };
  });

  const budget = eur(budgetTotal);
  return {
    semaines: lignes,
    budgetTotal: budget,
    budgetSemaines: eur(lignes.reduce((s, l) => s + l.budget, 0)),
    depense: total,
    restant: eur(budget - total),
    parPoste: Array.from(parPoste.entries())
      .map(([poste, montant]) => ({ poste, montant }))
      .sort((a, b) => b.montant - a.montant),
  };
}

function cumulVide() { return { estime: 0, reel: 0 }; }

function cumule(cumul, estime, reel) {
  cumul.estime = eur(cumul.estime + estime);
  cumul.reel = eur(cumul.reel + reel);
}

function sommeCumuls(...cumuls) {
  const total = cumulVide();
  for (const cumul of cumuls) cumule(total, cumul.estime, cumul.reel);
  return total;
}

/**
 * Totaux du mois.
 * Une ligne en pause garde son montant affiché mais ne compte pas :
 * c'est l'équivalent des colonnes « Actif / Ref » du tableau d'origine.
 */
function recapBudget(lignes) {
  const groupes = {};
  for (const type of TYPES) for (const nature of NATURES) groupes[type + '-' + nature] = cumulVide();

  const parCategorie = new Map();
  const enPause = [];
  const garde = cumulVide();
  const caf = cumulVide();

  for (const ligne of lignes) {
    const cle = ligne.type + '-' + ligne.nature;
    if (!groupes[cle]) continue;
    const actif = !!ligne.actif;
    const estimeSaisi = eur(ligne.estime);
    const estime = actif ? estimeSaisi : 0;
    const reel = eur(ligne.reel);

    cumule(groupes[cle], estime, reel);

    if (!actif && estimeSaisi) {
      enPause.push({ id: ligne.id, libelle: ligne.libelle || '',
                     categorie: ligne.categorie || '', estime: estimeSaisi });
    }

    if (ligne.type === 'depense') {
      const categorie = (ligne.categorie || '').trim() || 'Sans catégorie';
      if (!parCategorie.has(categorie)) {
        parCategorie.set(categorie, { categorie, estime: 0, reel: 0 });
      }
      cumule(parCategorie.get(categorie), estime, reel);
    }

    const lien = (ligne.lien || '').trim();
    if (lien === 'garde') cumule(garde, estime, reel);
    else if (lien === 'caf') cumule(caf, estime, reel);
  }

  const depenses = sommeCumuls(groupes['depense-fixe'], groupes['depense-variable']);
  const salaires = sommeCumuls(groupes['salaire-fixe'], groupes['salaire-variable']);
  const aides = sommeCumuls(groupes['aide-fixe'], groupes['aide-variable']);
  const revenus = sommeCumuls(salaires, aides);

  return {
    depenses,
    depensesFixes: groupes['depense-fixe'],
    depensesVariables: groupes['depense-variable'],
    salaires, aides, revenus,
    restant: { estime: eur(revenus.estime - depenses.estime),
               reel: eur(revenus.reel - depenses.reel) },
    /* Positif = on a dépensé moins que prévu (le « Surplus » du tableau). */
    surplus: { estime: 0, reel: eur(depenses.estime - depenses.reel) },
    garde, caf,
    gardeNette: { estime: eur(garde.estime - caf.estime), reel: eur(garde.reel - caf.reel) },
    enPause: enPause.sort((a, b) => b.estime - a.estime),
    economieEnPause: eur(enPause.reduce((s, l) => s + l.estime, 0)),
    parCategorie: Array.from(parCategorie.values()).sort((a, b) => {
      const ecart = Math.max(b.reel, b.estime) - Math.max(a.reel, a.estime);
      return ecart !== 0 ? ecart : a.categorie.localeCompare(b.categorie, 'fr');
    }),
  };
}

/** Assemble les trois récapitulatifs d'un mois. */
function recap(mois) {
  return {
    budget: recapBudget(mois.lignes),
    courses: recapCourses(mois.semaines, mois.achats, mois.budgetCourses),
    heures: recapHeures(mois.creneaux, mois.tauxHoraire, mois.tauxCotisation),
  };
}

/* ========================================================================== */
/* 3. Stockage dans le navigateur                                             */
/* ========================================================================== */

/** Toutes les données de l'application. */
let D = null;
let stockageDisponible = true;

function moisCourantLibelle() {
  const maintenant = new Date();
  return maintenant.getFullYear() + '-' + String(maintenant.getMonth() + 1).padStart(2, '0');
}

function testeStockage() {
  try {
    const sonde = CLE_STOCKAGE + '.sonde';
    localStorage.setItem(sonde, '1');
    localStorage.removeItem(sonde);
    return true;
  } catch (erreur) {
    return false;
  }
}

function lisDonnees() {
  if (!stockageDisponible) return null;
  try {
    const brut = localStorage.getItem(CLE_STOCKAGE);
    if (!brut) return null;
    const donnees = JSON.parse(brut);
    return validees(donnees);
  } catch (erreur) {
    console.warn('Données illisibles, on repart de zéro.', erreur);
    return null;
  }
}

function enregistreDonnees() {
  if (!stockageDisponible) return false;
  try {
    localStorage.setItem(CLE_STOCKAGE, JSON.stringify(D));
    return true;
  } catch (erreur) {
    stockageDisponible = false;
    montreAlerteStockage(
      'Le navigateur a refusé d’enregistrer (mémoire pleine ou navigation privée).');
    return false;
  }
}

/** Vérifie la forme des données et complète ce qui manque. */
function validees(donnees) {
  if (!donnees || typeof donnees !== 'object' || !Array.isArray(donnees.mois)) return null;
  const propre = {
    version: VERSION_DONNEES,
    prochainId: Number(donnees.prochainId) || 1,
    moisActif: donnees.moisActif ?? null,
    mois: [],
  };
  for (const mois of donnees.mois) {
    if (!mois || typeof mois.libelle !== 'string') continue;
    const complet = {
      id: Number(mois.id) || propre.prochainId++,
      libelle: mois.libelle,
      note: String(mois.note || ''),
      tauxHoraire: Number(mois.tauxHoraire) || TAUX_HORAIRE_DEFAUT,
      tauxCotisation: Number.isFinite(Number(mois.tauxCotisation))
        ? Number(mois.tauxCotisation) : TAUX_COTISATION_DEFAUT,
      budgetCourses: Number.isFinite(Number(mois.budgetCourses))
        ? Number(mois.budgetCourses) : BUDGET_COURSES_DEFAUT,
      lignes: (mois.lignes || []).map(l => ({
        id: Number(l.id) || propre.prochainId++,
        type: TYPES.includes(l.type) ? l.type : 'depense',
        nature: NATURES.includes(l.nature) ? l.nature : 'variable',
        categorie: String(l.categorie || ''),
        libelle: String(l.libelle || ''),
        estime: eur(l.estime),
        reel: eur(l.reel),
        actif: l.actif === undefined ? true : !!l.actif,
        note: String(l.note || ''),
        lien: String(l.lien || ''),
        rang: Number(l.rang) || 0,
      })),
      semaines: (mois.semaines || []).map(s => ({
        numero: Number(s.numero) || 1,
        budget: eur(s.budget),
      })),
      achats: (mois.achats || []).map(a => ({
        id: Number(a.id) || propre.prochainId++,
        semaine: Number(a.semaine) || 1,
        poste: String(a.poste || ''),
        libelle: String(a.libelle || ''),
        montant: eur(a.montant),
        rang: Number(a.rang) || 0,
      })),
      creneaux: (mois.creneaux || []).map(c => ({
        id: Number(c.id) || propre.prochainId++,
        semaine: Number(c.semaine) || 1,
        jour: Number(c.jour) || 0,
        matinDebut: String(c.matinDebut || ''),
        matinFin: String(c.matinFin || ''),
        apremDebut: String(c.apremDebut || ''),
        apremFin: String(c.apremFin || ''),
      })),
    };
    if (!complet.semaines.length) {
      for (let n = 1; n <= SEMAINES_PAR_DEFAUT; n++) {
        complet.semaines.push({ numero: n, budget: BUDGET_SEMAINE_DEFAUT });
      }
    }
    assureCreneaux(complet, propre);
    propre.mois.push(complet);
  }
  if (!propre.mois.length) return null;
  // Les identifiants doivent rester uniques après import ou modification à la main.
  const maximum = Math.max(0, ...propre.mois.flatMap(m => [
    m.id, ...m.lignes.map(l => l.id), ...m.achats.map(a => a.id), ...m.creneaux.map(c => c.id),
  ]));
  propre.prochainId = Math.max(propre.prochainId, maximum + 1);
  if (!propre.mois.some(m => m.id === propre.moisActif)) {
    propre.moisActif = trieMois(propre.mois)[0].id;
  }
  return propre;
}

function trieMois(liste) {
  return liste.slice().sort((a, b) => b.libelle.localeCompare(a.libelle));
}

/** Crée les 7 jours de chaque semaine déclarée. */
function assureCreneaux(mois, conteneur) {
  const source = conteneur || D;
  for (const semaine of mois.semaines) {
    for (let jour = 0; jour < 7; jour++) {
      const existe = mois.creneaux.some(c => c.semaine === semaine.numero && c.jour === jour);
      if (existe) continue;
      mois.creneaux.push({
        id: source.prochainId++, semaine: semaine.numero, jour,
        matinDebut: '', matinFin: '', apremDebut: '', apremFin: '',
      });
    }
  }
  mois.creneaux.sort((a, b) => a.semaine - b.semaine || a.jour - b.jour);
}

/** Crée un mois, éventuellement en recopiant un mois existant. */
function creeMois(libelle, copierDe) {
  const existant = D.mois.find(m => m.libelle === libelle);
  if (existant) return existant;

  const source = copierDe ? D.mois.find(m => m.id === copierDe) : null;
  const mois = {
    id: D.prochainId++,
    libelle,
    note: '',
    tauxHoraire: source ? source.tauxHoraire : TAUX_HORAIRE_DEFAUT,
    tauxCotisation: source ? source.tauxCotisation : TAUX_COTISATION_DEFAUT,
    budgetCourses: source ? source.budgetCourses : BUDGET_COURSES_DEFAUT,
    // Les lignes récurrentes sont reprises, les montants réels remis à zéro.
    lignes: source
      ? source.lignes.map(l => Object.assign({}, l, { id: D.prochainId++, reel: 0 }))
      : [],
    semaines: source
      ? source.semaines.map(s => ({ numero: s.numero, budget: s.budget }))
      : Array.from({ length: SEMAINES_PAR_DEFAUT },
                   (_, i) => ({ numero: i + 1, budget: BUDGET_SEMAINE_DEFAUT })),
    achats: [],
    creneaux: [],
  };
  assureCreneaux(mois);
  D.mois.push(mois);
  return mois;
}

/** Premier démarrage : un mois pré-rempli avec les données du tableau. */
function donneesDeDepart() {
  D = { version: VERSION_DONNEES, prochainId: 1, moisActif: null, mois: [] };
  const mois = creeMois(moisCourantLibelle());
  let rang = 0;

  for (const [nature, categorie, libelle, estime, reel, actif, note, lien] of DEPENSES_INITIALES) {
    mois.lignes.push({
      id: D.prochainId++, type: 'depense', nature, categorie, libelle,
      estime: eur(estime), reel: eur(reel), actif: !!actif, note, lien, rang: (rang += 10),
    });
  }
  for (const [type, nature, categorie, libelle, estime, reel, lien] of REVENUS_INITIAUX) {
    mois.lignes.push({
      id: D.prochainId++, type, nature, categorie, libelle,
      estime: eur(estime), reel: eur(reel), actif: true, note: '', lien, rang: (rang += 10),
    });
  }
  for (const [semaine, jour, matinDebut, matinFin, apremDebut, apremFin] of CRENEAUX_INITIAUX) {
    const creneau = mois.creneaux.find(c => c.semaine === semaine && c.jour === jour);
    if (creneau) Object.assign(creneau, { matinDebut, matinFin, apremDebut, apremFin });
  }

  D.moisActif = mois.id;
  return D;
}

/* ========================================================================== */
/* 4. Modifications des données                                               */
/* ========================================================================== */

function moisActif() {
  return D.mois.find(m => m.id === D.moisActif) || trieMois(D.mois)[0];
}

/** Toute modification passe par ici : on enregistre puis on redessine. */
function applique(message) {
  const enregistre = enregistreDonnees();
  dessineTout();
  if (message && enregistre) signaleSauvegarde(message);
}

function prochainRang(collection) {
  return collection.reduce((maxi, e) => Math.max(maxi, Number(e.rang) || 0), 0) + 10;
}

function majMois(champ, valeur) {
  const mois = moisActif();
  if (champ === 'note') mois.note = String(valeur || '');
  else mois[champ] = nombre(valeur);
  applique('Enregistré');
}

function creeLigne(champs) {
  const mois = moisActif();
  const ligne = {
    id: D.prochainId++,
    type: TYPES.includes(champs.type) ? champs.type : 'depense',
    nature: NATURES.includes(champs.nature) ? champs.nature : 'variable',
    categorie: String(champs.categorie || '').trim(),
    libelle: String(champs.libelle || '').trim(),
    estime: nombre(champs.estime),
    reel: nombre(champs.reel),
    actif: champs.actif === undefined ? true : !!champs.actif,
    note: String(champs.note || ''),
    lien: String(champs.lien || '').trim(),
    rang: Number(champs.rang) || prochainRang(mois.lignes),
  };
  mois.lignes.push(ligne);
  return ligne;
}

function majLigne(id, champ, valeur) {
  const ligne = moisActif().lignes.find(l => l.id === id);
  if (!ligne) return;
  if (champ === 'estime' || champ === 'reel') ligne[champ] = nombre(valeur);
  else if (champ === 'actif') ligne.actif = !!valeur;
  else if (champ === 'type') ligne.type = TYPES.includes(valeur) ? valeur : 'depense';
  else if (champ === 'nature') ligne.nature = NATURES.includes(valeur) ? valeur : 'variable';
  else if (champ === 'note') ligne.note = String(valeur || '');
  else ligne[champ] = String(valeur || '').trim();
  applique('Enregistré');
}

function supprimeLigne(id) {
  const mois = moisActif();
  const index = mois.lignes.findIndex(l => l.id === id);
  if (index < 0) return null;
  return mois.lignes.splice(index, 1)[0];
}

function creeAchat(champs) {
  const mois = moisActif();
  const achat = {
    id: D.prochainId++,
    semaine: Math.max(1, Number(champs.semaine) || 1),
    poste: String(champs.poste || '').trim(),
    libelle: String(champs.libelle || '').trim(),
    montant: nombre(champs.montant),
    rang: Number(champs.rang) || prochainRang(mois.achats),
  };
  mois.achats.push(achat);
  return achat;
}

function majAchat(id, champ, valeur) {
  const achat = moisActif().achats.find(a => a.id === id);
  if (!achat) return;
  if (champ === 'montant') achat.montant = nombre(valeur);
  else if (champ === 'semaine') achat.semaine = Math.max(1, Number(valeur) || 1);
  else achat[champ] = String(valeur || '').trim();
  applique('Enregistré');
}

function supprimeAchat(id) {
  const mois = moisActif();
  const index = mois.achats.findIndex(a => a.id === id);
  if (index < 0) return null;
  return mois.achats.splice(index, 1)[0];
}

function majCreneau(id, champ, valeur) {
  const creneau = moisActif().creneaux.find(c => c.id === id);
  if (!creneau) return;
  const minutes = minutesDepuisHeure(valeur);
  creneau[champ] = minutes === null ? '' : heureDepuisMinutes(minutes);
  applique('Enregistré');
}

function majSemaine(numero, budget) {
  const semaine = moisActif().semaines.find(s => s.numero === numero);
  if (semaine) semaine.budget = nombre(budget);
  applique('Enregistré');
}

function ajouteSemaine() {
  const mois = moisActif();
  const numero = mois.semaines.reduce((maxi, s) => Math.max(maxi, s.numero), 0) + 1;
  mois.semaines.push({ numero, budget: BUDGET_SEMAINE_DEFAUT });
  assureCreneaux(mois);
  applique('Semaine ajoutée');
}

function retireSemaine(numero) {
  const mois = moisActif();
  if (mois.semaines.length <= 1) {
    toast('Il faut garder au moins une semaine.', { erreur: true });
    return;
  }
  mois.semaines = mois.semaines.filter(s => s.numero !== numero);
  mois.achats = mois.achats.filter(a => a.semaine !== numero);
  mois.creneaux = mois.creneaux.filter(c => c.semaine !== numero);
  applique('Semaine supprimée');
}

/** Recopie un total calculé dans la ligne de budget qui lui correspond. */
function reporte(cible) {
  const mois = moisActif();
  const totaux = recap(mois);
  const montant = cible === 'courses' ? totaux.courses.depense : totaux.heures.net;
  const ligne = mois.lignes.find(l => (l.lien || '') === cible);
  if (!ligne) {
    toast('Aucune ligne n’est reliée à ce total. Choisissez le lien « ' +
          (cible === 'courses' ? 'Courses' : 'Heures gardées') +
          ' » sur la ligne concernée (colonne Lien de l’onglet Revenus, ou la note de la dépense).',
          { erreur: true, duree: 12000 });
    return;
  }
  ligne.reel = montant;
  applique();
  toast(cible === 'courses'
    ? 'Total des courses reporté sur « ' + (ligne.libelle || 'la ligne reliée') + ' ».'
    : 'Salaire net reporté sur « ' + (ligne.libelle || 'la ligne reliée') + ' ».');
}

/* ========================================================================== */
/* 5. Affichage                                                               */
/* ========================================================================== */

const $  = (sel, racine = document) => racine.querySelector(sel);
const $$ = (sel, racine = document) => Array.from(racine.querySelectorAll(sel));

const etat = {
  detail: null,
  vue: 'tableau',
  filtreNature: 'tout',
  filtreRevenu: 'tout',
  recherche: '',
  masquerPause: false,
};

function el(balise, attributs = {}, ...enfants) {
  const noeud = document.createElement(balise);
  for (const [nom, valeur] of Object.entries(attributs)) {
    if (valeur === null || valeur === undefined || valeur === false) continue;
    if (nom === 'class') noeud.className = valeur;
    else if (nom === 'texte') noeud.textContent = valeur;
    else if (nom.startsWith('on')) noeud.addEventListener(nom.slice(2), valeur);
    else noeud.setAttribute(nom, valeur === true ? '' : valeur);
  }
  for (const enfant of enfants.flat()) {
    if (enfant === null || enfant === undefined || enfant === false) continue;
    noeud.append(enfant.nodeType ? enfant : document.createTextNode(String(enfant)));
  }
  return noeud;
}

const formatEuros = new Intl.NumberFormat('fr-FR',
  { style: 'currency', currency: 'EUR', maximumFractionDigits: 2 });
const formatNombre = new Intl.NumberFormat('fr-FR',
  { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const euros = (v) => formatEuros.format(Number(v) || 0);
const signe = (v) => (Number(v) > 0 ? '+' : '') + euros(v);

/** Montant tel qu'on le saisit : « 19,99 », et rien du tout si c'est zéro. */
function montantSaisi(valeur) {
  const n = Number(valeur) || 0;
  return n === 0 ? '' : formatNombre.format(n).replace(/[  ]/g, ' ');
}

function libelleMois(code) {
  const [annee, mois] = String(code).split('-').map(Number);
  if (!annee || !mois) return code;
  const nom = new Date(annee, mois - 1, 1)
    .toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
  return nom.charAt(0).toUpperCase() + nom.slice(1);
}

function decaleMois(code, pas) {
  const [annee, mois] = String(code).split('-').map(Number);
  const d = new Date(annee, mois - 1 + pas, 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

let minuteurSauvegarde = null;
function signaleSauvegarde(texte = 'Enregistré') {
  const zone = $('#sauvegarde');
  zone.textContent = texte;
  zone.classList.add('visible');
  clearTimeout(minuteurSauvegarde);
  minuteurSauvegarde = setTimeout(() => zone.classList.remove('visible'), 1400);
}

function toast(texte, options = {}) {
  const boite = el('div', { class: 'toast' + (options.erreur ? ' toast--erreur' : '') },
    el('span', { class: 'toast__texte', texte }));
  if (options.action) {
    boite.append(el('button', {
      class: 'bouton', texte: options.action.libelle,
      onclick: () => { boite.remove(); options.action.faire(); },
    }));
  }
  boite.append(el('button', {
    class: 'bouton bouton--fantome', title: 'Fermer', texte: '✕',
    onclick: () => boite.remove(),
  }));
  $('#toasts').append(boite);
  setTimeout(() => boite.remove(), options.duree || 7000);
}

function montreAlerteStockage(detail) {
  if ($('#alerte-stockage')) return;
  document.body.prepend(el('p', { class: 'alerte', id: 'alerte-stockage' },
    el('strong', { texte: 'Enregistrement automatique indisponible. ' }),
    (detail ? detail + ' ' : '') +
    'Vos modifications restent affichées mais seront perdues à la fermeture de l’onglet. ' +
    'Utilisez le menu ⋯ → « Sauvegarder tout » pour conserver un fichier.'));
}

/* -- Focus conservé pendant le redessin ---------------------------------- */

function memoriseFocus() {
  const actif = document.activeElement;
  if (!actif || !actif.dataset || !actif.dataset.cle) return null;
  return {
    cle: actif.dataset.cle,
    debut: typeof actif.selectionStart === 'number' ? actif.selectionStart : null,
  };
}

function restaureFocus(memoire) {
  if (!memoire) return;
  const champ = document.querySelector('[data-cle="' + CSS.escape(memoire.cle) + '"]');
  if (!champ) return;
  champ.focus();
  if (memoire.debut !== null && typeof champ.setSelectionRange === 'function') {
    const position = Math.min(memoire.debut, champ.value.length);
    try { champ.setSelectionRange(position, position); } catch (e) { /* champ non textuel */ }
  }
}

/* -- Rendu général -------------------------------------------------------- */

function dessineTout() {
  const memoire = memoriseFocus();
  const mois = moisActif();
  etat.detail = {
    mois,
    lignes: mois.lignes,
    semaines: mois.semaines.slice().sort((a, b) => a.numero - b.numero),
    achats: mois.achats,
    creneaux: mois.creneaux.map(c => {
      const minutes = dureeCreneau(c);
      return Object.assign({}, c, { minutes, duree: minutes ? formatDuree(minutes) : '' });
    }),
    recap: recap(mois),
    moisDisponibles: trieMois(D.mois),
  };
  dessineSelecteurMois();
  dessineTableauDeBord();
  dessineDepenses();
  dessineRevenus();
  dessineCourses();
  dessineHeures();
  restaureFocus(memoire);
}

function dessineSelecteurMois() {
  const choix = $('#choix-mois');
  choix.textContent = '';
  for (const mois of etat.detail.moisDisponibles) {
    choix.append(el('option', { value: mois.id, selected: mois.id === D.moisActif },
      libelleMois(mois.libelle)));
  }
}

function montreVue(nom) {
  if (!VUES.includes(nom)) nom = 'tableau';
  etat.vue = nom;
  for (const onglet of $$('.onglet')) {
    onglet.setAttribute('aria-selected', String(onglet.dataset.vue === nom));
  }
  for (const vue of $$('.vue')) vue.hidden = vue.id !== 'vue-' + nom;
  if (nom === 'tableau') dessineGraphiqueCategories();
  if (location.hash.slice(1) !== nom) history.replaceState(null, '', '#' + nom);
  try { localStorage.setItem('comptes.vue', nom); } catch (e) { /* ignoré */ }
}

/* -- Tableau de bord ------------------------------------------------------ */

function tuile(etiquette, valeur, note, classeNote) {
  return el('div', { class: 'tuile' },
    el('div', { class: 'tuile__etiquette', texte: etiquette }),
    el('div', { class: 'tuile__valeur', texte: valeur }),
    note ? el('div', { class: 'tuile__delta ' + (classeNote || ''), texte: note }) : null);
}

function dessineTableauDeBord() {
  const { budget, courses, heures } = etat.detail.recap;
  const restant = budget.restant.reel;

  $('#heros').replaceChildren(
    el('div', { class: 'heros__bloc' },
      el('div', { class: 'heros__etiquette', texte: 'Restant à vivre ce mois' }),
      el('div', {
        class: 'heros__valeur' + (restant < 0 ? ' heros__valeur--negatif' : ''),
        texte: euros(restant),
      }),
      el('div', {
        class: 'heros__note',
        texte: 'Prévu : ' + euros(budget.restant.estime) + ' · ' +
               (restant < 0 ? 'Découvert' : 'Disponible') +
               ' au regard des montants réels saisis',
      })));

  const surplus = budget.surplus.reel;
  $('#tuiles').replaceChildren(
    tuile('Revenus encaissés', euros(budget.revenus.reel),
          'Prévu ' + euros(budget.revenus.estime)),
    tuile('Dépenses réglées', euros(budget.depenses.reel),
          'Prévu ' + euros(budget.depenses.estime)),
    tuile('Écart sur les dépenses', signe(surplus),
          surplus >= 0 ? 'Sous le budget prévu' : 'Au-dessus du budget prévu',
          surplus >= 0 ? 'tuile__delta--bon' : 'tuile__delta--mauvais'),
    tuile('Charges fixes', euros(budget.depensesFixes.reel),
          'Variables ' + euros(budget.depensesVariables.reel)),
    tuile('Coût net de la garde', euros(budget.gardeNette.reel),
          'Garde ' + euros(budget.garde.reel) + ' − CAF ' + euros(budget.caf.reel)));

  dessineGraphiqueCategories();
  dessineTableauCategories();

  $('#carte-courses-resume').replaceChildren(
    el('header', { class: 'carte__entete' },
      el('h2', { texte: 'Budget courses' }),
      el('p', { class: 'carte__sous-titre',
                texte: euros(courses.depense) + ' dépensés sur ' + euros(courses.budgetTotal) })),
    jauge('Consommé', courses.depense, courses.budgetTotal),
    el('div', { class: 'pied-tableau' },
      el('button', { class: 'bouton bouton--fantome', texte: 'Détailler les courses →',
                     onclick: () => montreVue('courses') })));

  $('#carte-heures-resume').replaceChildren(

/* -- Graphique ------------------------------------------------------------ */

/** Échelle terminant sur un chiffre rond, avec des graduations lisibles. */
function graduationsJolies(maxi, cible = 4) {
  if (!(maxi > 0)) return { haut: 100, valeurs: [0, 25, 50, 75, 100] };
  const brut = maxi / cible;
  const puissance = Math.pow(10, Math.floor(Math.log10(brut)));
  const pas = [1, 2, 2.5, 5, 10].map(m => m * puissance).find(p => p >= brut) || 10 * puissance;
  const haut = Math.ceil(maxi / pas) * pas;
  const valeurs = [];
  for (let v = 0; v <= haut + 1e-9; v += pas) valeurs.push(Math.round(v * 100) / 100);
  return { haut, valeurs };
}

/** Barre horizontale : bout arrondi côté valeur, carré sur la ligne de base. */
function cheminBarre(x0, y, longueur, hauteur, rayon) {
  const r = Math.min(rayon, longueur, hauteur / 2);
  if (longueur <= r) return 'M' + x0 + ',' + y + ' h' + longueur + ' v' + hauteur +
                             ' h' + (-longueur) + ' z';
  return 'M' + x0 + ',' + y + ' h' + (longueur - r) + ' a' + r + ',' + r + ' 0 0 1 ' + r + ',' + r +
         ' v' + (hauteur - 2 * r) + ' a' + r + ',' + r + ' 0 0 1 ' + (-r) + ',' + r +
         ' h' + (-(longueur - r)) + ' z';
}

function svg(balise, attributs = {}, ...enfants) {
  const noeud = document.createElementNS('http://www.w3.org/2000/svg', balise);
  for (const [nom, valeur] of Object.entries(attributs)) {
    if (valeur === null || valeur === undefined || valeur === false) continue;
    noeud.setAttribute(nom, valeur === true ? '' : String(valeur));
  }
  for (const enfant of enfants.flat()) {
    if (enfant === null || enfant === undefined || enfant === false) continue;
    noeud.append(enfant.nodeType ? enfant : document.createTextNode(String(enfant)));
  }
  return noeud;
}

function tronque(texte, largeurDisponible) {
  const maxi = Math.max(6, Math.floor(largeurDisponible / 6.6));
  return texte.length > maxi ? texte.slice(0, maxi - 1) + '…' : texte;
}

function dessineGraphiqueCategories() {
  const hote = $('#graphique-categories');
  if (!hote || !etat.detail) return;
  const donnees = etat.detail.recap.budget.parCategorie.filter(c => c.reel > 0 || c.estime > 0);

  hote.textContent = '';
  if (!donnees.length) {
    hote.append(el('p', { class: 'vide', texte: 'Aucune dépense saisie pour ce mois.' }));
    return;
  }

  hote.append(el('div', { class: 'legende' },
    el('span', { class: 'legende__cle' }, el('span', { class: 'legende__pastille' }), 'Dépensé'),
    el('span', { class: 'legende__cle' }, el('span', { class: 'legende__trait' }), 'Prévu')));

  const largeur = Math.max(300, hote.clientWidth || 520);
  const gauche = Math.min(150, Math.max(88, Math.round(largeur * 0.3)));
  const droite = 96;
  const hautBande = 30, epaisseur = 18, hautPlot = 10, basAxe = 28;
  const hauteurTrace = donnees.length * hautBande;
  const hauteur = hautPlot + hauteurTrace + basAxe;
  const echelle = graduationsJolies(Math.max(...donnees.map(d => Math.max(d.reel, d.estime))));
  const largeurUtile = largeur - gauche - droite;
  const x = (v) => gauche + (Math.max(0, v) / echelle.haut) * largeurUtile;

  const racine = svg('svg', {
    viewBox: '0 0 ' + largeur + ' ' + hauteur, width: largeur, height: hauteur,
    role: 'img', 'aria-label': 'Dépenses réelles et prévues par catégorie',
  });

  // Grille : filets pleins, jamais en pointillés.
  for (const valeur of echelle.valeurs) {
    racine.append(svg('line', {
      x1: x(valeur), x2: x(valeur), y1: hautPlot, y2: hautPlot + hauteurTrace,
      stroke: valeur === 0 ? 'var(--ligne-base)' : 'var(--filet)', 'stroke-width': 1,
    }));
    racine.append(svg('text', {
      x: x(valeur), y: hautPlot + hauteurTrace + 17, 'text-anchor': 'middle',
      fill: 'var(--encre-3)', 'font-size': 11, 'font-family': 'inherit',
    }, formatEuros.format(valeur).replace(/,00/, '')));
  }

  donnees.forEach((categorie, index) => {
    const y = hautPlot + index * hautBande;
    const yBarre = y + (hautBande - epaisseur) / 2;
    const ecart = categorie.estime - categorie.reel;
    const groupe = svg('g', {
      tabindex: 0, role: 'group',
      'aria-label': categorie.categorie + ' : ' + euros(categorie.reel) + ' dépensés, ' +
                    euros(categorie.estime) + ' prévus',
    });

    groupe.append(svg('text', {
      x: gauche - 10, y: y + hautBande / 2 + 4, 'text-anchor': 'end',
      fill: 'var(--encre-2)', 'font-size': 12, 'font-family': 'inherit',
    }, tronque(categorie.categorie, gauche - 14)));

    if (categorie.reel > 0) {
      groupe.append(svg('path', {
        d: cheminBarre(gauche, yBarre, Math.max(2, x(categorie.reel) - gauche), epaisseur, 4),
        fill: 'var(--serie-1)',
      }));
      // Valeur posée après la marque la plus à droite : elle ne croise jamais le repère.
      groupe.append(svg('text', {
        x: Math.max(x(categorie.reel), x(categorie.estime)) + 10,
        y: y + hautBande / 2 + 4, 'text-anchor': 'start',
        fill: 'var(--encre-2)', 'font-size': 11.5, 'font-family': 'inherit',
      }, euros(categorie.reel).replace(/,00/, '')));
    }

    if (categorie.estime > 0) {
      // Repère du prévu : un trait, jamais une seconde barre.
      groupe.append(svg('line', {
        x1: x(categorie.estime), x2: x(categorie.estime),
        y1: yBarre - 3, y2: yBarre + epaisseur + 3,
        stroke: 'var(--encre-2)', 'stroke-width': 2, 'stroke-linecap': 'round',
      }));
    }

    // Cible de survol : toute la bande, bien plus large que la marque.
    groupe.append(svg('rect', { x: 0, y, width: largeur, height: hautBande, fill: 'transparent' }));

    const montre = (evenement) => montreInfobulle(evenement, categorie, ecart);
    groupe.addEventListener('pointerenter', montre);
    groupe.addEventListener('pointermove', montre);
    groupe.addEventListener('focus', () => montreInfobulle(null, categorie, ecart, groupe));
    groupe.addEventListener('pointerleave', cacheInfobulle);
    groupe.addEventListener('blur', cacheInfobulle);
    racine.append(groupe);
  });

  hote.append(racine);
}

function ligneInfobulle(nom, valeur, couleur) {
  return el('div', { class: 'infobulle__ligne' },
    el('span', { class: 'infobulle__nom' },
      couleur ? el('span', { class: 'legende__pastille', style: 'background:' + couleur })
              : el('span', { class: 'legende__trait' }),
      nom),
    el('span', { class: 'infobulle__valeur', texte: valeur }));
}

function montreInfobulle(evenement, categorie, ecart, ancre) {
  const boite = $('#infobulle');
  boite.replaceChildren(
    el('div', { class: 'infobulle__titre', texte: categorie.categorie }),
    ligneInfobulle('Dépensé', euros(categorie.reel), 'var(--serie-1)'),
    ligneInfobulle('Prévu', euros(categorie.estime), null),
    ligneInfobulle(ecart >= 0 ? 'Reste' : 'Dépassement', euros(Math.abs(ecart)), null));
  boite.hidden = false;
  const rect = ancre ? ancre.getBoundingClientRect() : null;
  const gauche = evenement ? evenement.clientX + 14 : rect.left + 20;
  const haut = evenement ? evenement.clientY + 14 : rect.top;
  boite.style.left = Math.min(gauche, window.innerWidth - boite.offsetWidth - 12) + 'px';
  boite.style.top = Math.min(haut, window.innerHeight - boite.offsetHeight - 12) + 'px';
}

function cacheInfobulle() { $('#infobulle').hidden = true; }

function dessineTableauCategories() {
  const donnees = etat.detail.recap.budget.parCategorie;
  $('#tableau-categories').replaceChildren(
    el('table', {},
      el('thead', {}, el('tr', {},
        el('th', { texte: 'Catégorie' }), el('th', { texte: 'Prévu' }),
        el('th', { texte: 'Dépensé' }), el('th', { texte: 'Écart' }))),
      el('tbody', {}, donnees.map(c => el('tr', {},
        el('td', { texte: c.categorie }),
        el('td', { texte: euros(c.estime) }),
        el('td', { texte: euros(c.reel) }),
        el('td', { texte: signe(c.estime - c.reel) }))))));
}

function jauge(nom, valeur, budget) {
  const part = budget > 0 ? valeur / budget : 0;
  const pourcent = Math.min(100, Math.max(0, part * 100));
  let modificateur = '', icone = '✓', message = 'Dans le budget';
  if (part > 1) { modificateur = '--critique'; icone = '✕'; message = 'Budget dépassé'; }
  else if (part >= 0.85) { modificateur = '--alerte'; icone = '⚠'; message = 'Budget presque atteint'; }

  return el('div', { class: 'jauge' },
    el('div', { class: 'jauge__entete' },
      el('span', { class: 'jauge__nom', texte: nom }),
      el('span', { class: 'jauge__chiffres', texte: euros(valeur) + ' / ' + euros(budget) })),
    el('div', {
      class: 'jauge__piste', role: 'meter', 'aria-valuenow': Math.round(valeur),
      'aria-valuemin': '0', 'aria-valuemax': Math.round(budget) || 0,
      'aria-label': nom + ' : ' + euros(valeur) + ' sur ' + euros(budget),
    }, el('div', { class: 'jauge__remplissage jauge__remplissage' + modificateur,
                   style: 'width:' + pourcent + '%' })),
    el('div', { class: 'jauge__etat jauge__etat' + modificateur,
                texte: icone + ' ' + message + ' · reste ' + euros(budget - valeur) }));
}

/* -- Tableaux modifiables ------------------------------------------------- */

function champTexte(entite, id, champ, valeur, options = {}) {
  return el('input', {
    type: 'text', value: valeur === null || valeur === undefined ? '' : valeur,
    class: options.classe || null,
    placeholder: options.placeholder || null,
    list: options.liste || null,
    inputmode: options.inputmode || null,
    'aria-label': options.etiquette || champ,
    'data-cle': entite + '-' + id + '-' + champ,
    'data-entite': entite, 'data-id': id, 'data-champ': champ,
  });
}

function champMontant(entite, id, champ, valeur, etiquette) {
  return champTexte(entite, id, champ, montantSaisi(valeur),
    { classe: 'montant', inputmode: 'decimal', placeholder: '0,00', etiquette });
}

function selecteur(entite, id, champ, valeur, choix, etiquette) {
  return el('select', {
    'data-cle': entite + '-' + id + '-' + champ, 'aria-label': etiquette || champ,
    'data-entite': entite, 'data-id': id, 'data-champ': champ,
  }, choix.map(([cle, libelle]) =>
    el('option', { value: cle, selected: String(cle) === String(valeur || '') }, libelle)));
}

function celluleEcart(ligne) {
  const estime = ligne.actif ? Number(ligne.estime) : 0;
  const ecart = estime - Number(ligne.reel);
  const classe = ecart > 0.004 ? 'ecart--bon' : (ecart < -0.004 ? 'ecart--mauvais' : '');
  return el('span', { class: 'ecart ' + classe, texte: ecart === 0 ? '—' : signe(ecart) });
}

function listeCategories(pourDepenses) {
  const vues = new Set(etat.detail.lignes
    .filter(l => (pourDepenses ? l.type === 'depense' : l.type !== 'depense'))
    .map(l => l.categorie).filter(Boolean));
  return Array.from(vues).sort((a, b) => a.localeCompare(b, 'fr'));
}

function boutonSupprimer(entite, id, description) {
  return el('button', {
    class: 'bouton bouton--fantome', texte: '✕',
    title: 'Supprimer ' + description, 'aria-label': 'Supprimer ' + description,
    'data-supprimer': entite, 'data-id': id,
  });
}

function ligneTableau(ligne, colonnes) {
  const tr = el('tr', { class: ligne.actif ? '' : 'en-pause', 'data-ligne': ligne.id });
  for (const colonne of colonnes) tr.append(colonne(ligne));
  return tr;
}

/* -- Dépenses ------------------------------------------------------------- */

function dessineDepenses() {
  const recherche = etat.recherche.trim().toLowerCase();
  const lignes = etat.detail.lignes.filter(l =>
    l.type === 'depense'
    && (etat.filtreNature === 'tout' || l.nature === etat.filtreNature)
    && (!etat.masquerPause || l.actif)
    && (!recherche || l.libelle.toLowerCase().includes(recherche)
                   || l.categorie.toLowerCase().includes(recherche)));

  const hote = $('#table-depenses');
  hote.textContent = '';
  $('#recherche-depenses').value = etat.recherche;
  $('#masquer-pause').checked = etat.masquerPause;

  if (!lignes.length) {
    hote.append(el('div', { class: 'vide' },
      etat.detail.lignes.some(l => l.type === 'depense')
        ? 'Aucune dépense ne correspond à ce filtre.'
        : 'Aucune dépense pour l’instant. Utilisez « + Ajouter une dépense ».'));
    return;
  }

  hote.append(el('datalist', { id: 'categories-depenses' },
    listeCategories(true).map(c => el('option', { value: c }))));

  const groupes = new Map();
  for (const ligne of lignes) {
    const cle = ligne.categorie || 'Sans catégorie';
    if (!groupes.has(cle)) groupes.set(cle, []);
    groupes.get(cle).push(ligne);
  }

  for (const [categorie, membres] of groupes) {
    const totalPrevu = membres.reduce((s, l) => s + (l.actif ? Number(l.estime) : 0), 0);
    const totalReel = membres.reduce((s, l) => s + Number(l.reel), 0);

    hote.append(el('section', { class: 'groupe' },
      el('header', { class: 'groupe__entete' },
        el('span', { class: 'groupe__nom', texte: categorie }),
        el('span', { class: 'groupe__total',
                     texte: euros(totalReel) + ' dépensés · ' + euros(totalPrevu) + ' prévus' }),
        el('span', { class: 'pousse' }),
        el('button', { class: 'bouton bouton--fantome', texte: '+ Ligne',
                       'data-ajouter': 'depense', 'data-categorie': categorie })),
      el('table', { class: 'lignes' },
        el('thead', {}, el('tr', {},
          el('th', { texte: 'Actif' }), el('th', { texte: 'Libellé' }),
          el('th', { texte: 'Catégorie' }), el('th', { texte: 'Nature' }),
          el('th', { class: 'col-nombre', texte: 'Prévu' }),
          el('th', { class: 'col-nombre', texte: 'Réel' }),
          el('th', { class: 'col-nombre', texte: 'Écart' }),
          el('th', { texte: 'Note' }), el('th', { texte: '' }))),
        el('tbody', {}, membres.map(ligne => ligneTableau(ligne, [
          l => el('td', { class: 'col-actif', 'data-etiquette': 'Actif' },
            el('input', {
              type: 'checkbox', class: 'bascule', checked: !!l.actif,
              title: l.actif ? 'Compté dans les totaux' : 'En pause : non compté',
              'aria-label': 'Compter « ' + l.libelle + ' » dans les totaux',
              'data-cle': 'ligne-' + l.id + '-actif',
              'data-entite': 'ligne', 'data-id': l.id, 'data-champ': 'actif',
            })),
          l => el('td', { class: 'col-libelle', 'data-etiquette': 'Libellé' },
            champTexte('ligne', l.id, 'libelle', l.libelle,
              { placeholder: 'Nom de la dépense', etiquette: 'Libellé' })),
          l => el('td', { 'data-etiquette': 'Catégorie' },
            champTexte('ligne', l.id, 'categorie', l.categorie,
              { liste: 'categories-depenses', placeholder: 'Catégorie', etiquette: 'Catégorie' })),
          l => el('td', { 'data-etiquette': 'Nature' },
            selecteur('ligne', l.id, 'nature', l.nature,
              [['fixe', 'Fixe'], ['variable', 'Variable']], 'Nature')),
          l => el('td', { class: 'col-nombre', 'data-etiquette': 'Prévu' },
            champMontant('ligne', l.id, 'estime', l.estime, 'Montant prévu')),
          l => el('td', { class: 'col-nombre', 'data-etiquette': 'Réel' },
            champMontant('ligne', l.id, 'reel', l.reel, 'Montant réel')),
          l => el('td', { class: 'col-nombre', 'data-etiquette': 'Écart' }, celluleEcart(l)),
          l => el('td', { 'data-etiquette': 'Note' },
            champTexte('ligne', l.id, 'note', l.note, { placeholder: '—', etiquette: 'Note' })),
          l => el('td', { class: 'col-suppr' },
            boutonSupprimer('ligne', l.id, 'la dépense ' + (l.libelle || 'sans nom'))),
        ]))))));
  }
}

        el('span', { class: 'pousse' }),

      el('table', { class: 'lignes' },
        el('thead', {}, el('tr', {},

          el('th', { texte: 'Nature' }),
          el('th', { class: 'col-nombre', texte: 'Prévu' }),
          el('th', { class: 'col-nombre', texte: 'Réel' }),
          el('th', { class: 'col-nombre', texte: 'Écart' }),
          el('th', { texte: 'Lien' }), el('th', { texte: '' }))),
        el('tbody', {}, membres.map(ligne => ligneTableau(ligne, [

            champTexte('ligne', l.id, 'libelle', l.libelle,
              { placeholder: 'Source du revenu', etiquette: 'Libellé' })),
          l => el('td', { 'data-etiquette': 'Type' },
            selecteur('ligne', l.id, 'type', l.type,

          l => el('td', { 'data-etiquette': 'Nature' },

          l => el('td', { class: 'col-nombre', 'data-etiquette': 'Prévu' },
            champMontant('ligne', l.id, 'estime', l.estime, 'Montant prévu')),
          l => el('td', { class: 'col-nombre', 'data-etiquette': 'Réel' },
            champMontant('ligne', l.id, 'reel', l.reel, 'Montant réel')),

          l => el('td', { 'data-etiquette': 'Lien' },

          l => el('td', { class: 'col-suppr' },
            boutonSupprimer('ligne', l.id, 'le revenu ' + (l.libelle || 'sans nom'))),
        ]))))));

function celluleHeure(creneau, champ, etiquette, separateur) {
  return el('td', { class: separateur ? 'separateur' : null, 'data-etiquette': etiquette },
    el('input', {
      type: 'text', inputmode: 'numeric', value: creneau[champ] || '', placeholder: '--:--',
      'aria-label': etiquette,
      'data-cle': 'creneau-' + creneau.id + '-' + champ,
      'data-entite': 'creneau', 'data-id': creneau.id, 'data-champ': champ,
    }));
}

function dessineHeures() {
  const { heures } = etat.detail.recap;
  $('#taux-horaire').value = montantSaisi(etat.detail.mois.tauxHoraire);
  $('#taux-cotisation').value = montantSaisi(etat.detail.mois.tauxCotisation);

  $('#resume-heures').replaceChildren(
    el('div', { class: 'resume-bandeau' },
      tuile('Heures gardées', heures.duree,
            heures.parSemaine.length + ' semaine(s) renseignée(s)'),
      tuile('Salaire brut', euros(heures.brut),
            heures.duree + ' × ' + formatNombre.format(heures.tauxHoraire) + ' €'),
      tuile('Cotisations', euros(heures.cotisation),
            formatNombre.format(heures.tauxCotisation) + ' % du brut'),
      tuile('Salaire net', euros(heures.net), 'Brut moins cotisations')));

  const parSemaine = new Map();
  for (const creneau of etat.detail.creneaux) {
    if (!parSemaine.has(creneau.semaine)) parSemaine.set(creneau.semaine, []);
    parSemaine.get(creneau.semaine).push(creneau);
  }

  const hote = $('#semaines-heures');
  hote.textContent = '';
  hote.classList.add('semaines--larges');

  for (const numero of Array.from(parSemaine.keys()).sort((a, b) => a - b)) {
    const creneaux = parSemaine.get(numero).sort((a, b) => a.jour - b.jour);
    const minutes = creneaux.reduce((s, c) => s + c.minutes, 0);

    hote.append(el('article', { class: 'carte' },
      el('header', { class: 'semaine__entete' },
        el('span', { class: 'semaine__titre', texte: 'Semaine ' + numero }),
        el('span', { class: 'pousse' }),
        el('span', { class: 'groupe__total', texte: minutes ? formatDuree(minutes) : '—' })),
      el('table', { class: 'lignes heures' },
        el('thead', {}, el('tr', {},
          el('th', { texte: 'Jour' }),
          el('th', { texte: 'Matin' }), el('th', { texte: '' }),
          el('th', { class: 'separateur', texte: 'Après-midi' }), el('th', { texte: '' }),
          el('th', { class: 'col-nombre', texte: 'Durée' }))),
        el('tbody', {}, creneaux.map(creneau => el('tr', {}, [
          el('td', { class: 'jour', texte: JOURS[creneau.jour] }),
          celluleHeure(creneau, 'matinDebut', JOURS[creneau.jour] + ' matin, début'),
          celluleHeure(creneau, 'matinFin', JOURS[creneau.jour] + ' matin, fin'),
          celluleHeure(creneau, 'apremDebut', JOURS[creneau.jour] + ' après-midi, début', true),
          celluleHeure(creneau, 'apremFin', JOURS[creneau.jour] + ' après-midi, fin'),
          el('td', { class: 'duree', texte: creneau.duree || '—' }),
        ]))))));
  }
}

document.addEventListener('change', (evenement) => {
  const cible = evenement.target;

  if (cible.id === 'choix-mois') {
    D.moisActif = Number(cible.value);
    applique();
    return;
  }
  if (cible.id === 'masquer-pause') { etat.masquerPause = cible.checked; dessineDepenses(); return; }
  if (cible.id === 'fichier-import') { importeFichier(cible.files[0]); return; }

  const champsMois = { 'budget-courses': 'budgetCourses', 'taux-horaire': 'tauxHoraire',
                       'taux-cotisation': 'tauxCotisation' };
  if (champsMois[cible.id]) { majMois(champsMois[cible.id], cible.value); return; }

  const { entite, id, champ } = cible.dataset;
  if (!entite || !champ) return;
  const valeur = cible.type === 'checkbox' ? cible.checked : cible.value;
  if (entite === 'ligne') majLigne(Number(id), champ, valeur);
  else if (entite === 'achat') majAchat(Number(id), champ, valeur);
  else if (entite === 'creneau') majCreneau(Number(id), champ, valeur);
  else if (entite === 'semaine') majSemaine(Number(id), valeur);
});

/* Retour immédiat sur l'écart pendant la frappe, avant l'enregistrement. */
document.addEventListener('input', (evenement) => {
  const cible = evenement.target;
  if (cible.dataset.entite !== 'ligne') return;
  if (cible.dataset.champ !== 'estime' && cible.dataset.champ !== 'reel') return;
  const tr = cible.closest('tr');
  const cellule = tr && tr.querySelector('.ecart');
  if (!cellule) return;
  const lit = (nom) => {
    const champ = tr.querySelector('[data-champ="' + nom + '"]');
    return nombre(champ ? champ.value : 0);
  };
  const bascule = tr.querySelector('[data-champ="actif"]');
  const ecart = (!bascule || bascule.checked ? lit('estime') : 0) - lit('reel');
  cellule.textContent = ecart === 0 ? '—' : signe(ecart);
  cellule.className = 'ecart ' +
    (ecart > 0.004 ? 'ecart--bon' : (ecart < -0.004 ? 'ecart--mauvais' : ''));
});

document.addEventListener('click', (evenement) => {
  const cible = evenement.target.closest('button, [data-vue]');
  if (!cible) {
    if (!evenement.target.closest('.menu')) {
      $$('.menu[open]').forEach(m => m.removeAttribute('open'));
    }
    return;
  }

  if (cible.dataset.vue) { montreVue(cible.dataset.vue); return; }

  if (cible.dataset.filtreNature) {
    etat.filtreNature = cible.dataset.filtreNature;
    $$('[data-filtre-nature]').forEach(b => b.classList.toggle('actif', b === cible));
    dessineDepenses();
    return;
  }
  if (cible.dataset.filtreRevenu) {
    etat.filtreRevenu = cible.dataset.filtreRevenu;
    $$('[data-filtre-revenu]').forEach(b => b.classList.toggle('actif', b === cible));
    dessineRevenus();
    return;
  }

  if (cible.dataset.ajouter) return ajouteLigne(cible);
  if (cible.dataset.ajouterAchat) return ajouteAchat(cible);
  if (cible.dataset.supprimer) return demandeSuppression(cible);
  if (cible.dataset.report) return reporte(cible.dataset.report);
  if (cible.dataset.action) return actionMenu(cible.dataset.action);

  if (cible.id === 'btn-nouveau-mois') return nouveauMois();
  if (cible.id === 'btn-mois-precedent') return changeMoisRelatif(-1);
  if (cible.id === 'btn-mois-suivant') return changeMoisRelatif(1);
  if (cible.id === 'btn-ajouter-semaine') return ajouteSemaine();
  if (cible.id === 'btn-retirer-semaine') {
    const semaines = etat.detail.semaines;
    const derniere = semaines[semaines.length - 1];
    if (!derniere) return;
    if (!confirm('Supprimer la semaine ' + derniere.numero +
                 ' et tout ce qu’elle contient ?')) return;
    return retireSemaine(derniere.numero);
  }
});
