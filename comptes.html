/* ========================================================== GRAPHIQUES === */

/** Échelle terminant sur un chiffre rond, avec des graduations lisibles. */
function graduationsJolies(maxi, cible = 4) {
  if (!(maxi > 0)) return { haut: 100, valeurs: [0, 25, 50, 75, 100] };
  const brut = maxi / cible;
  const puissance = Math.pow(10, Math.floor(Math.log10(brut)));
  const pas = [1, 2, 2.5, 5, 10].map(m => m * puissance).find(p => p >= brut) || 10 * puissance;
  const haut = Math.ceil(maxi / pas) * pas;
  const valeurs = [];
  for (let v = 0; v <= haut + 1e-9; v += pas) valeurs.push(Math.round(v * 100) / 100);
  return { haut, valeurs };
}

/** Barre horizontale : bout arrondi côté valeur, carré sur la ligne de base. */
function cheminBarre(x0, y, longueur, hauteur, rayon) {
  const r = Math.min(rayon, longueur, hauteur / 2);
  if (longueur <= r) return 'M' + x0 + ',' + y + ' h' + longueur + ' v' + hauteur +
                             ' h' + (-longueur) + ' z';
  return 'M' + x0 + ',' + y + ' h' + (longueur - r) + ' a' + r + ',' + r + ' 0 0 1 ' + r + ',' + r +
         ' v' + (hauteur - 2 * r) + ' a' + r + ',' + r + ' 0 0 1 ' + (-r) + ',' + r +
         ' h' + (-(longueur - r)) + ' z';
}

function svg(balise, attributs = {}, ...enfants) {
  const noeud = document.createElementNS('http://www.w3.org/2000/svg', balise);
  for (const [nom, valeur] of Object.entries(attributs)) {
    if (valeur === null || valeur === undefined || valeur === false) continue;
    noeud.setAttribute(nom, valeur === true ? '' : String(valeur));
  }
  for (const enfant of enfants.flat()) {
    if (enfant === null || enfant === undefined || enfant === false) continue;
    noeud.append(enfant.nodeType ? enfant : document.createTextNode(String(enfant)));
  }
  return noeud;
}

function tronque(texte, largeurDisponible) {
  const maxi = Math.max(6, Math.floor(largeurDisponible / 6.6));
  return texte.length > maxi ? texte.slice(0, maxi - 1) + '…' : texte;
}

function ligneInfobulle(nom, valeur, couleur) {
  return el('div', { class: 'infobulle__ligne' },
    el('span', { class: 'infobulle__nom' },
      couleur ? el('span', { class: 'legende__pastille', style: 'background:' + couleur })
              : el('span', { class: 'legende__trait' }),
      nom),
    el('span', { class: 'infobulle__valeur', texte: valeur }));
}

function placeInfobulle(evenement, ancre) {
  const boite = $('#infobulle');
  boite.hidden = false;
  const rect = ancre ? ancre.getBoundingClientRect() : null;
  const gauche = evenement ? evenement.clientX + 14 : rect.left + 20;
  const haut = evenement ? evenement.clientY + 14 : rect.top;
  boite.style.left = Math.min(gauche, window.innerWidth - boite.offsetWidth - 12) + 'px';
  boite.style.top = Math.min(haut, window.innerHeight - boite.offsetHeight - 12) + 'px';
}

function cacheInfobulle() { $('#infobulle').hidden = true; }

function dessineGraphiqueCategories() {
  const hote = $('#graphique-categories');
  if (!hote || !etat.recap) return;
  const donnees = etat.recap.budget.parCategorie.filter(c => c.reel > 0 || c.estime > 0);

  hote.textContent = '';
  if (!donnees.length) {
    hote.append(el('p', { class: 'vide', texte: 'Aucune dépense saisie pour ce mois.' }));
    return;
  }

  hote.append(el('div', { class: 'legende' },
    el('span', { class: 'legende__cle' }, el('span', { class: 'legende__pastille' }), 'Payé'),
    el('span', { class: 'legende__cle' }, el('span', { class: 'legende__trait' }), 'Prévu')));

  const largeur = Math.max(300, hote.clientWidth || 700);
  const gauche = Math.min(160, Math.max(88, Math.round(largeur * 0.24)));
  const droite = 96;
  const hautBande = 30, epaisseur = 18, hautPlot = 10, basAxe = 28;
  const hauteurTrace = donnees.length * hautBande;
  const hauteur = hautPlot + hauteurTrace + basAxe;
  const echelle = graduationsJolies(Math.max(...donnees.map(d => Math.max(d.reel, d.estime))));
  const largeurUtile = largeur - gauche - droite;
  const x = (v) => gauche + (Math.max(0, v) / echelle.haut) * largeurUtile;

  const racine = svg('svg', {
    viewBox: '0 0 ' + largeur + ' ' + hauteur, width: largeur, height: hauteur,
    role: 'img', 'aria-label': 'Dépenses réelles et prévues par catégorie',
  });

  for (const valeur of echelle.valeurs) {
    racine.append(svg('line', {
      x1: x(valeur), x2: x(valeur), y1: hautPlot, y2: hautPlot + hauteurTrace,
      stroke: valeur === 0 ? 'var(--ligne-base)' : 'var(--filet)', 'stroke-width': 1,
    }));
    racine.append(svg('text', {
      x: x(valeur), y: hautPlot + hauteurTrace + 17, 'text-anchor': 'middle',
      fill: 'var(--encre-3)', 'font-size': 11, 'font-family': 'inherit',
    }, formatEuros.format(valeur).replace(/,00/, '')));
  }

  donnees.forEach((categorie, index) => {
    const y = hautPlot + index * hautBande;
    const yBarre = y + (hautBande - epaisseur) / 2;
    const ecart = categorie.estime - categorie.reel;
    const groupe = svg('g', {
      tabindex: 0, role: 'group',
      'aria-label': categorie.categorie + ' : ' + euros(categorie.reel) + ' dépensés, ' +
                    euros(categorie.estime) + ' prévus',
    });

    groupe.append(svg('text', {
      x: gauche - 10, y: y + hautBande / 2 + 4, 'text-anchor': 'end',
      fill: 'var(--encre-2)', 'font-size': 12, 'font-family': 'inherit',
    }, tronque(categorie.categorie, gauche - 14)));

    if (categorie.reel > 0) {
      groupe.append(svg('path', {
        d: cheminBarre(gauche, yBarre, Math.max(2, x(categorie.reel) - gauche), epaisseur, 4),
        fill: 'var(--serie-1)',
      }));
      // Valeur posée après la marque la plus à droite : elle ne croise jamais le repère.
      groupe.append(svg('text', {
        x: Math.max(x(categorie.reel), x(categorie.estime)) + 10,
        y: y + hautBande / 2 + 4, 'text-anchor': 'start',
        fill: 'var(--encre-2)', 'font-size': 11.5, 'font-family': 'inherit',
      }, euros(categorie.reel).replace(/,00/, '')));
    }
    if (categorie.estime > 0) {
      groupe.append(svg('line', {
        x1: x(categorie.estime), x2: x(categorie.estime),
        y1: yBarre - 3, y2: yBarre + epaisseur + 3,
        stroke: 'var(--encre-2)', 'stroke-width': 2, 'stroke-linecap': 'round',
      }));
    }
    groupe.append(svg('rect', { x: 0, y, width: largeur, height: hautBande, fill: 'transparent' }));

    const montre = (evenement) => {
      remplace($('#infobulle'),
        el('div', { class: 'infobulle__titre', texte: categorie.categorie }),
        ligneInfobulle('Payé', euros(categorie.reel), 'var(--serie-1)'),
        ligneInfobulle('Prévu', euros(categorie.estime), null),
        ligneInfobulle(ecart >= 0 ? 'Reste' : 'Dépassement', euros(Math.abs(ecart)), null));
      placeInfobulle(evenement, groupe);
    };
    groupe.addEventListener('pointerenter', montre);
    groupe.addEventListener('pointermove', montre);
    groupe.addEventListener('focus', () => montre(null));
    groupe.addEventListener('pointerleave', cacheInfobulle);
    groupe.addEventListener('blur', cacheInfobulle);
    racine.append(groupe);
  });

  hote.append(racine);
  remplace($('#tableau-categories'),
    el('table', {},
      el('thead', {}, el('tr', {},
        el('th', { texte: 'Catégorie' }), el('th', { texte: 'Prévu' }),
        el('th', { texte: 'Dépensé' }), el('th', { texte: 'Écart' }))),
      el('tbody', {}, etat.recap.budget.parCategorie.map(c => el('tr', {},
        el('td', { texte: c.categorie }),
        el('td', { texte: euros(c.estime) }),
        el('td', { texte: euros(c.reel) }),
        el('td', { texte: signe(c.estime - c.reel) }))))));
}

/** Courbes des revenus et des dépenses, mois après mois. */
function dessineGraphiqueEvolution() {
  const hote = $('#graphique-evolution');
  if (!hote) return;
  const mois = trieMois(D.mois).slice().reverse()
    .map(m => ({ libelle: m.libelle, recap: recapBudget(m.lignes) }));

  hote.textContent = '';
  $('#tableau-evolution').textContent = '';

  if (mois.length < 2) {
    hote.append(el('p', { class: 'vide',
      texte: 'Il faut au moins deux mois pour voir une évolution. ' +
             'Créez le mois suivant depuis le menu ⋯.' }));
    return;
  }

  hote.append(el('div', { class: 'legende' },
    el('span', { class: 'legende__cle' },
      el('span', { class: 'legende__pastille', style: 'background:var(--serie-1)' }), 'Encaissé'),
    el('span', { class: 'legende__cle' },
      el('span', { class: 'legende__pastille', style: 'background:var(--serie-2)' }), 'Dépensé')));

  const largeur = Math.max(320, hote.clientWidth || 700);
  const haut = 14, bas = 34, gauche = 64, droite = 16;
  const hauteurTrace = 190;
  const hauteur = haut + hauteurTrace + bas;
  const maxi = Math.max(...mois.flatMap(m => [m.recap.revenus.reel, m.recap.depenses.reel]), 1);
  const echelle = graduationsJolies(maxi);
  const x = (i) => gauche + (mois.length === 1 ? (largeur - gauche - droite) / 2
    : (i / (mois.length - 1)) * (largeur - gauche - droite));
  const y = (v) => haut + hauteurTrace - (Math.max(0, v) / echelle.haut) * hauteurTrace;

  const racine = svg('svg', {
    viewBox: '0 0 ' + largeur + ' ' + hauteur, width: largeur, height: hauteur,
    role: 'img', 'aria-label': 'Évolution des revenus et des dépenses mois par mois',
  });

  for (const valeur of echelle.valeurs) {
    racine.append(svg('line', {
      x1: gauche, x2: largeur - droite, y1: y(valeur), y2: y(valeur),
      stroke: valeur === 0 ? 'var(--ligne-base)' : 'var(--filet)', 'stroke-width': 1,
    }));
    racine.append(svg('text', {
      x: gauche - 8, y: y(valeur) + 4, 'text-anchor': 'end',
      fill: 'var(--encre-3)', 'font-size': 11, 'font-family': 'inherit',
    }, formatEuros.format(valeur).replace(/,00/, '')));
  }

  mois.forEach((m, i) => {
    racine.append(svg('text', {
      x: x(i), y: haut + hauteurTrace + 18, 'text-anchor': 'middle',
      fill: 'var(--encre-3)', 'font-size': 11, 'font-family': 'inherit',
    }, libelleMois(m.libelle).split(' ')[0].slice(0, 4) + '.'));
  });

  const series = [
    { cle: 'revenus', couleur: 'var(--serie-1)', valeurs: mois.map(m => m.recap.revenus.reel) },
    { cle: 'depenses', couleur: 'var(--serie-2)', valeurs: mois.map(m => m.recap.depenses.reel) },
  ];
  for (const serie of series) {
    racine.append(svg('polyline', {
      points: serie.valeurs.map((v, i) => x(i) + ',' + y(v)).join(' '),
      fill: 'none', stroke: serie.couleur, 'stroke-width': 2,
      'stroke-linejoin': 'round', 'stroke-linecap': 'round',
    }));
    serie.valeurs.forEach((v, i) => {
      // Anneau de 2 px en couleur de fond : les points restent lisibles quand ils se croisent.
      racine.append(svg('circle', {
        cx: x(i), cy: y(v), r: 4.5, fill: serie.couleur,
        stroke: 'var(--surface)', 'stroke-width': 2,
      }));
    });
  }

  // Valeur au dernier point seulement : jamais un nombre sur chaque point.
  for (const serie of series) {
    const dernier = serie.valeurs.length - 1;
    racine.append(svg('text', {
      x: x(dernier) - 6, y: y(serie.valeurs[dernier]) - 10, 'text-anchor': 'end',
      fill: 'var(--encre-2)', 'font-size': 11.5, 'font-family': 'inherit',
    }, euros(serie.valeurs[dernier]).replace(/,00/, '')));
  }

  mois.forEach((m, i) => {
    const demi = (largeur - gauche - droite) / Math.max(1, (mois.length - 1) * 2);
    const zone = svg('rect', {
      x: x(i) - demi, y: haut, width: demi * 2, height: hauteurTrace,
      fill: 'transparent', tabindex: 0, role: 'group',
      'aria-label': libelleMois(m.libelle) + ' : encaissé ' + euros(m.recap.revenus.reel) +
                    ', dépensé ' + euros(m.recap.depenses.reel),
    });
    const montre = (evenement) => {
      remplace($('#infobulle'),
        el('div', { class: 'infobulle__titre', texte: libelleMois(m.libelle) }),
        ligneInfobulle('Encaissé', euros(m.recap.revenus.reel), 'var(--serie-1)'),
        ligneInfobulle('Dépensé', euros(m.recap.depenses.reel), 'var(--serie-2)'),
        ligneInfobulle('Reste', euros(m.recap.restant.reel), null));
      placeInfobulle(evenement, zone);
    };
    zone.addEventListener('pointerenter', montre);
    zone.addEventListener('pointermove', montre);
    zone.addEventListener('focus', () => montre(null));
    zone.addEventListener('pointerleave', cacheInfobulle);
    zone.addEventListener('blur', cacheInfobulle);
    racine.append(zone);
  });

  hote.append(racine);
  remplace($('#tableau-evolution'),
    el('table', {},
      el('thead', {}, el('tr', {},
        el('th', { texte: 'Mois' }), el('th', { texte: 'Encaissé' }),
        el('th', { texte: 'Dépensé' }), el('th', { texte: 'Reste' }))),
      el('tbody', {}, mois.map(m => el('tr', {},
        el('td', { texte: libelleMois(m.libelle) }),
        el('td', { texte: euros(m.recap.revenus.reel) }),
        el('td', { texte: euros(m.recap.depenses.reel) }),
        el('td', { texte: euros(m.recap.restant.reel) }))))));
}


/* ============================================================== COURSES === */

/** Écrit la valeur d'un champ, sauf si l'utilisateur est en train de le modifier. */
function valeurChampSiLibre(selecteur, valeur) {
  const champ = $(selecteur);

/**
 * Fenêtre de dialogue accessible (élément <dialog> natif).
 * Renvoie une promesse { valeur, donnees } — valeur vaut null si l'on annule.
 * `valide(valeur, donnees)` peut renvoyer un message d'erreur qui garde la fenêtre ouverte.
 */
function dialogue({ titre, texte, corps, boutons, valide, danger }) {
  return new Promise(resolve => {
    const erreur = el('p', { class: 'dialogue__erreur', role: 'alert' });
    const forme = el('form', { class: 'dialogue__forme', novalidate: true },
      el('h2', { class: 'dialogue__titre', texte: titre }),
      texte ? el('p', { class: 'dialogue__texte', texte }) : null,
      corps || null,
      erreur,
      el('div', { class: 'dialogue__actions' },
        boutons.map(b => el('button', {
          type: b.valeur === null ? 'button' : 'submit', value: b.valeur === null ? '' : b.valeur,
          class: 'bouton' + (b.principal ? (danger ? ' bouton--danger' : ' bouton--primaire') : ''),
          'data-annuler': b.valeur === null ? '1' : null,
        }, b.libelle))));
    const boite = el('dialog', { class: 'dialogue', 'aria-label': titre }, forme);
    document.body.append(boite);

    const termine = (resultat) => { boite.close(); boite.remove(); resolve(resultat); };
    forme.addEventListener('submit', (evenement) => {
      evenement.preventDefault();
      const principal = boutons.find(b => b.principal && b.valeur !== null) || boutons.find(b => b.valeur !== null);
      const valeur = evenement.submitter && evenement.submitter.value ? evenement.submitter.value : principal.valeur;
      const donnees = Object.fromEntries(new FormData(forme));
      const message = valide ? valide(valeur, donnees) : null;
      if (message) {
        erreur.textContent = message;
        // Le curseur revient là où il faut corriger.
        const champ = forme.querySelector('input:not([type="radio"]), select, textarea');
        if (champ) { champ.focus(); if (champ.select) champ.select(); }
        return;
      }
      termine({ valeur, donnees });
    });
    forme.addEventListener('click', (evenement) => {
      if (evenement.target.closest('[data-annuler]')) termine({ valeur: null, donnees: {} });
    });
    boite.addEventListener('cancel', (evenement) => { evenement.preventDefault(); termine({ valeur: null, donnees: {} }); });
    boite.showModal();
    const premier = forme.querySelector('input:not([type="radio"]), select, textarea') ||
                    forme.querySelector('input[type="radio"]:checked') || forme.querySelector('button[type="submit"]');
    if (premier) { premier.focus(); if (premier.select) premier.select(); }
  });
}

          'data-cle': 'param-postesCourses' }, p.postesCourses.join('\n'))),

      el('div', { class: 'reglages' },
        reglage('Taux horaire brut', el('span', { class: 'champ-euro' },
          champParametre('tauxHoraireDefaut', montantSaisi(p.tauxHoraireDefaut), { inputmode: 'decimal', class: 'champ champ--nombre' }))),
        reglage('Cotisations', el('span', { class: 'champ-pourcent' },
          champParametre('tauxCotisationDefaut', montantSaisi(p.tauxCotisationDefaut), { inputmode: 'decimal', class: 'champ champ--nombre' }))))),

    /* -- Affichage ------------------------------------------------------- */
    el('article', { class: 'carte' },

      el('div', { class: 'reglages' },
        reglage('Thème', el('select', { class: 'champ', 'data-param': 'theme', 'data-cle': 'param-theme' },
          [['auto', 'Comme le système'], ['light', 'Clair'], ['dark', 'Sombre']].map(([v, t]) =>
            el('option', { value: v, selected: (document.documentElement.dataset.theme || 'auto') === v }, t)))),
        reglage('Alerte « budget presque atteint » à', el('span', { class: 'champ-pourcent' },
          champParametre('seuilAlerte', String(p.seuilAlerte), { type: 'number', min: '1', max: '100', class: 'champ champ--nombre' }))),
        reglage('Rappel de copie de sauvegarde', el('select', { class: 'champ', 'data-param': 'rappelJours', 'data-cle': 'param-rappelJours' },
          [[0, 'Jamais'], [1, 'Chaque jour'], [3, 'Tous les 3 jours'], [7, 'Chaque semaine'], [14, 'Toutes les 2 semaines'], [30, 'Chaque mois']]
            .map(([v, t]) => el('option', { value: v, selected: p.rappelJours === v }, t))))),
      el('label', { class: 'interrupteur' },
        el('input', { type: 'checkbox', class: 'bascule', checked: p.avertirFermeture, 'data-param': 'avertirFermeture' }),
        'Prévenir en fermant l’onglet si le navigateur n’a pas pu enregistrer')));
  majPageParametres();
}

/** Parties calculées de la page Paramètres (mises à jour sans reconstruire les champs). */
function majPageParametres() {
  const bouton = $('[data-zone="bouton-persistance"]');
  if (bouton) bouton.hidden = etat.persistance !== false;
  texteZone('[data-zone="etat-fichier-detail"]', D.fichierLe
    ? 'Dernière copie : ' + dateCourte(D.fichierLe) + (fichierAJour() ? ' (à jour).' : ', modifiée depuis.')
    : 'Aucune copie pour l’instant.');
  texteZone('[data-zone="persistance"]', etat.persistance === true
    ? 'Le navigateur s’est engagé à ne pas effacer ces données de lui-même.'
    : (etat.persistance === false ? 'Le navigateur peut effacer ces données en cas de manque de place : d’où l’intérêt des copies de sauvegarde.' : ''));
}

/* ========================================================================== */
/* 6. Interactions                                                            */
/*                                                                            */
/* Trois règles :                                                             */
/*   1. Pendant la frappe, les chiffres se recalculent sans reconstruire les  */
/*      champs : le curseur ne saute pas, la touche Tab fonctionne.           */
/*   2. Une reconstruction de la page n'a jamais lieu sous le pointeur :      */
/*      elle attend que le clic soit terminé, sinon le clic serait perdu.     */
/*   3. L'enregistrement suit de peu la frappe, et il est forcé si l'on       */
/*      ferme l'onglet.                                                       */
/* ========================================================================== */

/* -- Enregistrement ------------------------------------------------------- */

let minuteurEnregistrement = null;

function enregistreBientot() {
  clearTimeout(minuteurEnregistrement);
  minuteurEnregistrement = setTimeout(enregistreMaintenant, 350);
}

function enregistreMaintenant() {
  clearTimeout(minuteurEnregistrement);
  minuteurEnregistrement = null;
  const resultat = enregistreDonnees();
  if (resultat === 'ok') signaleSauvegarde('Enregistré');
  else if (resultat === 'conflit') resoutConflit();
  if (resultat !== etat.dernierEnregistrement) { etat.dernierEnregistrement = resultat; dessineEtatFichier(); }
  return resultat;
}

/** Un autre onglet a enregistré entre-temps : on garde sa version (déjà enregistrée),
    et la saisie de cet onglet part dans l'historique au lieu d'être perdue. */
function resoutConflit() {
  clearTimeout(minuteurEnregistrement);
  minuteurEnregistrement = null;
  ajouteVersion('Saisie d’un autre onglet, faite en même temps (conflit)', D);
  rechargeDepuisStockage();
  dessineTout();
  toast('Les comptes ont été modifiés dans un autre onglet en même temps que celui-ci. ' +
        'Cet onglet affiche la version enregistrée ; sa propre saisie est gardée dans Paramètres → Versions précédentes.',
        { erreur: true, duree: 15000 });
}

/* Deux onglets ouverts : chacun suit les modifications de l'autre. */
window.addEventListener('storage', (evenement) => {
  if (evenement.key !== CLE_STOCKAGE && evenement.key !== CLE_REVISION) return;
  if (revisionStockee() <= revisionConnue) return;
  // Le contenu, pas une minuterie, dit s'il reste une saisie non enregistrée ici.
  if (modificationsNonEnregistrees()) { resoutConflit(); return; }
  if (rechargeDepuisStockage()) {
    dessineTout();
    toast('Mis à jour avec les modifications faites dans un autre onglet.', { duree: 3000 });
  }
});

window.addEventListener('pagehide', () => { if (minuteurEnregistrement) enregistreMaintenant(); });
window.addEventListener('beforeunload', (evenement) => {
  if (minuteurEnregistrement) enregistreMaintenant();
  // Tout est enregistré dans le navigateur à chaque frappe : on ne prévient que si cela a échoué.
  if (D && D.parametres.avertirFermeture && !stockageDisponible) {
    evenement.preventDefault();
    evenement.returnValue = '';
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && minuteurEnregistrement) enregistreMaintenant();
});

/* -- Reconstruction différée : jamais sous le pointeur --------------------- */

let minuteurSecours = null;

function planifieRendu() {
  etat.renduEnAttente = true;
  if (!etat.pointeurEnfonce) setTimeout(rendsSiBesoin, 0);
  // Filet de sécurité si le relâchement du pointeur n'arrive jamais (glisser hors de la fenêtre…).
  clearTimeout(minuteurSecours);
  minuteurSecours = setTimeout(() => { etat.pointeurEnfonce = false; rendsSiBesoin(); }, 800);
}

function rendsSiBesoin() { if (etat.renduEnAttente) dessineTout(); }

document.addEventListener('pointerdown', () => { etat.pointeurEnfonce = true; }, true);
const relachePointeur = () => {
  etat.pointeurEnfonce = false;
  // Le clic est distribué juste après le relâchement : on reconstruit après lui.
  if (etat.renduEnAttente) setTimeout(rendsSiBesoin, 0);
};
document.addEventListener('pointerup', relachePointeur, true);
document.addEventListener('pointercancel', relachePointeur, true);

/* -- Retrouver l'objet visé par un champ ----------------------------------- */

function cible(dataset) {
  const mois = moisActif();
  const id = Number(dataset.id);
  if (dataset.entite === 'ligne') return mois.lignes.find(l => l.id === id);
  if (dataset.entite === 'achat') return mois.achats.find(a => a.id === id);
  if (dataset.entite === 'creneau') return mois.creneaux.find(c => c.id === id);
  return null;
}

/* -- Saisie : recalcul immédiat, sans reconstruire ------------------------- */

document.addEventListener('input', (evenement) => {
  const champ = evenement.target;
  const d = champ.dataset || {};
  if (!d.entite || !d.champ) return;
  const mois = moisActif();

  if (d.entite === 'ligne') {
    if (CHAMPS_STRUCTURELS.has(d.champ)) return;      // traités à la validation
    const ligne = cible(d); if (!ligne) return;
    ecrisLigne(ligne, d.champ, champ.value);
  } else if (d.entite === 'achat') {
    const achat = cible(d); if (!achat) return;
    ecrisAchat(achat, d.champ, champ.value);
  } else if (d.entite === 'semaine') {
    ecrisSemaine(mois, Number(d.id), champ.value);
  } else if (d.entite === 'mois') {
    ecrisMois(mois, d.champ, champ.value);
  } else {
    return;                                           // un horaire incomplet n'a pas de sens
  }
  rafraichitCalculs();
  enregistreBientot();
});

/* -- Validation d'un champ (sortie du champ, Entrée, case, liste) ---------- */

document.addEventListener('change', (evenement) => {
  const champ = evenement.target;
  if (champ.id === 'choix-mois') {
    enregistreMaintenant();
    D.moisActif = Number(champ.value);
    etat.detailsOuverts.clear();
    dessineTout();
    return;
  }
  if (champ.id === 'fichier-import') { importeFichier(champ.files[0]); return; }

  const d = champ.dataset || {};
  if (d.param) { ecrisParametre(d.param, champ); return; }
  if (d.catChamp === 'nom') { appliqueRenommage(d.sorte, d.nom, champ.value); return; }
  if (d.catChamp === 'nature') {
    const categorie = trouveCategorie(d.sorte, d.nom);
    if (categorie) { categorie.nature = champ.value; enregistreMaintenant(); }
    return;
  }
  if (!d.entite || !d.champ) return;
  const mois = moisActif();

  if (d.entite === 'ligne') {
    const ligne = cible(d); if (!ligne) return;
    ecrisLigne(ligne, d.champ, champ.type === 'checkbox' ? champ.checked : champ.value);

    if (CHAMPS_STRUCTURELS.has(d.champ)) {
      // La ligne doit rester visible là où elle arrive.
      etat.groupesOuverts.add((ligne.type === 'depense' ? 'd:' : 'r:') + cleCategorie(ligne));
      enregistrePreferences();
      enregistreMaintenant();
      rafraichitCalculs();
      planifieRendu();
      return;
    }
    if (d.champ === 'libelle' || d.champ === 'note') { ligne[d.champ] = ligne[d.champ].trim(); champ.value = ligne[d.champ]; }
    else champ.value = montantSaisi(ligne[d.champ]);
  } else if (d.entite === 'achat') {
    const achat = cible(d); if (!achat) return;
    ecrisAchat(achat, d.champ, champ.value);
    champ.value = d.champ === 'montant' ? montantSaisi(achat.montant) : achat[d.champ].trim();
    if (d.champ !== 'montant') achat[d.champ] = champ.value;
  } else if (d.entite === 'semaine') {
    ecrisSemaine(mois, Number(d.id), champ.value);
    champ.value = montantSaisi((mois.semaines.find(s => s.numero === Number(d.id)) || {}).budget);
  } else if (d.entite === 'mois') {
    ecrisMois(mois, d.champ, champ.value);
    champ.value = montantSaisi(d.champ === 'budgetCourses' ? budgetCourses(mois) : mois[d.champ]);
  } else if (d.entite === 'creneau') {
    const creneau = cible(d); if (!creneau) return;
    champ.value = ecrisCreneau(creneau, d.champ, champ.value);
  }
  rafraichitCalculs();
  enregistreMaintenant();
});

/* -- Ctrl+S (ou Cmd+S) : tout est déjà enregistré ; on le confirme au lieu d'enregistrer la page brute. -- */
document.addEventListener('keydown', (evenement) => {
  if ((evenement.ctrlKey || evenement.metaKey) && !evenement.altKey && evenement.key.toLowerCase() === 's') {
    evenement.preventDefault();
    expliqueEnregistrement();
  }
}, true);
/* -- Clavier : Entrée valide, Échap annule la saisie en cours -------------- */

document.addEventListener('focusin', (evenement) => {
  const champ = evenement.target;
  if (champ.dataset && champ.dataset.champ && champ.tagName === 'INPUT' && champ.type !== 'checkbox') {
    etat.valeurInitiale = { noeud: champ, valeur: champ.value };
  }
});

document.addEventListener('keydown', (evenement) => {
  const champ = evenement.target;
  if (!champ.dataset || !champ.dataset.champ || champ.tagName !== 'INPUT') return;
  if (evenement.key === 'Enter') { evenement.preventDefault(); champ.blur(); }
  if (evenement.key === 'Escape' && etat.valeurInitiale && etat.valeurInitiale.noeud === champ) {
    evenement.preventDefault();
    champ.value = etat.valeurInitiale.valeur;
    champ.dispatchEvent(new Event('input', { bubbles: true }));
    champ.blur();
  }
});

/* -- Clics ------------------------------------------------------------------ */

document.addEventListener('click', (evenement) => {
  etat.pointeurEnfonce = false;

  // Ouvrir / fermer un groupe : on agit directement, sans rien reconstruire.
  const sommaire = evenement.target.closest('.groupe > summary');
  if (sommaire) {
    evenement.preventDefault();
    basculeGroupe(sommaire.parentElement, !sommaire.parentElement.open);
    return;
  }

  const bouton = evenement.target.closest('button');
  if (!bouton) {
    if (!evenement.target.closest('.menu')) $$('.menu[open]').forEach(m => m.removeAttribute('open'));
    return;
  }
  const d = bouton.dataset;

  if (d.vue) { montreVue(d.vue); window.scrollTo({ top: 0 }); return; }
  if (d.aller) { montreVue(d.aller); window.scrollTo({ top: 0 }); return; }
  if (d.action) { actionMenu(d.action); return; }
  if (d.ouvrirAjout) { ouvreAjout(d.ouvrirAjout); return; }
  if (d.fermerAjout) { fermeAjout(d.fermerAjout); return; }
  if (d.ajouter) { ajouteLigneRapide(bouton); return; }
  if (d.ajouterAchat) { ajouteAchat(bouton); return; }
  if (d.supprimer) { demandeSuppression(bouton); return; }
  if (d.plier) { plieBloc(d.plier, d.sens !== 'fermer'); return; }
  if (d.nouvelleCategorie) { nouvelleCategorie(d.nouvelleCategorie); return; }
  if (d.categorieAction) { actionCategorie(d.categorieAction, d.sorte, d.nom); return; }
  if (d.versionAction) { actionVersion(d.versionAction, Number(d.version)); return; }

  if (d.detail) {
    const id = Number(d.detail);
    if (etat.detailsOuverts.has(id)) etat.detailsOuverts.delete(id); else etat.detailsOuverts.add(id);
    dessineTout();
    return;
  }
  if (d.basculeNature) {
    const ligne = moisActif().lignes.find(l => l.id === Number(d.basculeNature));
    if (!ligne) return;
    ecrisLigne(ligne, 'nature', ligne.nature === 'fixe' ? 'variable' : 'fixe');
    enregistreMaintenant();
    dessineTout();
    toast('« ' + (ligne.libelle || 'Ligne') + ' » est maintenant ' +
          (ligne.nature === 'fixe' ? 'une charge fixe.' : 'une dépense variable.'), { duree: 3500 });
    return;
  }

  if (bouton.id === 'mois-precedent') { changeMoisRelatif(-1); return; }
  if (bouton.id === 'mois-suivant') { changeMoisRelatif(1); return; }
  if (bouton.id === 'ajouter-semaine') { ajouteSemaine(); enregistreMaintenant(); dessineTout(); return; }
  if (bouton.id === 'retirer-semaine') {
    const semaines = moisActif().semaines;
    const derniere = semaines.reduce((m, s) => Math.max(m, s.numero), 0);
    if (semaines.length <= 1) { toast('Il faut garder au moins une semaine.', { erreur: true }); return; }
    if (!confirm('Supprimer la semaine ' + derniere + ' et tout ce qu’elle contient ?')) return;
    retireSemaine(derniere);
    enregistreMaintenant();
    dessineTout();
  }
});

/* -- Groupes repliables ------------------------------------------------------ */

function basculeGroupe(details, ouvrir) {
  details.open = ouvrir;
  if (ouvrir) etat.groupesOuverts.add(details.dataset.groupe);
  else etat.groupesOuverts.delete(details.dataset.groupe);
  enregistrePreferences();
  majBoutonsPlier();
}

function plieBloc(bloc, ouvrir) {
  for (const details of $$('#corps-' + bloc + ' .groupe')) basculeGroupe(details, ouvrir);
}

/* -- Ajouts ------------------------------------------------------------------ */

function ouvreAjout(sorte) {
  const formulaire = $('#ajout-' + sorte);
  formulaire.hidden = false;
  formulaire.querySelector('[name="libelle"]').focus();
}

function fermeAjout(sorte) {
  const formulaire = $('#ajout-' + sorte);
  formulaire.reset();
  formulaire.hidden = true;
}

document.addEventListener('submit', (evenement) => {
  const formulaire = evenement.target;
  if (!formulaire.classList.contains('ajout')) return;
  evenement.preventDefault();
  const v = Object.fromEntries(new FormData(formulaire));
  const depense = formulaire.id === 'ajout-depense';

  const sorte = depense ? 'depense' : 'revenu';
  const nomCategorie = String(v.categorie || '').trim() ||
    (categoriesDe(sorte)[0] ? categoriesDe(sorte)[0].nom : (depense ? 'Sans catégorie' : 'Salaires'));
  const categorie = assureCategorie(sorte, nomCategorie, v.nature);
  const ligne = creeLigne({
    type: depense ? 'depense' : 'salaire',
    nature: depense ? (v.nature || categorie.nature) : 'fixe',
    categorie: categorie.nom,
    libelle: v.libelle, estime: v.estime, reel: v.reel,
  });
  etat.groupesOuverts.add((depense ? 'd:' : 'r:') + ligne.categorie);
  etat.nouvelleLigne = ligne.id;
  enregistrePreferences();
  fermeAjout(depense ? 'depense' : 'revenu');
  enregistreMaintenant();
  dessineTout();
  const rangee = $('[data-ligne="' + ligne.id + '"]');
  if (rangee) rangee.scrollIntoView({ block: 'center', behavior: 'smooth' });
  toast('« ' + ligne.libelle + ' » ajouté dans « ' + ligne.categorie + ' ».', { duree: 3500 });
});

function ajouteLigneRapide(bouton) {
  const type = bouton.dataset.ajouter;
  const sorte = type === 'depense' ? 'depense' : 'revenu';
  const categorie = assureCategorie(sorte, bouton.dataset.categorie || (sorte === 'depense' ? 'Sans catégorie' : 'Salaires'));
  const ligne = creeLigne({
    type,
    nature: sorte === 'depense' ? categorie.nature : 'fixe',
    categorie: categorie.nom,
  });
  etat.groupesOuverts.add((sorte === 'depense' ? 'd:' : 'r:') + categorie.nom);
  etat.nouvelleLigne = ligne.id;
  enregistrePreferences();
  enregistreMaintenant();
  dessineTout();
  const champ = $('[data-cle="ligne-' + ligne.id + '-libelle"]');
  if (champ) { champ.focus(); champ.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
}

function ajouteAchat(bouton) {
  const achat = creeAchat({
    semaine: Number(bouton.dataset.ajouterAchat),
    libelle: bouton.dataset.libelle || '',
    poste: bouton.dataset.poste || '',
  });
  enregistreMaintenant();
  dessineTout();
  const cle = bouton.dataset.libelle ? 'achat-' + achat.id + '-montant' : 'achat-' + achat.id + '-libelle';
  const champ = $('[data-cle="' + cle + '"]');
  if (champ) champ.focus();
}

function demandeSuppression(bouton) {
  const entite = bouton.dataset.supprimer;
  const id = Number(bouton.dataset.id);
  const supprime = entite === 'ligne' ? supprimeLigne(id) : supprimeAchat(id);
  if (!supprime) return;
  etat.detailsOuverts.delete(id);
  enregistreMaintenant();
  dessineTout();
  toast('« ' + (supprime.libelle || 'Ligne sans nom') + ' » supprimé.', {
    action: {
      libelle: 'Annuler',
      faire: () => {
        const retour = entite === 'ligne' ? creeLigne(supprime) : creeAchat(supprime);
        if (entite === 'ligne') etat.nouvelleLigne = retour.id;
        enregistreMaintenant();
        dessineTout();
        signaleSauvegarde('Rétabli');
      },
    },
  });
}

/* -- Mois --------------------------------------------------------------------- */

const NOMS_MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet',
                   'août', 'septembre', 'octobre', 'novembre', 'décembre'];

async function nouveauMois() {
  const [annee, mois] = decaleMois(moisActif().libelle, 1).split('-').map(Number);
  const r = await dialogue({
    titre: 'Créer un nouveau mois',
    texte: 'Les lignes du mois affiché sont recopiées avec leurs montants prévus ; les montants payés et reçus repartent de zéro.',
    corps: el('div', { class: 'dialogue__rangee' },
      el('label', { class: 'dialogue__champ' }, 'Mois',
        el('select', { class: 'champ', name: 'mois' }, NOMS_MOIS.map((nom, i) =>
          el('option', { value: i + 1, selected: i + 1 === mois }, nom.charAt(0).toUpperCase() + nom.slice(1))))),
      el('label', { class: 'dialogue__champ' }, 'Année',
        el('input', { class: 'champ', name: 'annee', type: 'number', min: '2000', max: '2100', value: annee }))),
    boutons: [{ libelle: 'Annuler', valeur: null }, { libelle: 'Créer', valeur: 'ok', principal: true }],
    valide: (_, v) => {
      const a = Number(v.annee);
      if (!Number.isInteger(a) || a < 2000 || a > 2100) return 'Indiquez une année entre 2000 et 2100.';
      const libelle = a + '-' + String(v.mois).padStart(2, '0');
      return D.mois.some(m => m.libelle === libelle) ? libelleMois(libelle) + ' existe déjà.' : null;
    },
  });
  if (!r.valeur) return;
  const libelle = r.donnees.annee + '-' + String(r.donnees.mois).padStart(2, '0');
  D.moisActif = creeMois(libelle, D.moisActif).id;
  etat.detailsOuverts.clear();
  enregistreMaintenant();
  dessineTout();
  toast(libelleMois(libelle) + ' créé.', { duree: 3000 });
}
function changeMoisRelatif(pas) {
  enregistreMaintenant();
  const cibleMois = decaleMois(moisActif().libelle, pas);
  const existant = D.mois.find(m => m.libelle === cibleMois);
  if (!existant && !confirm(libelleMois(cibleMois) + ' n’existe pas encore. ' +
                            'Le créer à partir du mois affiché ?')) return;
  D.moisActif = (existant || creeMois(cibleMois, D.moisActif)).id;
  etat.detailsOuverts.clear();
  enregistreMaintenant();
  dessineTout();
}

/* -- Import / export ------------------------------------------------------------ */

function telecharge(nomFichier, contenu, typeMime) {
  const lien = el('a', { href: URL.createObjectURL(new Blob([contenu], { type: typeMime })), download: nomFichier });
  document.body.append(lien);
  lien.click();
  lien.remove();
  setTimeout(() => URL.revokeObjectURL(lien.href), 2000);
}

function virgule(valeur) { return eur(valeur).toFixed(2).replace('.', ','); }

/** CSV au format français : séparateur « ; », virgule décimale, BOM pour Excel. */
function construitCsv(mois) {
  synchroniseLiens(mois);
  const totaux = recap(mois);
  const lignes = [];
  const ajoute = (cellules) => lignes.push(cellules.map(c => {
    const texte = String(c === null || c === undefined ? '' : c);
    return /[";\n]/.test(texte) ? '"' + texte.replace(/"/g, '""') + '"' : texte;
  }).join(';'));

  ajoute(['Type', 'Nature', 'Catégorie', 'Libellé', 'Prévu', 'Payé / reçu', 'Écart', 'Compté', 'Note']);
  for (const l of mois.lignes) {
    const estime = l.actif ? eur(l.estime) : 0;
    const reel = l.actif ? eur(l.reel) : 0;
    const ecart = l.type === 'depense' ? estime - reel : reel - estime;
    ajoute([l.type, l.nature, l.categorie, l.libelle, virgule(l.estime), virgule(l.reel),
            virgule(ecart), l.actif ? 'oui' : 'non (en pause)', l.note]);
  }
  ajoute([]);
  ajoute(['TOTAL DÉPENSES', '', '', '', virgule(totaux.budget.depenses.estime), virgule(totaux.budget.depenses.reel)]);
  ajoute(['TOTAL REVENUS', '', '', '', virgule(totaux.budget.revenus.estime), virgule(totaux.budget.revenus.reel)]);
  ajoute(['RESTE À VIVRE', '', '', '', virgule(totaux.budget.restant.estime), virgule(totaux.budget.restant.reel)]);
  ajoute([]);
  ajoute(['Courses — semaine', 'Poste', 'Libellé', 'Montant']);
  for (const a of mois.achats) ajoute([a.semaine, a.poste, a.libelle, virgule(a.montant)]);
  ajoute([]);
  ajoute(['Heures gardées', totaux.heures.duree]);
  ajoute(['Salaire brut', virgule(totaux.heures.brut)]);
  ajoute(['Cotisations', virgule(totaux.heures.cotisation)]);
  ajoute(['Salaire net', virgule(totaux.heures.net)]);
  return '﻿' + lignes.join('\r\n') + '\r\n';
}

function actionMenu(action) {
  $$('.menu[open]').forEach(m => m.removeAttribute('open'));
  if (action === 'nouveau-mois') { nouveauMois(); return; }
  if (action === 'etat-enregistrement') { expliqueEnregistrement(); return; }
  if (action === 'copie-sauvegarde') { telechargeCopie(); return; }
  if (action === 'ouvrir-sauvegarde') { $('#fichier-import').click(); return; }
  if (action === 'persister') { demandePersistance(); return; }
  if (action === 'export-csv') {
    telecharge('comptes-' + moisActif().libelle + '.csv', construitCsv(moisActif()), 'text/csv;charset=utf-8');
    return;
  }
  if (action === 'export-json') {
    enregistreMaintenant();
    telecharge('comptes-donnees-' + new Date().toISOString().slice(0, 10) + '.json',
               JSON.stringify(Object.assign({ application: 'comptes' }, D), null, 2), 'application/json');
    toast('Données exportées. Pour une sauvegarde complète, préférez « Télécharger une copie de sauvegarde ».');
    return;
  }
  if (action === 'supprimer-mois') { supprimeMoisAffiche(); }
}

async function supprimeMoisAffiche() {
  if (D.mois.length <= 1) { toast('C’est le seul mois : il ne peut pas être supprimé.', { erreur: true }); return; }
  const nom = libelleMois(moisActif().libelle);
  const r = await dialogue({
    titre: 'Supprimer ' + nom + ' ?', danger: true,
    texte: 'Toutes ses lignes, ses courses et ses heures seront supprimées. Vous pourrez annuler juste après, ou revenir en arrière depuis les versions précédentes.',
    boutons: [{ libelle: 'Annuler', valeur: null }, { libelle: 'Supprimer ' + nom, valeur: 'ok', principal: true }],
  });
  if (!r.valeur) return;
  avecAnnulation('Suppression de ' + nom, () => {
    D.mois = D.mois.filter(m => m.id !== D.moisActif);
    D.moisActif = trieMois(D.mois)[0].id;
    return nom + ' supprimé.';
  });
}

/* -- Annulation générale : une copie complète avant chaque opération délicate --- */

function avecAnnulation(description, operation) {
  const avant = JSON.stringify(D);
  ajouteVersion('Avant : ' + description);
  const message = operation();
  enregistreMaintenant();
  dessineTout();
  toast(message || description + ' : fait.', {
    duree: 10000,
    action: { libelle: 'Annuler', faire: () => {
      const retour = validees(JSON.parse(avant));
      if (!retour) return;
      D = retour;
      enregistreDonnees({ force: true });
      dessineTout();
      signaleSauvegarde('Annulé');
    } },
  });
}

/* -- Catégories ----------------------------------------------------------------- */

async function nouvelleCategorie(sorte) {
  const r = await dialogue({
    titre: sorte === 'depense' ? 'Nouvelle catégorie de dépenses' : 'Nouvelle catégorie de revenus',
    texte: 'Elle apparaîtra dans tous les mois.',
    corps: el('div', { class: 'dialogue__rangee' },
      champDialogue('Nom', { name: 'nom', placeholder: sorte === 'depense' ? 'ex. Loisirs, Logement…' : 'ex. Primes, Loyers perçus…', autocomplete: 'off' }),
      sorte === 'depense' ? el('label', { class: 'dialogue__champ' }, 'Nature des lignes',
        el('select', { class: 'champ', name: 'nature' },
          el('option', { value: 'variable' }, 'Dépenses variables'), el('option', { value: 'fixe' }, 'Charges fixes'))) : null),
    boutons: [{ libelle: 'Annuler', valeur: null }, { libelle: 'Créer la catégorie', valeur: 'ok', principal: true }],
    valide: (_, v) => !String(v.nom || '').trim() ? 'Donnez un nom à la catégorie.'
      : (trouveCategorie(sorte, v.nom) ? 'La catégorie « ' + v.nom.trim() + ' » existe déjà.' : null),
  });
  if (!r.valeur) return;
  const categorie = creeCategorie(sorte, r.donnees.nom, r.donnees.nature);
  etat.groupesOuverts.add((sorte === 'depense' ? 'd:' : 'r:') + categorie.nom);
  enregistrePreferences();
  enregistreMaintenant();
  dessineTout();
  const groupe = $('details[data-groupe="' + CSS.escape((sorte === 'depense' ? 'd:' : 'r:') + categorie.nom) + '"]');
  if (groupe && etat.vue === 'budget') groupe.scrollIntoView({ block: 'center', behavior: 'smooth' });
  toast('Catégorie « ' + categorie.nom + ' » créée.', { duree: 3500 });
}

async function actionCategorie(action, sorte, nom) {
  if (action === 'monter' || action === 'descendre') {
    deplaceCategorie(sorte, nom, action === 'monter' ? -1 : 1);
    enregistreMaintenant();
    dessineTout();
    const bouton = $('[data-categorie-action="' + action + '"][data-nom="' + CSS.escape(nom) + '"]:not([disabled])');
    if (bouton) bouton.focus({ preventScroll: true });
    return;
  }
  if (action === 'renommer') {
    const r = await dialogue({
      titre: 'Renommer « ' + nom + ' »',
      texte: 'Le nouveau nom s’applique à tous les mois. Si vous choisissez le nom d’une autre catégorie, les deux seront fusionnées.',
      corps: champDialogue('Nouveau nom', { name: 'nom', value: nom, autocomplete: 'off' }),
      boutons: [{ libelle: 'Annuler', valeur: null }, { libelle: 'Renommer', valeur: 'ok', principal: true }],
      valide: (_, v) => String(v.nom || '').trim() ? null : 'Le nom ne peut pas être vide.',
    });
    if (r.valeur) await appliqueRenommage(sorte, nom, r.donnees.nom);
    return;
  }
  if (action === 'supprimer') await demandeSuppressionCategorie(sorte, nom);
}

async function appliqueRenommage(sorte, ancien, nouveau) {
  const propre = String(nouveau || '').trim();
  if (!propre || propre === ancien) { dessineTout(); return; }
  const cible = trouveCategorie(sorte, propre);
  if (cible && cible.nom !== ancien) {
    const n = compteLignesCategorie(sorte, ancien);
    const r = await dialogue({
      titre: 'Fusionner avec « ' + cible.nom + ' » ?',
      texte: '« ' + cible.nom + ' » existe déjà. Les ' + (n.ici + n.ailleurs) + ' ligne(s) de « ' + ancien +
             ' » (tous mois confondus) la rejoindront, et « ' + ancien + ' » disparaîtra.',
      boutons: [{ libelle: 'Annuler', valeur: null }, { libelle: 'Fusionner', valeur: 'ok', principal: true }],
    });
    if (!r.valeur) { dessineTout(); return; }
  }
  const prefixe = sorte === 'depense' ? 'd:' : 'r:';
  avecAnnulation('Renommage de « ' + ancien + ' »', () => {
    const resultat = renommeCategorie(sorte, ancien, propre);
    const nomFinal = trouveCategorie(sorte, propre).nom;
    if (etat.groupesOuverts.delete(prefixe + ancien)) etat.groupesOuverts.add(prefixe + nomFinal);
    enregistrePreferences();
    return resultat === 'fusionnee' ? '« ' + ancien + ' » fusionnée dans « ' + nomFinal + ' ».'
                                    : '« ' + ancien + ' » renommée en « ' + nomFinal + ' ».';
  });
}

async function demandeSuppressionCategorie(sorte, nom) {
  const n = compteLignesCategorie(sorte, nom);
  const total = n.ici + n.ailleurs;
  const autres = categoriesDe(sorte).filter(c => c.nom !== nom);
  const detail = n.ici + ' dans ce mois' + (n.ailleurs ? ', ' + n.ailleurs + ' dans les autres mois' : '');
  const choix = total === 0 ? null : el('fieldset', { class: 'dialogue__choix' },
    el('legend', { texte: 'Que faire de ses ' + total + ' ligne(s) (' + detail + ') ?' }),
    autres.length ? el('label', { class: 'dialogue__radio' },
      el('input', { type: 'radio', name: 'choix', value: 'deplacer', checked: true }),
      'Les déplacer vers ',
      el('select', { class: 'champ', name: 'destination', 'aria-label': 'Catégorie de destination' },
        autres.map(c => el('option', { value: c.nom }, c.nom)))) : null,
    el('label', { class: 'dialogue__radio' },
      el('input', { type: 'radio', name: 'choix', value: 'supprimer', checked: !autres.length }),
      'Les supprimer aussi, dans tous les mois'));
  const r = await dialogue({
    titre: 'Supprimer la catégorie « ' + nom + ' » ?', danger: true,
    texte: total === 0 ? 'Elle ne contient aucune ligne, dans aucun mois.'
                       : 'Vous pourrez annuler juste après, ou revenir en arrière depuis les versions précédentes.',
    corps: choix,
    boutons: [{ libelle: 'Annuler', valeur: null }, { libelle: 'Supprimer la catégorie', valeur: 'ok', principal: true }],
  });
  if (!r.valeur) return;
  const destination = total && r.donnees.choix === 'deplacer' ? r.donnees.destination : null;
  avecAnnulation('Suppression de la catégorie « ' + nom + ' »', () => {
    const bilan = supprimeCategorie(sorte, nom, destination);
    if (destination) etat.groupesOuverts.add((sorte === 'depense' ? 'd:' : 'r:') + destination);
    return 'Catégorie « ' + nom + ' » supprimée' +
      (bilan.deplacees ? ' ; ' + bilan.deplacees + ' ligne(s) déplacée(s) vers « ' + destination + ' »' : '') +
      (bilan.supprimees ? ' ; ' + bilan.supprimees + ' ligne(s) supprimée(s)' : '') + '.';
  });
}

/* -- Paramètres ------------------------------------------------------------------- */

function ecrisParametre(cle, champ) {
  const p = D.parametres;
  const liste = (texte) => Array.from(new Set(texte.split('\n').map(x => x.trim()).filter(Boolean)));
  if (cle === 'theme') { appliqueTheme(champ.value); return; }
  if (cle === 'module-courses' || cle === 'module-heures') p.modules[cle.slice(7)] = champ.checked;
  else if (cle === 'avertirFermeture') p.avertirFermeture = champ.checked;
  else if (cle === 'postesCourses' || cle === 'articlesCourses') p[cle] = liste(champ.value);
  else if (cle === 'nomCourses' || cle === 'nomHeures') p[cle] = champ.value.trim() || PARAMETRES_DEFAUT[cle];
  else if (cle === 'seuilAlerte') p.seuilAlerte = Math.min(100, Math.max(1, Math.round(nombre(champ.value)) || 85));
  else if (cle === 'semainesDefaut') p.semainesDefaut = Math.min(6, Math.max(1, Math.round(nombre(champ.value)) || 4));
  else if (cle === 'rappelJours') p.rappelJours = Math.max(0, Math.round(Number(champ.value)) || 0);
  else if (cle === 'budgetSemaineDefaut' || cle === 'tauxHoraireDefaut' || cle === 'tauxCotisationDefaut') p[cle] = nombre(champ.value);
  else return;
  enregistreMaintenant();
  planifieRendu();
}

/* -- Sauvegarde dans un fichier ------------------------------------------------------
   Le fichier produit est l'application elle-même, avec les données à l'intérieur :
   l'ouvrir sur n'importe quel ordinateur retrouve les comptes. */

function pageAvecDonnees(donnees) {
  const clone = SOURCE_PAGE.cloneNode(true);
  // « < » échappé : le JSON ne peut pas refermer la balise qui le contient.
  clone.querySelector('#donnees-integrees').textContent = JSON.stringify(donnees).replace(/</g, '\\u003c');
  return '<!doctype html>\n' + clone.outerHTML + '\n';
}

/** Lit un fichier de sauvegarde : comptes.html enregistré, ou export JSON. */
async function lisSauvegarde(fichier) {
  const texte = await fichier.text();
  if (/^\s*[{\[]/.test(texte)) return { donnees: validees(JSON.parse(texte)), html: false };
  const page = new DOMParser().parseFromString(texte, 'text/html');
  const bloc = page.getElementById('donnees-integrees');
  return { donnees: bloc ? validees(JSON.parse(bloc.textContent || 'null')) : null, html: true };
}

async function importeFichier(fichier) {
  if (!fichier) return;
  try {
    const { donnees, html } = await lisSauvegarde(fichier);
    if (!donnees) throw new Error('ce fichier ne contient pas de comptes');
    const nouveaux = donnees.mois.filter(m => !D.mois.some(x => x.libelle === m.libelle));
    const r = await dialogue({
      titre: 'Ouvrir « ' + fichier.name + ' » ?',
      corps: el('div', { class: 'apercu' },
        el('p', {}, donnees.fichierLe ? 'Enregistré le ' + dateCourte(donnees.fichierLe) + '. '
                                      : (donnees.modifieLe ? 'Dernière modification le ' + dateCourte(donnees.modifieLe) + '. ' : ''),
          resumeDonnees(donnees) + '.'),
        el('p', {}, 'Mois contenus : ' + trieMois(donnees.mois).map(m => libelleMois(m.libelle)).join(', ') + '.'),
        el('p', { class: 'apercu__note', texte: 'Vos comptes actuels sont d’abord gardés dans les versions précédentes : rien n’est perdu.' })),
      boutons: [
        { libelle: 'Annuler', valeur: null },
        nouveaux.length ? { libelle: 'Ajouter seulement les ' + nouveaux.length + ' mois absents', valeur: 'fusion' } : null,
        { libelle: 'Remplacer tous mes comptes', valeur: 'remplacer', principal: true },
      ].filter(Boolean),
    });
    if (!r.valeur) return;
    avecAnnulation('Ouverture de « ' + fichier.name + ' »', () => {
      if (r.valeur === 'remplacer') {
        const etaitAJour = donnees.fichierRevision !== null && donnees.fichierRevision === donnees.revision;
        D = donnees;
        if (enregistreDonnees({ force: true }) === 'ok' && html && etaitAJour) {
          D.fichierRevision = D.revision;
          enregistreDonnees({ meta: true, force: true });
        }
        return 'Comptes remplacés par ceux de « ' + fichier.name + ' ».';
      }
      for (const mois of nouveaux) {
        mois.id = D.prochainId++;
        for (const collection of [mois.lignes, mois.achats, mois.creneaux]) {
          for (const element of collection) element.id = D.prochainId++;
        }
        for (const l of mois.lignes) assureCategorie(l.type === 'depense' ? 'depense' : 'revenu', l.categorie, l.nature);
        D.mois.push(mois);
      }
      D.moisActif = trieMois(D.mois)[0].id;
      return nouveaux.length + ' mois ajouté(s) depuis « ' + fichier.name + ' ».';
    });
  } catch (erreur) {
    toast('Fichier illisible : ' + erreur.message, { erreur: true });
  } finally {
    $('#fichier-import').value = '';
  }
}

async function actionVersion(action, index) {
  const version = lisVersions()[index];
  if (!version) return;
  if (action === 'telecharger') {
    telecharge('comptes-version-' + version.le.slice(0, 16).replace(/[:T]/g, '-') + '.json', version.donnees, 'application/json');
    return;
  }
  let donnees = null;
  try { donnees = validees(JSON.parse(version.donnees)); } catch (e) { donnees = null; }
  if (!donnees) { toast('Cette version est illisible.', { erreur: true }); return; }
  const quand = new Date(version.le).toLocaleString('fr-FR', { dateStyle: 'long', timeStyle: 'short' });
  const r = await dialogue({
    titre: 'Revenir à la version du ' + quand + ' ?',
    texte: version.resume + '. Vos comptes actuels sont d’abord gardés dans l’historique : vous pourrez y revenir.',
    boutons: [{ libelle: 'Annuler', valeur: null }, { libelle: 'Revenir à cette version', valeur: 'ok', principal: true }],
  });
  if (!r.valeur) return;
  avecAnnulation('Retour à la version du ' + quand, () => {
    D = donnees;
    enregistreDonnees({ force: true });
    return 'Comptes revenus à la version du ' + quand + '.';
  });
}

async function demandePersistance() {
  if (!navigator.storage || !navigator.storage.persist) {
    toast('Ce navigateur ne propose pas cette protection.', { erreur: true });
    return;
  }
  try { etat.persistance = await navigator.storage.persist(); } catch (e) { etat.persistance = false; }
  majPageParametres();
  toast(etat.persistance ? 'Le navigateur protège désormais ces données.'
                         : 'Le navigateur a refusé : gardez l’habitude de télécharger des copies de sauvegarde.', { erreur: !etat.persistance });
}
/* -- Thème, préférences, mise en page ------------------------------------------- */

function changeTheme() {
  const suite = { auto: 'light', light: 'dark', dark: 'auto' };
  appliqueTheme(suite[document.documentElement.dataset.theme || 'auto']);
}

function appliqueTheme(theme) {
  document.documentElement.dataset.theme = theme;
  const etiquette = $('#etat-theme');
  if (etiquette) etiquette.textContent = { auto: 'auto', light: 'clair', dark: 'sombre' }[theme];
  try { localStorage.setItem('comptes.theme', theme); } catch (e) { /* ignoré */ }
  if (etat.recap && etat.vue === 'graphiques') { dessineGraphiqueCategories(); dessineGraphiqueEvolution(); }
}

function enregistrePreferences() {
  try { localStorage.setItem('comptes.groupesOuverts', JSON.stringify(Array.from(etat.groupesOuverts))); }
  catch (e) { /* ignoré */ }
}

/** Publie les hauteurs réelles de l'en-tête et de la navigation (elles varient selon l'écran). */
function ajusteAncrages() {
  const racine = document.documentElement;
  const tete = $('.tete'), nav = $('.nav');
  if (tete) racine.style.setProperty('--haut-tete', tete.offsetHeight + 'px');
  if (nav) racine.style.setProperty('--haut-nav', nav.offsetHeight + 'px');

window.addEventListener('hashchange', () => {

});

/* Le mini-bilan apparaît quand le grand sort de l'écran. Il est en position fixe :

/* ========================================================================== */
/* 7. Démarrage et auto-vérification                                          */
/* ========================================================================== */

function demarre() {
  stockageDisponible = testeStockage();

  let theme = 'auto', vue = 'budget';
  try {
    theme = localStorage.getItem('comptes.theme') || 'auto';
    vue = localStorage.getItem('comptes.vue') || 'budget';
    const ouverts = JSON.parse(localStorage.getItem('comptes.groupesOuverts') || '[]');
    if (Array.isArray(ouverts)) etat.groupesOuverts = new Set(ouverts);
  } catch (e) { /* stockage indisponible */ }
  appliqueTheme(theme);

  // Navigateur ou fichier : on ouvre le plus récent, sans jamais rien écraser d'illisible.
  const { donnees, messages, source } = chargeAuDemarrage();
  D = donnees || donneesDeDepart();
  const stocke = lisNavigateur();
  revisionConnue = revisionStockee();
  derniereSignature = stocke.etat === 'ok' ? signatureContenu(stocke.donnees) : null;
  const fichierEtaitAJour = fichierAJour();
  synchroniseLiens(moisActif());
  const resultat = enregistreDonnees({ force: true });          // n'écrit que si le contenu a changé
  if (resultat === 'ok' && source === 'fichier' && fichierEtaitAJour) {
    D.fichierRevision = D.revision;
    enregistreDonnees({ meta: true, force: true });
  } else if (resultat === 'inchange' && stocke.etat === 'ok' && stocke.donnees.fichierLe !== D.fichierLe) {
    enregistreDonnees({ meta: true, force: true });
  }
  if (!stockageDisponible) montreAlerteStockage();

  dessineTout();
  montreVue(location.hash.slice(1) || vue);
  ajusteAncrages();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajusteAncrages);
  if (navigator.storage && navigator.storage.persisted) {
    navigator.storage.persisted().then(v => { etat.persistance = v; majPageParametres(); }).catch(() => {});
  }
  for (const m of messages) toast(m.texte, { erreur: !!m.erreur, duree: 15000 });
}/* ========================================================================== */
/* 6 bis. Enregistrement et copies de sauvegarde                              */
/*                                                                            */
/* Les comptes s'enregistrent tout seuls dans le navigateur, à chaque         */
/* modification : il n'y a rien à « enregistrer » à la main, ni aucun         */
/* fichier à remplacer.                                                       */
/*                                                                            */
/* La copie de sauvegarde est un filet de sécurité en plus : un fichier       */
/* nouveau et daté (application + données), téléchargé d'un clic. Firefox     */
/* ne permet pas à une page d'écrire dans un fichier existant ; un fichier    */
/* neuf à chaque fois évite justement d'avoir à remplacer quoi que ce soit.   */
/* ========================================================================== */

function nomCopie(date = new Date()) {
  const deux = (n) => String(n).padStart(2, '0');
  return 'comptes-sauvegarde-' + date.getFullYear() + '-' + deux(date.getMonth() + 1) + '-' +
         deux(date.getDate()) + '-' + deux(date.getHours()) + 'h' + deux(date.getMinutes()) + '.html';
}

/** Une copie est conseillée quand la dernière est plus vieille que le rappel choisi
    et que des modifications ont eu lieu depuis. */
function copieConseillee() {
  const p = D.parametres;
  if (!p.rappelJours || fichierAJour()) return false;
  return joursDepuis(D.fichierLe) >= p.rappelJours;
}

function telechargeCopie() {
  if (enregistreMaintenant() === 'conflit') return false;
  const maintenant = new Date();
  D.fichierLe = maintenant.toISOString();
  D.fichierRevision = D.revision;
  const nom = nomCopie(maintenant);
  telecharge(nom, pageAvecDonnees(D), 'text/html;charset=utf-8');
  enregistreDonnees({ meta: true, force: true });
  dessineEtatFichier();
  majPageParametres();
  toast('Copie de sauvegarde téléchargée : « ' + nom + ' ». Rien à remplacer : continuez d’ouvrir ' +
        'votre fichier habituel, vos comptes y sont.', { duree: 8000 });
  return true;
}

/** Ctrl+S, ou clic sur la pastille « Enregistré » : rassure et propose une copie. */
function expliqueEnregistrement() {
  const resultat = enregistreMaintenant();
  if (resultat === 'conflit') return;
  if (!stockageDisponible) { montreAlerteStockage(); return; }
  signaleSauvegarde('Enregistré');
  toast('✓ Vos comptes sont enregistrés automatiquement dans ce navigateur, à chaque modification. ' +
        (D.fichierLe ? 'Dernière copie de sauvegarde : ' + dateCourte(D.fichierLe) + '.'
                     : 'Aucune copie de sauvegarde pour l’instant.'),
        { duree: 7000, action: { libelle: 'Télécharger une copie', faire: telechargeCopie } });
}

/* -- Auto-vérification : ouvrir le fichier avec #autotest ------------------ */

function verifie() {
  // Par sécurité, toute écriture dans le stockage est neutralisée pendant la vérification.
  stockageDisponible = false;
  const resultats = [];

  teste('Montant « 19,99 »', nombre('19,99'), 19.99);
  teste('Montant « 1 234,56 »', nombre('1 234,56'), 1234.56);
  teste('Montant « 12,50 € »', nombre('12,50 €'), 12.5);
  teste('Montant vide', nombre(''), 0);
  teste('Montant illisible', nombre('abc'), 0);
  teste('Montant « 1.234,56 » (point des milliers)', nombre('1.234,56'), 1234.56);
  teste('Montant négatif « -12,5 »', nombre('-12,5'), -12.5);

  teste('Heure « 09:30 »', minutesDepuisHeure('09:30'), 570);
  teste('Heure « 9h30 »', minutesDepuisHeure('9h30'), 570);
  teste('Heure « 9 »', minutesDepuisHeure('9'), 540);
  teste('Heure « 25:00 » refusée', minutesDepuisHeure('25:00'), null);
  teste('Heure illisible refusée', minutesDepuisHeure('abc'), null);
  teste('Plage à l’envers = 0', dureePlage('11:00', '09:00'), 0);
  teste('Plage incomplète = 0', dureePlage('09:00', ''), 0);

  // Les quatre journées relevées dans le tableau d'origine.
  const creneaux = [
    { semaine: 1, matinDebut: '10:04', matinFin: '11:30', apremDebut: '13:36', apremFin: '17:00' },
    { semaine: 1, matinDebut: '09:30', matinFin: '11:30', apremDebut: '12:30', apremFin: '15:00' },
    { semaine: 2, matinDebut: '10:00', matinFin: '11:30', apremDebut: '12:44', apremFin: '13:28' },
    { semaine: 3, matinDebut: '09:30', matinFin: '12:16', apremDebut: '12:48', apremFin: '13:19' },
  ];
  const h = recapHeures(creneaux, 12.02, 21.2);
  teste('Total des heures', h.minutes, 891);
  teste('Durée affichée', h.duree, '14 h 51');
  teste('Salaire brut', h.brut, eur(891 / 60 * 12.02));
  teste('Cotisations', h.cotisation, eur(h.brut * 0.212));
  teste('Salaire net', h.net, eur(h.brut - h.cotisation));

  const c = recapCourses(
    [{ numero: 1, budget: 100 }, { numero: 2, budget: 100 }],
    [{ semaine: 1, poste: 'Marché', montant: 23.40 },
     { semaine: 1, poste: 'Carrefour', montant: 62.80 },
     { semaine: 2, poste: 'Marché', montant: 18.90 }], 400);
  teste('Courses : total', c.depense, 105.10);
  teste('Courses : restant', c.restant, 294.90);
  teste('Courses : semaine 1', c.semaines[0].restant, 13.80);
  teste('Courses : dépassement', recapCourses([{ numero: 1, budget: 50 }],
        [{ semaine: 1, montant: 80 }], 50).restant, -30);

  const lignes = [
    { type: 'depense', nature: 'fixe', categorie: 'Santé', libelle: 'MNH',
      estime: 70, reel: 70, actif: true, lien: '' },
    { type: 'depense', nature: 'variable', categorie: 'Streaming', libelle: 'Disney+',
      estime: 12, reel: 0, actif: false, lien: '' },
    { type: 'depense', nature: 'fixe', categorie: 'Garde', libelle: 'Nounou',
      estime: 500, reel: 480, actif: true, lien: 'garde' },
    { type: 'salaire', nature: 'fixe', categorie: 'Salaire', libelle: 'Evry',
      estime: 1800, reel: 1750, actif: true, lien: '' },
    { type: 'aide', nature: 'variable', categorie: 'Aide', libelle: 'CAF',
      estime: 300, reel: 310, actif: true, lien: 'caf' },
  ];
  const b = recapBudget(lignes);
  teste('Ligne en pause hors des totaux', b.depenses.estime, 570);
  teste('Économie des pauses', b.economieEnPause, 12);
  teste('Dépenses réelles', b.depenses.reel, 550);
  teste('Charges fixes', b.depensesFixes.reel, 550);
  teste('Dépenses variables', b.depensesVariables.reel, 0);
  teste('Revenus réels', b.revenus.reel, 2060);
  teste('Reste à vivre', b.restant.reel, 1510);
  teste('Écart sur les dépenses', b.surplus.reel, 20);
  teste('Coût net de la garde', b.gardeNette.reel, 170);
  teste('Revenus absents des catégories',
        b.parCategorie.some(x => x.categorie === 'Salaire'), false);
  // Désactiver une ligne DÉJÀ PAYÉE doit la retirer du total payé et du reste.
  const avecPause = recapBudget([
    { type: 'salaire', nature: 'fixe', estime: 1000, reel: 1000, actif: true },
    { type: 'depense', nature: 'variable', categorie: 'Abonnements', libelle: 'Claude Max',
      estime: 90, reel: 90, actif: false },
    { type: 'depense', nature: 'fixe', categorie: 'Santé', libelle: 'MNH',
      estime: 70, reel: 70, actif: true },
  ]);
  teste('Pause : le payé d’une ligne en pause sort du total', avecPause.depenses.reel, 70);
  teste('Pause : le reste à vivre remonte d’autant', avecPause.restant.reel, 930);
  teste('Pause : la catégorie tombe à zéro',
        avecPause.parCategorie.find(c => c.categorie === 'Abonnements').reel, 0);
  teste('Pause : la catégorie compte sa ligne en pause',
        avecPause.parCategorie.find(c => c.categorie === 'Abonnements').enPause, 1);
  teste('Pause : un revenu en pause sort des revenus', recapBudget([
    { type: 'salaire', nature: 'fixe', estime: 500, reel: 500, actif: false },
    { type: 'aide', nature: 'fixe', estime: 200, reel: 200, actif: true },
  ]).revenus.reel, 200);
  teste('Type inconnu ignoré',
        recapBudget([{ type: 'autre', nature: 'fixe', estime: 99, reel: 99, actif: true }])
          .depenses.reel, 0);

  // Duplication d'un mois.
  D = { version: 2, prochainId: 1, moisActif: null, parametres: JSON.parse(JSON.stringify(PARAMETRES_DEFAUT)), mois: [] };
  const source = creeMois('2026-01');
  source.lignes.push({ id: D.prochainId++, type: 'depense', nature: 'fixe', categorie: 'A',
                       libelle: 'X', estime: 10, reel: 9, actif: false, note: '', lien: '',
                       rang: 10 });
  const copie = creeMois('2026-02', source.id);
  teste('Duplication : nombre de lignes', copie.lignes.length, source.lignes.length);
  teste('Duplication : réels à zéro', copie.lignes.every(l => l.reel === 0), true);
  teste('Duplication : prévus conservés', copie.lignes[0].estime, 10);
  teste('Duplication : pauses conservées', copie.lignes[0].actif, false);
  teste('Duplication : identifiants distincts', copie.lignes[0].id !== source.lignes[0].id, true);
  teste('Un mois créé deux fois n’est pas dupliqué', creeMois('2026-01').id, source.id);
  teste('Créneaux créés', copie.creneaux.length, 28);

  // Liaison entre le budget et les modules.
  donneesDeDepart();
  const mois = moisActif();
  const ligneCourses = ligneReliee(mois, 'courses');
  const ligneHeures = ligneReliee(mois, 'heures');
  teste('Une ligne de dépense est reliée aux courses', !!ligneCourses, true);
  teste('Un revenu est relié aux heures', !!ligneHeures, true);

  ligneCourses.estime = 250;
  teste('Le budget des courses suit la ligne de dépense', budgetCourses(mois), 250);
  creeAchat({ semaine: 1, poste: 'Marché', libelle: 'Pain', montant: 12.30 });
  creeAchat({ semaine: 2, poste: 'Carrefour', libelle: 'Épicerie', montant: 47.70 });
  synchroniseLiens(mois);
  teste('Courses : l’enveloppe entière reste comptée comme payée, malgré les achats', ligneCourses.reel, 250);
  teste('Courses : les achats ne changent pas le total des dépenses du budget',
        recap(mois).budget.depenses.reel, (() => { const m = JSON.parse(JSON.stringify(mois)); m.achats = []; return recap(m).budget.depenses.reel; })());
  teste('Le restant courses tient compte du budget confié',
        recap(mois).courses.restant, 190);
  teste('Le salaire net remonte dans le revenu', ligneHeures.reel, 140.66);

  // Une ligne déliée cesse d'être pilotée par son module.
  ligneCourses.lien = '';
  ligneCourses.reel = 999;
  synchroniseLiens(mois);
  teste('Une ligne déliée garde son montant saisi', ligneCourses.reel, 999);
  ligneCourses.lien = 'courses';
  synchroniseLiens(mois);
  teste('Reliée à nouveau, elle reprend l’enveloppe du module', ligneCourses.reel, 250);

  // Modifier le budget depuis le module Courses modifie la ligne de dépense (une seule source).
  ecrisMois(mois, 'budgetCourses', '320,50');
  teste('Budget courses saisi dans le module = prévu de la dépense', ligneCourses.estime, 320.5);
  teste('Et le module le relit', budgetCourses(mois), 320.5);
  synchroniseLiens(mois);
  teste('Et le payé de la dépense suit', ligneCourses.reel, 320.5);
  ecrisLigne(ligneCourses, 'estime', '410');
  synchroniseLiens(mois);
  teste('Budget modifié dans le budget du mois = budget du module', budgetCourses(mois), 410);
  teste('… et compté en entier', ligneCourses.reel, 410);
  creeAchat({ semaine: 1, poste: 'Marché', libelle: 'Gros plein', montant: 500 });
  synchroniseLiens(mois);
  teste('Courses dépassées : le budget du mois garde l’enveloppe', ligneCourses.reel, 410);
  teste('… et le module signale le dépassement', recap(mois).courses.restant, -150);

  // Un module ne pilote qu'une seule ligne.
  const autre = creeLigne({ type: 'depense', categorie: 'Quotidien', libelle: 'Marché' });
  ecrisLigne(autre, 'lien', 'courses');
  teste('Relier une 2e ligne aux courses délie la première', ligneCourses.lien, '');
  teste('La nouvelle ligne est bien reliée', ligneReliee(mois, 'courses').id, autre.id);

  // Saisie des horaires.
  const creneau = mois.creneaux.find(c => c.semaine === 4 && c.jour === 2);
  teste('Horaire « 8h5 » normalisé', ecrisCreneau(creneau, 'matinDebut', '8h5'), '08:05');
  teste('Horaire illisible effacé', ecrisCreneau(creneau, 'matinFin', 'midi'), '');

  // Anciennes données (version 1) : les revenus deviennent des catégories, rien n'est perdu.
  const ancienFormat = validees({ version: 1, prochainId: 10, moisActif: 1, mois: [{ id: 1, libelle: '2026-08',
    lignes: [
      { id: 2, type: 'salaire', nature: 'fixe', categorie: 'Salaire', libelle: 'Evry', estime: 100, reel: 90, actif: true },
      { id: 3, type: 'aide', nature: 'fixe', categorie: 'Aide', libelle: 'RLP', estime: 50, reel: 50, actif: true },
      { id: 4, type: 'depense', nature: 'fixe', categorie: 'Santé', libelle: 'MNH', estime: 70, reel: 70, actif: true },
    ], semaines: [], achats: [], creneaux: [] }] });
  teste('Migration : « Salaire » devient la catégorie « Salaires »', ancienFormat.mois[0].lignes[0].categorie, 'Salaires');
  teste('Migration : « Aide » devient la catégorie « Aides »', ancienFormat.mois[0].lignes[1].categorie, 'Aides');
  teste('Migration : les catégories de dépenses sont recensées',
        ancienFormat.parametres.categoriesDepenses.map(c => c.nom), ['Santé']);
  teste('Migration : les catégories de revenus sont recensées',
        ancienFormat.parametres.categoriesRevenus.map(c => c.nom), ['Salaires', 'Aides']);
  teste('Migration : les montants sont intacts', recapBudget(ancienFormat.mois[0].lignes).restant.reel, 70);

  // Catégories : opérations sur tous les mois à la fois.
  donneesDeDepart();
  const septembre = moisActif();
  const octobre = creeMois('2099-10', septembre.id);
  const nbAbonnements = (m) => m.lignes.filter(l => l.categorie === 'Abonnements').length;
  const avantRenommage = nbAbonnements(septembre);
  let erreurDoublon = null;
  try { creeCategorie('depense', 'abonnements'); } catch (e) { erreurDoublon = e.message; }
  teste('Catégorie : un doublon est refusé (même sans majuscule)', !!erreurDoublon, true);
  const vide = creeCategorie('depense', 'Vacances', 'variable');
  teste('Catégorie : une catégorie vide existe pour tous les mois',
        groupesDepenses(octobre).some(g => g.nom === 'Vacances' && g.lignes.length === 0), true);
  teste('Catégorie : renommer agit sur tous les mois', renommeCategorie('depense', 'Abonnements', 'Abonnements en ligne'), 'renommee');
  teste('Catégorie : lignes renommées en septembre', septembre.lignes.filter(l => l.categorie === 'Abonnements en ligne').length, avantRenommage);
  teste('Catégorie : lignes renommées en octobre', octobre.lignes.filter(l => l.categorie === 'Abonnements en ligne').length, avantRenommage);
  const nbStreaming = septembre.lignes.filter(l => l.categorie === 'Streaming').length;
  teste('Catégorie : renommer vers un nom existant fusionne', renommeCategorie('depense', 'Streaming', 'abonnements EN LIGNE'), 'fusionnee');
  teste('Catégorie : après fusion, les lignes sont réunies',
        septembre.lignes.filter(l => l.categorie === 'Abonnements en ligne').length, avantRenommage + nbStreaming);
  teste('Catégorie : après fusion, l’ancienne a disparu', !!trouveCategorie('depense', 'Streaming'), false);
  const totalAvant = recapBudget(septembre.lignes).depenses.reel;
  const bilanDeplacement = supprimeCategorie('depense', 'Presse', 'Autres');
  teste('Catégorie : supprimer en déplaçant garde les lignes', bilanDeplacement.deplacees, 2 * 2);
  teste('Catégorie : le total ne bouge pas quand on déplace', recapBudget(septembre.lignes).depenses.reel, totalAvant);
  const nbBanque = septembre.lignes.filter(l => l.categorie === 'Banque').length;
  const bilanSuppression = supprimeCategorie('depense', 'Banque', null);
  teste('Catégorie : supprimer sans destination retire ses lignes partout', bilanSuppression.supprimees, nbBanque * 2);
  teste('Catégorie : le total baisse du montant de la catégorie supprimée',
        recapBudget(septembre.lignes).depenses.reel, eur(totalAvant - 10));
  const ordre = categoriesDe('depense').map(c => c.nom);
  deplaceCategorie('depense', ordre[1], -1);
  teste('Catégorie : monter échange avec la précédente', categoriesDe('depense').slice(0, 2).map(c => c.nom), [ordre[1], ordre[0]]);
  teste('Catégorie : la première ne peut pas monter', deplaceCategorie('depense', categoriesDe('depense')[0].nom, -1), false);
  teste('Catégorie : un nom inconnu tapé sur une ligne crée la catégorie',
        (ecrisLigne(septembre.lignes[0], 'categorie', 'Nouvelle'), !!trouveCategorie('depense', 'Nouvelle')), true);
  teste('Catégorie : de même pour les revenus',
        (ecrisLigne(septembre.lignes.find(l => l.type !== 'depense'), 'categorie', 'Primes'), !!trouveCategorie('revenu', 'Primes')), true);
  teste('Totaux par catégorie de revenus', recapBudget(septembre.lignes).parCategorieRevenus.some(c => c.categorie === 'Primes'), true);

  // Le fichier enregistré contient les données, et les restitue à l'identique.
  const page = pageAvecDonnees(D);
  const relue = new DOMParser().parseFromString(page, 'text/html');
  const integrees = validees(JSON.parse(relue.getElementById('donnees-integrees').textContent));
  teste('Fichier : les données sont intégrées à la page', !!integrees, true);
  teste('Fichier : restituées à l’identique', integrees && signatureContenu(integrees), signatureContenu(D));
  teste('Fichier : l’application est incluse', page.includes('function dessineTout()'), true);
  teste('Fichier : une seule balise de données', relue.querySelectorAll('#donnees-integrees').length, 1);
  const piege = JSON.parse(JSON.stringify(D));
  piege.mois[0].lignes[0].libelle = '<\/script><script>alert(1)<\/script>';
  const pagePiege = new DOMParser().parseFromString(pageAvecDonnees(piege), 'text/html');
  teste('Fichier : un libellé contenant « <\/script> » ne casse pas la page',
        validees(JSON.parse(pagePiege.getElementById('donnees-integrees').textContent)).mois[0].lignes[0].libelle,
        '<\/script><script>alert(1)<\/script>');
  teste('Empreinte : ignore les informations d’enregistrement',
        signatureContenu(Object.assign({}, D, { revision: 999, modifieLe: 'x', fichierLe: 'y' })), signatureContenu(D));

  // Copies de sauvegarde : nom daté, rappel seulement s'il y a du nouveau depuis la dernière copie.
  teste('Copie : nom daté, jamais le même que le fichier', nomCopie(new Date(2026, 8, 5, 7, 3)), 'comptes-sauvegarde-2026-09-05-07h03.html');
  const memo = { fichierLe: D.fichierLe, fichierRevision: D.fichierRevision, rappel: D.parametres.rappelJours };
  D.parametres.rappelJours = 7;
  D.fichierLe = null; D.fichierRevision = null;
  teste('Copie : conseillée quand il n’y en a jamais eu', copieConseillee(), true);
  D.fichierLe = new Date(Date.now() - 10 * 86400000).toISOString(); D.fichierRevision = D.revision - 1;
  teste('Copie : conseillée quand la dernière est ancienne et dépassée', copieConseillee(), true);
  D.fichierRevision = D.revision;
  teste('Copie : pas de rappel si rien n’a changé depuis', copieConseillee(), false);
  D.fichierLe = new Date(Date.now() - 2 * 86400000).toISOString(); D.fichierRevision = D.revision - 1;
  teste('Copie : pas de rappel avant le délai choisi', copieConseillee(), false);
  D.parametres.rappelJours = 0; D.fichierLe = null;
  teste('Copie : rappel désactivable', copieConseillee(), false);
  Object.assign(D, { fichierLe: memo.fichierLe, fichierRevision: memo.fichierRevision }); D.parametres.rappelJours = memo.rappel;

  // Aller-retour export / import.
  donneesDeDepart();
  synchroniseLiens(moisActif());
  const avant = recap(moisActif());
  const relu = validees(JSON.parse(JSON.stringify(D)));
  const apres = recap(relu.mois.find(m => m.id === relu.moisActif));
  teste('Sauvegarde/restauration : dépenses', apres.budget.depenses, avant.budget.depenses);
  teste('Sauvegarde/restauration : heures', apres.heures.minutes, avant.heures.minutes);
  teste('Données de départ : nombre de lignes', moisActif().lignes.length, 47);

  const rates = resultats.filter(r => !r.memeChose);
  document.body.replaceChildren(el('div', { class: 'verif' },
    el('h2', { texte: 'Auto-vérification des calculs' }),
    el('ul', {}, resultats.map(r => el('li', {},
      el('span', { class: r.memeChose ? 'ok' : 'ko', texte: r.memeChose ? '✓' : '✕' }),
      el('span', { texte: r.nom }),
      r.memeChose ? null : el('span', { class: 'ko',
        texte: ' → obtenu ' + JSON.stringify(r.obtenu) +
               ', attendu ' + JSON.stringify(r.attendu) })))),
    el('p', { class: 'verif__bilan',
              texte: rates.length
                ? rates.length + ' vérification(s) en échec sur ' + resultats.length
                : resultats.length + ' vérifications passées.' }),
    el('p', {}, el('a', { href: '#budget', onclick: () => location.reload() },
                   '← Revenir à l’application'))));
  document.title = (rates.length ? 'ECHECS=' + rates.length : 'TOUT OK') +
                   ' (' + resultats.length + ' verifications)';
}

if (location.hash.slice(1) === 'autotest') verifie(); else demarre();
