<!doctype html>
<html lang="fr" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comptes</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>💶</text></svg>">
</head>
<body>

<header class="barre">
  <div class="barre__titre">
    <span class="barre__logo" aria-hidden="true">€</span>
    <h1>Comptes</h1>
  </div>

  <div class="barre__mois">
    <label class="visuellement-cache" for="choix-mois">Mois affiché</label>
    <select id="choix-mois"></select>
    <button type="button" id="btn-mois-precedent" class="bouton bouton--icone" title="Mois précédent">‹</button>
    <button type="button" id="btn-mois-suivant" class="bouton bouton--icone" title="Mois suivant">›</button>
  </div>

  <div class="barre__actions">
    <button type="button" id="btn-nouveau-mois" class="bouton bouton--primaire">+ Nouveau mois</button>
    <details class="menu">
      <summary class="bouton" title="Plus d'options">⋯</summary>
      <div class="menu__contenu">
        <button type="button" data-action="export-csv">Exporter ce mois (CSV)</button>
        <button type="button" data-action="export-json">Sauvegarder tout (JSON)</button>
        <button type="button" data-action="import-json">Restaurer une sauvegarde…</button>
        <hr>
        <button type="button" data-action="theme">Thème : <span id="etat-theme">auto</span></button>
        <hr>
        <button type="button" data-action="supprimer-mois" class="danger">Supprimer ce mois…</button>
      </div>
    </details>
    <input type="file" id="fichier-import" accept="application/json,.json" hidden>
  </div>
</header>

<nav class="onglets" role="tablist" aria-label="Sections">
  <button type="button" role="tab" class="onglet" data-vue="tableau" aria-selected="true">Tableau de bord</button>
  <button type="button" role="tab" class="onglet" data-vue="depenses" aria-selected="false">Dépenses</button>
  <button type="button" role="tab" class="onglet" data-vue="revenus" aria-selected="false">Revenus</button>
  <button type="button" role="tab" class="onglet" data-vue="courses" aria-selected="false">Courses</button>
  <button type="button" role="tab" class="onglet" data-vue="heures" aria-selected="false">Heures gardées</button>
</nav>

<main id="contenu">

  <!-- ------------------------------------------------ Tableau de bord -->
  <section class="vue" id="vue-tableau" role="tabpanel" aria-label="Tableau de bord">
    <div class="heros" id="heros"></div>
    <div class="tuiles" id="tuiles"></div>

    <div class="grille-deux">
      <article class="carte viz-root" id="carte-categories">
        <header class="carte__entete">
          <h2>Dépenses par catégorie</h2>
          <p class="carte__sous-titre">Barre : dépensé · trait : prévu</p>
        </header>
        <div id="graphique-categories" class="graphique"></div>
        <details class="tableau-jumeau">
          <summary>Voir les chiffres</summary>
          <div id="tableau-categories"></div>
        </details>
      </article>

      <div class="pile">
        <article class="carte" id="carte-courses-resume"></article>
        <article class="carte" id="carte-heures-resume"></article>
        <article class="carte" id="carte-pause"></article>
      </div>
    </div>
  </section>

  <!-- ------------------------------------------------------- Dépenses -->
  <section class="vue" id="vue-depenses" role="tabpanel" aria-label="Dépenses" hidden>
    <div class="outils">
      <div class="segmente" role="group" aria-label="Filtrer par nature">
        <button type="button" data-filtre-nature="tout" class="actif">Tout</button>
        <button type="button" data-filtre-nature="fixe">Fixes</button>
        <button type="button" data-filtre-nature="variable">Variables</button>
      </div>
      <input type="search" id="recherche-depenses" class="champ-recherche"
             placeholder="Rechercher une dépense…" aria-label="Rechercher une dépense">
      <label class="interrupteur-texte">
        <input type="checkbox" id="masquer-pause"> Masquer les lignes en pause
      </label>
      <span class="pousse"></span>
      <button type="button" class="bouton bouton--primaire" data-ajouter="depense">+ Ajouter une dépense</button>
    </div>
    <div id="table-depenses"></div>
  </section>

  <!-- -------------------------------------------------------- Revenus -->
  <section class="vue" id="vue-revenus" role="tabpanel" aria-label="Revenus" hidden>
    <div class="outils">
      <div class="segmente" role="group" aria-label="Filtrer par type">
        <button type="button" data-filtre-revenu="tout" class="actif">Tout</button>
        <button type="button" data-filtre-revenu="salaire">Salaires</button>
        <button type="button" data-filtre-revenu="aide">Aides</button>
      </div>
      <span class="pousse"></span>
      <button type="button" class="bouton" data-ajouter="aide">+ Ajouter une aide</button>
      <button type="button" class="bouton bouton--primaire" data-ajouter="salaire">+ Ajouter un salaire</button>
    </div>
    <div id="table-revenus"></div>
  </section>

  <!-- -------------------------------------------------------- Courses -->
  <section class="vue" id="vue-courses" role="tabpanel" aria-label="Courses" hidden>
    <div class="outils">
      <label class="champ-inline">Budget courses du mois
        <input type="text" inputmode="decimal" id="budget-courses" class="montant">
      </label>
      <span class="pousse"></span>
      <button type="button" class="bouton" id="btn-retirer-semaine">− Semaine</button>
      <button type="button" class="bouton" id="btn-ajouter-semaine">+ Semaine</button>
      <button type="button" class="bouton bouton--primaire" data-report="courses">
        Reporter le total dans les dépenses
      </button>
    </div>
    <div id="resume-courses"></div>
    <div id="semaines-courses" class="semaines"></div>
  </section>

  <!-- --------------------------------------------------------- Heures -->
  <section class="vue" id="vue-heures" role="tabpanel" aria-label="Heures gardées" hidden>
    <div class="outils">
      <label class="champ-inline">Taux horaire
        <input type="text" inputmode="decimal" id="taux-horaire" class="montant">
      </label>
      <label class="champ-inline">Cotisations (%)
        <input type="text" inputmode="decimal" id="taux-cotisation" class="montant">
      </label>
      <span class="pousse"></span>
      <button type="button" class="bouton bouton--primaire" data-report="heures">
        Reporter le net dans les revenus
      </button>
    </div>
    <div id="resume-heures"></div>
    <div id="semaines-heures" class="semaines"></div>
  </section>

</main>

<div id="infobulle" class="infobulle" role="status" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="sauvegarde" class="sauvegarde" aria-live="polite"></div>

<script src="/app.js"></script>
</body>
</html>
